<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>rknn-toolkit2模型推理｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":13,"title":"rknn-toolkit2模型推理","intro":"使用 Toolkit2 完成 PC 模拟器和 RK3588 联板推理。","goals":["理解 `load_rknn → init_runtime → inference → release`","区分模拟器与真实 NPU","验证输入张量及推理结果"],"core":"模型转换后可以利用 RKNN-Toolkit2 加载 `.rknn` 进行模拟器测试，也可以在主机连接目标开发板后指定 RK3588 进行联板推理。两种方式的执行位置不同，数值差异、性能和依赖条件也可能不同，尤其不能把模拟器耗时当作 NPU 吞吐。","steps":["准备已验证的 RKNN 模型和一组固定测试输入","在主机加载模型，初始化模拟器，执行推理并保存输出","检查输入大小、布局、dtype 和颜色通道","连接开发板并按 SDK 设置目标平台以执行联板推理","对比输入与输出，调查不一致的来源"],"pitfalls":["联板驱动/运行时不匹配会导致初始化失败","推理需要实际张量；不同于模型转换，不能省略输入预处理"],"checks":["至少用同一输入完成一次模拟器和一次联板验证","能说明何时必须检查设备端 runtime 和 driver"],"homework":["设计一张模拟器与联板输出和性能的对照表"],"code":"from rknn.api import RKNN\nrknn = RKNN()\ntry:\n    assert rknn.load_rknn('model.rknn') == 0\n    assert rknn.init_runtime() == 0  # 模拟器；联板请按 SDK 指定 target\n    # outputs = rknn.inference(inputs=[input_tensor])\n    # input_tensor 应满足模型的 shape / dtype / layout\nfinally:\n    rknn.release()"}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"RKNN Toolkit2 的推理角色","explain":"PC 端 RKNN-Toolkit2 可加载 `.rknn`，通过 `init_runtime` 等接口在受支持路径上验证模型，部分配置可通过板端 target 执行。运行位置影响所测性能。`inference` 接口通常返回模型输出 tensor，而不是已经转换成分类结果或检测框。要先确认输入 layout、format 和输出 tensor 数量。","takeaway":"能解释为什么获取输出数组后仍需要模型专用的后处理。"},{"title":"模拟器与 NPU 的差异","explain":"模拟执行、板端 NPU 实际执行及硬件驱动的数值行为可能因算子实现和 dtype 差异出现误差。模拟器耗时不能作为 NPU 性能结论；即使功能差异很小，也需在真实设备上测量。要分别记录 `init_runtime` 的 target 和 device 配置。","takeaway":"将‘功能一致性’和‘运行速度’分开验收，避免把模拟器 FPS 写成硬件 FPS。"},{"title":"最小结果回归","explain":"分类可以比较 top-k 索引及置信度差；检测需要先还原 decoded boxes 再比较模型任务级指标。使用固定测试图和确定性预处理可重复得到输出摘要，定位变化是在加载、输入、执行还是后处理阶段。","takeaway":"不要使用随机未保存输入来判断不同版本之间的精度。"}],"lab":[{"title":"打印张量协议","action":"读取可用 `.rknn` 文件并初始化运行时，打印输入输出数量与实际输出 shape、dtype。","verify":"能说清输出数组第一维是否包含 batch。"},{"title":"固定输入做推理","action":"使用与模型约定匹配的单张测试图或 numpy 数组运行，保存输出前若干数值。","verify":"重复运行对同一输入具有合理数值一致性。"},{"title":"板端核对","action":"如果已有可用 RK3588 设备和匹配运行库，分别在主机和板端执行同一模型，保存分环境结果。","verify":"对差异作出定量说明，不把主机耗时用作 NPU FPS。"}],"diagnosis":[{"symptom":"init_runtime 报设备连接错误","reason":"target/device_id 配置、ADB/网络或目标板支持状态有问题。","check":"区分模拟器模式与目标板模式，查看相应错误日志和连接状态。"},{"symptom":"inference 返回 shape 不符","reason":"输入 layout、dtype 与转换后模型实际要求不匹配。","check":"打印输入原数组属性和 SDK 接口要求，必要时明确指定格式。"}],"case":{"problem":"在 PC `init_runtime()` 正常、推理为 35ms，是否能宣传 RK3588 上达到 28 FPS？","analysis":"不能。PC 模拟路径不等于 NPU。必须在真实 RK3588 上经 warm-up 多次测量 NPU 与端到端时间后，才能发布板端数据。","evidence":"运行目标说明、版本、样本数和计时范围。"},"snippet":"from rknn.api import RKNN\nr = RKNN()\ntry:\n    rc = r.load_rknn('model.rknn')\n    if rc != 0: raise RuntimeError(f'load={rc}')\n    rc = r.init_runtime()  # 主机模拟；若需目标板请核对 target 参数\n    if rc != 0: raise RuntimeError(f'init={rc}')\n    # 需准备 shape、dtype、layout 正确的 numpy 输入再调用 inference\nfinally:\n    r.release()","refs":[["RKNN-Toolkit2 官方示例","https://github.com/airockchip/rknn-toolkit2"],["RKNN 用户指南","https://github.com/airockchip/rknn-toolkit2/tree/master/doc"],["RKNN Model Zoo 功能验证","https://github.com/airockchip/rknn_model_zoo"]],"walkthrough":{"intro":"第 13 讲用 Toolkit2 在主机模拟环境或已配置的 RK3588 目标端运行真实 RKNN，保存输出 NPZ；模拟器返回的耗时不是板端 NPU 时间。","flow":["已转换 .rknn","预处理 input.npy","load_rknn/init_runtime","inference","output_*.npz"],"steps":[{"api":"读取输入张量而非直接塞 JPG","input":"input.npy（模型要求的 shape/dtype/layout）","output":"NumPy 输入数组","why":"NPY 必须在传给 Toolkit2 前完成颜色、尺寸、均值标准差等模型相关处理；不要仅凭尺寸相同就判定输入协议相同。","code":"x = np.load('build/input.npy', allow_pickle=False)\nprint(x.shape, x.dtype)"},{"api":"load_rknn + init_runtime：指定实际运行位置","input":"兼容的 .rknn 与 --target simulator / rk3588","output":"可供 inference 的 SDK 运行上下文","why":"主机模拟器与板端目标的 runtime 初始化参数不同；未连接目标时不要用模拟运行推断 NPU 硬件速度。","code":"r = RKNN()\nr.load_rknn('build/tiny.rknn')\nr.init_runtime()  # 默认本机模拟；连接硬件需对应 SDK/设备配置"},{"api":"inference 与原始输出归档","input":"inputs=[x]、runs 次数","output":"真实输出张量列表，NPZ 中命名 output_0 等","why":"先看每个输出的 shape 和 dtype，再进入分类或检测后处理；不能把输出张量存在当成预测结果已经正确。","code":"output = r.inference(inputs=[x])\nnp.savez('build/rknn_output.npz', **{'output_'+str(i):v for i,v in enumerate(output)})"}],"example":"一次实验应留下 model.rknn、input.npy、output_0 的 shape/dtype 与 SDK 返回日志。对于分类模型一维 score 可排序；对于 YOLO 的多输出必须先按模型协议解码。","acceptance":"明确记录 target=simulator 还是板端 rk3588；只有真实板端运行并保存输入和输出才可计入 NPU 实验。"}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
