<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>rknn-toolkit2模型推理｜RK3588 HTML 教学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":13,"title":"rknn-toolkit2模型推理","intro":"使用 Toolkit2 完成 PC 模拟器和 RK3588 联板推理。","goals":["理解 `load_rknn → init_runtime → inference → release`","区分模拟器与真实 NPU","验证输入张量及推理结果"],"core":"模型转换后可以利用 RKNN-Toolkit2 加载 `.rknn` 进行模拟器测试，也可以在主机连接目标开发板后指定 RK3588 进行联板推理。两种方式的执行位置不同，数值差异、性能和依赖条件也可能不同，尤其不能把模拟器耗时当作 NPU 吞吐。","steps":["准备已验证的 RKNN 模型和一组固定测试输入","在主机加载模型，初始化模拟器，执行推理并保存输出","检查输入大小、布局、dtype 和颜色通道","连接开发板并按 SDK 设置目标平台以执行联板推理","对比输入与输出，调查不一致的来源"],"checks":["至少用同一输入完成一次模拟器和一次联板验证","能说明何时必须检查设备端 runtime 和 driver"],"pitfalls":["联板驱动/运行时不匹配会导致初始化失败","推理需要实际张量；不同于模型转换，不能省略输入预处理"],"homework":["设计一张模拟器与联板输出和性能的对照表"],"code":"from rknn.api import RKNN\nrknn = RKNN()\ntry:\n    assert rknn.load_rknn('model.rknn') == 0\n    assert rknn.init_runtime() == 0  # 模拟器；联板请按 SDK 指定 target\n    # outputs = rknn.inference(inputs=[input_tensor])\n    # input_tensor 应满足模型的 shape / dtype / layout\nfinally:\n    rknn.release()"}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
