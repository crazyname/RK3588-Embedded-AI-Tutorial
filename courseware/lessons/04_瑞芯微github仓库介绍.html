<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>瑞芯微github仓库介绍｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":4,"title":"瑞芯微github仓库介绍","intro":"学会查找 Rockchip 官方套件与模型示例。","goals":["区分 RKNN-Toolkit2、RKNN-Toolkit-Lite2 与 RKNPU2","识别模型示例库的用途","建立官方版本与示例的检索习惯"],"core":"RKNN-Toolkit2 主要在 PC 端进行模型转换、评估与联板调试；RKNN-Toolkit-Lite2 提供开发板端 Python 推理接口；RKNPU2 面向板端 C/C++ 推理。rknn_model_zoo 聚合常见模型的参考部署方案。大型语言模型的转换与推理通常使用另一条 RKLLM 工具链。官方组织入口为 https://github.com/airockchip ，以目标 SDK release 的 README、示例和兼容矩阵为准。","steps":["定位官方组织和相关仓库","查看所需 SDK 的 README、Release Notes、examples","找到一份支持 RK3588 的分类或检测示例","记录 wheel、运行时、模型版本与仓库 commit"],"pitfalls":["不要跨 release 随意混用 wheel 和动态库","第三方教程的路径与参数可能已过期"],"checks":["能根据转换/板端 Python/板端 C 需求找到正确仓库","能识别不同套件的 CPU 架构和运行位置"],"homework":["制作工具套件、主机平台和语言接口三列表"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"找到真正维护的官方资料","explain":"历史教程常引用 rockchip-linux/rknn-toolkit2，但该仓库已说明不再维护并迁移到 airockchip/rknn-toolkit2。查阅时应从新仓库根目录、README、doc、rknn-toolkit2、rknn_toolkit_lite2、rknpu2 与 CHANGELOG 入手。下载 wheel、lib 与源码必须避免多个年份版本混搭。","takeaway":"遇到教程链接过期，先定位维护仓库和 release tag，再决定是否跟随旧教程。"},{"title":"SDK、模型动物园和训练项目的区别","explain":"RKNN-Toolkit2 提供模型转换与主机调试；RKNN Model Zoo 提供 MobileNet、YOLO 等模型与具体平台转换/编译/运行示例；Ultralytics 等训练框架负责权重训练与 ONNX 导出。即使都放在 GitHub，也不是同一个功能仓库。阅读 README 首先区分平台支持列表、输入格式、构建参数和预期结果。","takeaway":"知道模型要去哪找、转换脚本去哪找、C++ 推理示例去哪找。"},{"title":"用版本固定避免‘昨天能跑’","explain":"示例工程随上游更新可能改变参数与输出张量顺序。学习报告里至少记录仓库 URL、commit/tag、模型文件校验值、运行时版本和本地修改。需要排查问题时，优先回到固定版本的最小示例，排除动态更新造成的环境漂移。","takeaway":"复现实验优先记录 commit SHA，而不是只写‘下载最新版’。"}],"lab":[{"title":"建立参考仓库清单","action":"打开官方 Toolkit2、Model Zoo、RKLLM 和 ONNX 四个项目；分别写出其职责与使用阶段。","verify":"四个入口链接和对应的任务没有混淆。"},{"title":"复刻一个官方案例阅读","action":"在 rknn_model_zoo/examples/yolov5/README.md 查找 Linux build、转换脚本、预训练模型和结果预期章节。","verify":"找到具体输入和运行方式，不照搬不同目标芯片的路径。"},{"title":"记录仓库版本","action":"用 git clone 获取官方仓库，执行 git rev-parse HEAD、git status --short 和 git remote -v，保存到环境表。","verify":"版本、远程来源与本地修改状态可被重现。"}],"diagnosis":[{"symptom":"明明照官方命令仍提示参数缺失","reason":"读取的是另一版本 SDK 的 README 或示例。","check":"记录当前 commit 并核对同一版本下的 Quick Start、changelog 与命令帮助。"},{"symptom":"复制了不支持 RK3588 的工程","reason":"混淆 RKNPU1 旧平台与 RKNPU2 芯片支持。","check":"先查看 Model Zoo 的 supported platform 和 cpp/rknpu2 目录。"}],"case":{"problem":"某博客说 Toolkit2 只能用于 Ubuntu 20.04，但官方新版本提供了更新的 wheel。该相信谁？","analysis":"先分清发布日期和 SDK tag，再核对官方 release 包、quick start 支持矩阵与实际 wheel 文件名。旧教程有助于理解思路，却不一定是当前环境安装的正确依据。","evidence":"官方仓库 commit、wheel 文件名、系统/Python 版本匹配表。"},"snippet":"git clone https://github.com/airockchip/rknn-toolkit2.git\ngit -C rknn-toolkit2 rev-parse HEAD\ngit -C rknn-toolkit2 remote -v\n# 示例只读取版本信息；安装步骤请跟随与本机匹配的 release。","refs":[["新版 RKNN-Toolkit2","https://github.com/airockchip/rknn-toolkit2"],["RKNN Model Zoo","https://github.com/airockchip/rknn_model_zoo"],["Rockchip RKLLM","https://github.com/airockchip/rknn-llm"]]}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
