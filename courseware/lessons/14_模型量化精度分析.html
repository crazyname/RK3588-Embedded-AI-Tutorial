<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型量化精度分析｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":14,"title":"模型量化精度分析","intro":"理解普通量化、逐层精度定位和混合量化。","goals":["理解 INT8 量化的收益及误差来源","学会构建有代表性的校准集","依据量化分析结果制定优化策略"],"core":"量化将浮点权重和激活映射到较低比特宽度，可减少带宽、内存占用并提升 NPU 上部分模型的吞吐，但可能损失精度。训练集、校准集与验证集作用不同。分析时应同时比较 FP 参考输出、非量化 RKNN 和量化 RKNN 的预测及逐层误差；若个别层量化敏感，可考虑混合精度，再评估性能损失。","steps":["建立未量化模型的指标和推理结果基线","准备能代表真实部署场景的校准样本","构建普通 INT8 量化 RKNN","运行精度分析工具并识别误差集中的层","尝试适当量化策略或混合量化，并比较精度、耗时和内存"],"pitfalls":["单张图片识别正确不代表量化模型精度合格","校准集分布偏离真实场景会降低量化稳定性","逐层差异较小也不能替代端到端任务指标"],"checks":["能够以任务级精度数据证明量化方案合理","能解释为何混合量化可能更准确但更慢"],"homework":["设计 FP、INT8、混合精度三组对照实验"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"量化的数值模型","explain":"线性量化常把浮点值 x 映射到整数 q≈round(x/scale)+zero_point，然后在适当阶段做反量化 x≈scale(q-zero_point)。低比特计算通常减小权重和部分 tensor 占用，但会产生舍入、截断与饱和误差。不同层的动态范围不同，因此一个全局 scale 不一定好。","takeaway":"能解释 scale、zero_point、饱和、量化误差，不把 INT8 视为无损格式。"},{"title":"校准集和真实数据分布","explain":"后训练静态量化常需要采样代表性数据来估计激活范围。校准集应覆盖真实光照、物体大小、背景与输入类型；若只含一类图片或样本和部署分布偏离，会产生明显精度损失。校准数据不是重新训练的标签监督集，但同样需要明确采集策略。","takeaway":"用实际验证集独立评估量化前后差距，不能把校准集成绩当泛化成绩。"},{"title":"如何定位量化敏感层","explain":"先用非量化 RKNN 和 ONNX 取得可接受基线，再进行 INT8 构建。比较每层或关键中间节点的偏差，特别关注范围尖峰、检测头、Softmax 或小尺度输出。对敏感层考虑调整预处理、校准数据或使用 SDK 支持的混合精度策略。","takeaway":"指标上不仅比较张量误差，还要比较 top-1/mAP、误检漏检与端到端延迟。"}],"lab":[{"title":"手工算量化误差","action":"给定 scale=0.1、zero_point=0，将 0.26、1.04、-0.26 映射为整数，再反量化。","verify":"得到 3、10、-3；近似值 0.3、1.0、-0.3，说明误差。"},{"title":"搭建非量化基线","action":"选择一个官方兼容模型，用固定验证集记录 fp 版本分类准确率或检测 mAP、预测耗时与文件大小。","verify":"包含模型 SHA256、数据集来源与至少一种任务级指标。"},{"title":"使用代表性校准集","action":"根据 SDK 的量化数据列表格式准备覆盖多种输入条件的样本，构建 INT8 并在独立验证集比较。","verify":"形成 FP/INT8 的精度、耗时、内存和失败样本表。"}],"diagnosis":[{"symptom":"量化后小目标漏检大幅增加","reason":"检测头输出对低数值范围或阈值较敏感，校准样本可能不代表小目标场景。","check":"对小目标样本分组计算召回率，检查输出分布与后处理阈值。"},{"symptom":"INT8 文件缩小但速度不增","reason":"算子回退、内存访问与前后处理瓶颈不随权重位宽线性改善。","check":"分开测 NPU 核心耗时、总延迟和内存占用。"}],"case":{"problem":"相同图片 INT8 推理框位置与 FP 略有不同，是否意味着量化失败？","analysis":"不一定。量化本质上有数值近似。应通过验证集 mAP/召回和误差容忍范围来判断，单张图片误差可能正常，但系统性漏检应回到校准与敏感层分析。","evidence":"固定测试集 FP/INT8 指标、误差分布与典型失败场景。"},"snippet":"def quant_dequant(x, scale=0.1, zp=0):\n    q = round(x / scale) + zp\n    q = max(-128, min(127, q))\n    return q, scale*(q-zp)\nfor v in (0.26, 1.04, -0.26):\n    print(v, quant_dequant(v))\n# 演示对称 INT8 线性量化原理，非 SDK 实际量化器实现。","refs":[["RKNN 官方量化指南","https://github.com/airockchip/rknn-toolkit2/tree/master/doc"],["ONNX Runtime 量化原理与调试","https://onnxruntime.ai/docs/performance/model-optimizations/quantization.html"],["《Deep Learning》数值计算章节","https://www.deeplearningbook.org/"]],"walkthrough":{"intro":"第 14 讲专门比较同一模型的浮点与量化输出：lesson_14.py 读取两份真实 NPZ，并计算误差与 Top-1 是否相同。它不负责自动制造量化模型。","flow":["相同输入的 FP32 output.npz","相同输入的 INT8 output.npz","shape 对齐","MAE/RMSE/cosine","任务精度另行验证"],"steps":[{"api":"先检查对应 tensor 的 shape","input":"float.npz、quantized.npz 的同名 output_i","output":"同 shape 的浮点比较数组","why":"模型输出头数目或 shape 不一致时数值差没有物理意义；量化模型输出通常需要对应 Runtime 正确的反量化过程。","code":"with np.load('fp.npz') as fp, np.load('int8.npz') as q:\n    assert fp['output_0'].shape == q['output_0'].shape"},{"api":"MAE 与 RMSE：衡量误差幅度","input":"两个已对齐的浮点数组 x,y","output":"mean(|x-y|) 与 sqrt(mean((x-y)^2))","why":"MAE 便于解释平均差异，RMSE 对大误差更敏感；比较同一组输入才有意义。","code":"mae = np.mean(np.abs(x - y))\nrmse = np.sqrt(np.mean((x - y)**2))"},{"api":"top1_equal 不等于分类准确率/mAP","input":"对应 tensor 的 argmax 位置","output":"位置是否相同的布尔判断","why":"脚本对整个 ndarray 取 argmax，这是快速张量一致性信号，不是数据集 Top-1 准确率，更不是检测 mAP。","code":"python3 examples/lesson_14.py --float /path/to/fp.npz \\\n  --quantized /path/to/int8.npz --max-mae 0.1"}],"example":"例题：x=[1.0,2.0]、y=[1.1,1.8]，MAE=(0.1+0.2)/2=0.15；并不能据此推断分类准确率降低了 15%。","acceptance":"保存两份来自真实模型、相同输入协议的 NPZ 与 MAE/RMSE；分类 accuracy 和检测 mAP 须另用有标签数据集计算。"},"guidance":{"phases":[{"title":"先把输入、模型与运行环境对齐","action":"准备两份同真实输入、同对应输出协议的 NPZ；不要把任意随机数组当作量化准确率样本。","command":"","observe":"输入契约为 float.npz、quantized.npz 的同名 output_i；此步目标输出 同 shape 的浮点比较数组。","diagnose":"张量名、维度不匹配时先核对模型版本和后处理/反量化路径，再计算误差。","teach":"把输入格式和主机/开发板角色写在黑板上。"},{"title":"运行可复现的最小代码","action":"在仓库根目录执行示范命令，先替换真实文件占位路径。","command":"python3 examples/lesson_14.py --float /path/to/fp.npz --quantized /path/to/int8.npz --max-mae 0.1","observe":"输出每个同名张量的 mae、rmse、max_abs、cosine、top1_equal；超过阈值时进程返回非零。","diagnose":"张量名、维度不匹配时先核对模型版本和后处理/反量化路径，再计算误差。","teach":"展示终端真实输出，对照字段解释代码数据流。"},{"title":"核对数值与验收边界","action":"采用相同模型架构、相同图片与相同输入预处理比较 FP 与 INT8 输出。先对齐 NPZ 键名和 shape，再比较每个张量的 MAE、RMSE、最大绝对误差与余弦相似度，最后在独立标注验证集比较任务精度和真实板端延迟。","command":"python3 -c \"import numpy as np; a=np.array([1.,2.]);b=np.array([1.1,1.8]);print(np.abs(a-b).mean())\"","observe":"以 `x=[1.0,2.0]`、`y=[1.1,1.8]` 为例，MAE=0.15，RMSE≈0.158。对分类 logits 做 `argmax` 一致只表明最大值所在索引未变，仍可能有概率分布偏差；对 YOLO 检测头数组直接全局 argmax 没有 mAP 解释意义。","diagnose":"保存两份来自真实模型、相同输入协议的 NPZ 与 MAE/RMSE；分类 accuracy 和检测 mAP 须另用有标签数据集计算。","teach":"要求解释结果能证明什么、尚不能证明什么。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
