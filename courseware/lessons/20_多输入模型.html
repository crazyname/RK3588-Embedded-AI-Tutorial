<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多输入模型｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":20,"title":"多输入模型","intro":"实现多张量输入模型的推理。","goals":["区分多输入、多 Batch 与动态 shape","识别模型各输入端口及其类型","确保输入顺序、尺寸和预处理正确"],"core":"多输入模型在一次推理中需要不同来源或语义的数据，例如图像加元数据、双目图像或多传感器特征；多 Batch 则主要让同构样本一起处理。不同输入端口可能有不同的 shape、dtype 或归一化要求。模型结构应通过 Netron、ONNX metadata 或运行时 `query` 接口核对。","steps":["用 Netron 列出模型全部输入名称、形状、布局和数据类型","分别构造每个端口的测试张量","按照 API 规定的索引顺序传入输入列表","执行推理并验证输出个数与参考框架一致","记录各输入数据以方便重现异常结果"],"pitfalls":["多个输入端口不是把图像直接当作 batch 拼接","不要默认所有输入共享均值、标准差或布局"],"checks":["能解释每个输入端口的用途和顺序","能验证输入列表与模型声明完全一致"],"homework":["设计一个图像与传感器数值共同输入的接口说明"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"多输入模型的定义","explain":"多输入是计算图拥有两个或更多彼此独立的输入节点，例如图像特征和标量传感器信息，或双图像视角。每个输入分别有 dtype、shape、format、量化属性和语义。与 batch 的‘一个输入里叠加多个样本’不同，多输入模型可能包含异构数据，必须按官方 tensor index 一一绑定。","takeaway":"能在 Netron 找到 input 名称和顺序，避免只用数组长度推断。"},{"title":"输入融合的语义与时间同步","explain":"图像与 IMU 或温度传感器融合时，网络要求的往往是同一事件时刻的数据。如果图像来自 t=0，而传感器采样来自 t=2s，就算程序接口没有报错，输出语义也可能错误。前处理还要保证不同输入数值范围与训练时一致。","takeaway":"为每个输入记录采样时间、量纲、归一化、dtype 和 shape。"},{"title":"部署时的输入属性检查","explain":"加载模型后查询输入数量和各 tensor 属性，再逐个设置数据。C API 的 `rknn_inputs_set` 输入数组中的 index 与实际模型输入对应关系要明确；使用 Lite2 也需确认传入 list 的顺序。量化输入不能直接用错误的字节数或数据类型覆盖。","takeaway":"模型接受数据不等于输入语义正确，必须使用成对验证样本对比输出。"}],"lab":[{"title":"看多输入图","action":"使用 Netron 查看一个有两个输入的 ONNX 图，记录名称、形状和顺序。","verify":"写出输入0/1各自的含义和范围。"},{"title":"模拟多源数据","action":"准备一幅图和一个 [温度,湿度] 数组，检查图像与传感器的 batch 维及 dtype。","verify":"形状和数据类型被明确打印。"},{"title":"制定同步和验收协议","action":"为传感器和相机输入添加 timestamp，设计最大时间差以及缺失数据处理规则。","verify":"对错位或缺失样本有明确失败行为。"}],"diagnosis":[{"symptom":"双输入被误认为一个 Batch","reason":"输入节点数与输入张量第一维概念混淆。","check":"读取模型实际的 graph.input / rknn_query 数量。"},{"symptom":"运行正常但融合预测很差","reason":"输入数据单位不一致或传感器与图像不同步。","check":"打印每个 tensor 的值域、dtype、时间戳。"}],"case":{"problem":"两个摄像头模型分别接左图和右图，程序写反输入顺序却没有报错，怎样发现？","analysis":"如果两个 tensor shape 完全相同，类型检查不一定能发现语义交换。应通过同一对已知场景图验证输出，并给输入 index 建立显式名称映射。","evidence":"输入节点清单、配对图片标识及不同顺序的输出对照。"},"snippet":"import numpy as np\nimage = np.zeros((1,224,224,3),dtype=np.uint8)\nsensor = np.array([[24.0, 0.6]],dtype=np.float32)\nprint('image',image.shape,image.dtype)\nprint('sensor',sensor.shape,sensor.dtype)\n# 真正 RKNN 输入顺序以模型查询信息为准。","refs":[["ONNX 输入定义","https://onnx.ai/onnx/"],["RKNN 用户指南","https://github.com/airockchip/rknn-toolkit2/tree/master/doc"]],"walkthrough":{"intro":"多输入模型不是将多个数组拼接成一个 Batch。lesson_20.py 读取真实多输入 ONNX，按运行图的 input 名称逐一绑定 NPY，并用 ONNX Runtime 执行实际模型；每个输入的形状和 dtype 约定必须匹配。","flow":["多输入 ONNX","session.get_inputs()","inputs.json 映射","多组 NPY feeds","session.run 输出 NPZ"],"steps":[{"api":"从 ONNX graph 读取所有输入名称","input":"一个真实多输入 ONNX 文件","output":"session.get_inputs() 中每个名称、shape、type","why":"模型可能同时接收 image 与 metadata，不是两个图像就一定存在两个输入口。名字必须由模型自己提供，不能随意用 input_0/input_1 猜测。","code":"session = ort.InferenceSession('multi.onnx', providers=['CPUExecutionProvider'])\nprint([(x.name, x.shape, x.type) for x in session.get_inputs()])"},{"api":"inputs.json：按名字绑定文件","input":"例如 {'image':'image.npy','aux':'aux.npy'}","output":"与 session.get_inputs() 的集合完全一致的映射","why":"脚本会检查有没有缺少或多余的输入名，再确认每个 NPY 的 rank 和静态维度；实际 dtype 是否兼容由 ONNX Runtime 执行时检查。","code":"{\n  \"image\": \"/path/to/image.npy\",\n  \"aux\": \"/path/to/aux.npy\"\n}"},{"api":"session.run：真正执行所有命名输入","input":"feeds={输入名:np.ndarray}","output":"output_0 等真实推理张量，保存为 NPZ","why":"在 PC 上验证的是 ONNX Runtime 正确加载和执行多输入模型；迁移到 RKNN 时还要核对多个输入的顺序、布局和 Toolkit2 支持。","code":"python3 examples/lesson_20.py --onnx /path/to/multi.onnx --inputs /path/to/inputs.json --output build/lesson20/outputs.npz"}],"example":"多输入 {'image':(1,3,224,224),'aux':(1,10)} 是两个独立入口；Batch 2 的图片 (2,3,224,224) 仍然只有一个入口，不能混淆。","acceptance":"实际加载一个含两个以上输入的 ONNX，能列出每个输入的名称/shape/dtype 并保存对应输出 NPZ。没有真实模型时不能把示例名称视为现成文件。"},"guidance":{"phases":[{"title":"核对实际输入、shape 和依赖","action":"准备真实多输入 ONNX，通过 Netron 或 lesson_12.py 核对 name/dtype/shape；用 JSON 按名字映射路径。","command":"","observe":"本讲输入协议包含 一个真实多输入 ONNX 文件，首先应得到 session.get_inputs() 中每个名称、shape、type。","diagnose":"提示 expected all input names 时先检查 JSON 的键是否与模型完全一致；rank 错误时重做指定输入张量。","teach":"与学习者先画清张量形状，再运行程序。"},{"title":"逐步执行真实程序","action":"在仓库根目录运行；真实模型与输入路径不能用占位符直接执行。","command":"python3 examples/lesson_20.py --onnx /path/to/multi.onnx --inputs /path/to/inputs.json --output build/lesson20/outputs.npz","observe":"只有所有输入名、rank 和实际张量可用时才生成 outputs.npz，并打印输出张量形状。","diagnose":"提示 expected all input names 时先检查 JSON 的键是否与模型完全一致；rank 错误时重做指定输入张量。","teach":"请学生现场解释输出字段的类型、值域和单位。"},{"title":"独立验证与反例检查","action":"先打印并记录模型全部输入契约，再制作 inputs.json 与逐文件 NPY，运行 ONNX Runtime 保存每个 output_i。移植到 RKNN 时需要重新核对输入 index、type、layout 与内存大小；PC 能运行并不能证明目标平台支持。","command":"python3 -c \"import numpy as np;z=np.load('build/lesson20/outputs.npz');print([(k,z[k].shape) for k in z.files])\"","observe":"图含 `image:float32[1,3,224,224]` 和 `aux:float32[1,10]` 时，必须同时传两个具名 NPY。把两个数组堆成一个 tensor 不仅维度不合，甚至可能无法表示不同数据类型。`lesson_20.py` 先校验输入名集合、rank 和静态维度，真实 ONNX Runtime 在执行时进一步检查 dtype。","diagnose":"实际加载一个含两个以上输入的 ONNX，能列出每个输入的名称/shape/dtype 并保存对应输出 NPZ。没有真实模型时不能把示例名称视为现成文件。","teach":"口头回答模型或 SDK 未经实机验证时的结论边界。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
