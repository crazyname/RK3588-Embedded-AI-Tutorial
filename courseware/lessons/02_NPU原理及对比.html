<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NPU原理及对比｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":2,"title":"NPU原理及对比","intro":"比较 CPU、GPU、NPU 并理解算力计算。","goals":["掌握 NPU 面向张量/矩阵的特点","对比 CPU、GPU 与 NPU 的适用任务","理解 MAC、OPS、TOPS"],"core":"CPU 适合通用控制与低延迟任务，GPU 适合大规模并行计算，NPU 使用专用架构加速神经网络。TOPS 表示每秒万亿次操作数，是理论算力口径，不等于真实吞吐。通常一次 MAC（乘加）可按一次乘法和一次加法计为 2 OPS。课程示例采用三核、每核每周期 1024 次 MAC、约 1 GHz，得到 3×1024×2×10⁹≈6.144×10¹² OPS/s，常约称为 6 TOPS。","steps":["列出三种处理器各自擅长的工作负载","按 MAC 数、核数和时钟频率复核算力估算","选一份神经网络并辨别哪些算子可能由 NPU 支持"],"pitfalls":["不同计算精度的 TOPS 不能不加说明地比较","前处理和后处理的耗时不包含在 NPU 峰值算力中"],"checks":["能准确解释 TOPS、延迟、FPS 的区别","能指出理论峰值估算的前提"],"homework":["计算时钟下降 20% 时理论峰值的变化，并分析实际 FPS 的限制"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"卷积与乘加操作","explain":"卷积神经网络的卷积可理解为小窗口与权重逐元素相乘后求和，多层网络会重复大量乘加操作（MAC）。一个乘加常被统计为两次算术操作，但统计口径不等于真实周期数。NPU 通过针对矩阵或张量算子的专门数据通路、并行单元与局部缓存提高效率；具体微架构要以芯片资料为准。","takeaway":"能从 H×W×Cin×Cout×K×K 估算一个常规卷积层的 MAC 量级，理解它并非实际 FPS。"},{"title":"CPU、GPU 和 NPU 的取舍","explain":"CPU 擅长分支、控制和异构任务调度；GPU 通常提供灵活的大规模并行执行；NPU 则针对支持的神经网络计算路径优化功耗与吞吐。并非所有算子都可以完全映射 NPU，某些前后处理、内存复制或回退执行会影响结果。选方案要同时考虑可用算子、模型精度、功耗和运行生态。","takeaway":"按照工作负载、支持算子和端到端耗时选硬件，而不是只按照峰值算力选。"},{"title":"计算瓶颈与访存瓶颈","explain":"如果每执行一次运算都需要频繁访问外部 DDR，计算单元可能等待数据。权重重用、缓存、算子融合和合适张量布局能够减少部分数据搬运。实际加速会受模型的参数规模、中间特征大小和调度方式影响，因此需要结合每层耗时与内存行为评估。","takeaway":"从算力和数据移动两条线索解释不同网络为什么加速收益不同。"}],"lab":[{"title":"手算卷积规模","action":"设输入为 64×64×32，输出通道为 64，卷积核 3×3、stride=1 且输出空间 64×64，计算 MAC≈64×64×32×64×9。","verify":"结果是 75,497,472 MAC，按一乘一加两次运算约 0.151 GOP。"},{"title":"比较网络特点","action":"使用 Netron 打开一个 MobileNetV2 和一个卷积较密集的模型，查看 DepthwiseConv 与普通 Conv 的层级结构。","verify":"指出 depthwise 卷积为何减少跨通道乘加，但不保证相同比例缩短板端耗时。"},{"title":"设计衡量指标","action":"列出任务成功率/精度、端到端延迟、模型文件大小、内存和功耗，定义什么条件下才算‘更适合嵌入式’。","verify":"提出完整评价表而不是一个 TOPS 数字。"}],"diagnosis":[{"symptom":"算力估算与测量偏差大","reason":"MAC 模型并未包含内存、分支、算子融合、布局转换等实现细节。","check":"区分理论操作数、纯 NPU profile 与业务端到端时间。"},{"symptom":"小模型比预期慢","reason":"算子支持、调用固定成本和内存传输占比较高。","check":"增大测试样本数，观察 warm-up 后耗时，并查输入输出复制。"}],"case":{"problem":"两个网络 MAC 数相当，但一个在 RK3588 上快两倍。能断言工具链‘算错了’吗？","analysis":"不能。网络的算子类型、特征图尺寸、融合机会、NPU 支持、数据布局及 DDR 行为可能不同。应检查各层统计、张量属性及相同环境下的多次运行，再用真实日志解释差距。","evidence":"两种网络的输入规格、MAC 估算、SDK 版本、分层和端到端耗时对照。"},"snippet":"H, W, cin, cout, k = 64, 64, 32, 64, 3\nmac = H * W * cin * cout * k * k\nprint(f'{mac:,} MAC, approximately {2*mac/1e9:.3f} GOP')","refs":[["《Deep Learning》卷积网络章节","https://www.deeplearningbook.org/"],["《动手学深度学习》卷积网络","https://d2l.com.cn/"],["RKNN Model Zoo 公开 benchmark","https://github.com/airockchip/rknn_model_zoo"]],"walkthrough":{"intro":"第 02 讲用卷积的真实 MAC 公式解释 NPU 为什么适合密集张量计算，而不是把模型 FLOPs、TOPS 与端到端 FPS 混为一谈。lesson_02.py 可以对标准卷积和深度可分离卷积计算真实形状与乘加次数。","flow":["输入 H×W×Ci","卷积核 K×K","输出 Ho×Wo×Co","标准卷积 MAC","深度卷积+逐点卷积 MAC"],"steps":[{"api":"conv()：计算输出形状","input":"height、width、kernel、stride、padding 与 groups","output":"Ho=floor((H+2P−K)/S)+1，Wo 同理","why":"维度公式先决定张量结果能否匹配下一层；group 数必须能整除输入、输出通道数。","code":"python3 examples/lesson_02.py --height 224 --width 224 --in-channels 32 --out-channels 64 --kernel 3 --stride 1 --padding 1"},{"api":"标准卷积乘加数（MAC）","input":"Ho、Wo、Co、Ci、K 与 groups=1","output":"MAC=Ho×Wo×Co×Ci×K²","why":"一个 MAC 通常包含一次乘法与一次累加；文献统计 FLOPs 有时按 2 FLOPs/MAC 计算，应说明口径。该公式忽略实际内存读写与量化开销。","code":"standard_mac = Ho * Wo * Co * Ci * K * K"},{"api":"Depthwise + Pointwise 计算差异","input":"depthwise(groups=Ci) + 1×1 pointwise","output":"两个阶段 MAC 的总和及标准卷积与可分离卷积比值","why":"深度卷积先分别处理各输入通道，1×1 逐点卷积负责混合通道。理论 MAC 减少不必然代表实际 NPU 延迟按比例下降。","code":"depth_mac = Ho * Wo * Ci * K * K\npoint_mac = Ho * Wo * Ci * Co\nprint(standard_mac / (depth_mac + point_mac))"}],"example":"同尺寸 224×224、Ci=32、Co=64、K=3、stride=1、padding=1 时，理想 MAC 比值为 (32×64×9)/(32×9+32×64)=约 7.89 倍；这是运算量比，不是 RK3588 加速比。","acceptance":"在 PC 运行公式程序得到形状和 MAC，对比 CPU/GPU/NPU 的擅长任务，并说明 TOPS 为何不能直接计算 FPS。"}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
