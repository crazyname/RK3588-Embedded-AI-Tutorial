<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>均值和标准差｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":10,"title":"均值和标准差","intro":"解决 RKNN 部署中最常见的前处理不一致问题。","goals":["区别 Min-Max 归一化与 Z-score 标准化","推导 `mean_values` / `std_values`","排查颜色通道、像素范围与重复归一化"],"core":"深度学习中常见预处理为 `x'=(x-μ)/σ`。RKNN 的 `mean_values`、`std_values` 应与训练前处理、应用传入的像素范围、通道顺序相对应。若训练代码使用先除以 255 再减去 μ、除以 σ，而给 RKNN 传入的却是 0–255 像素，则同一通道的等效 mean/std 通常分别是 `255μ` 和 `255σ`（具体以 SDK 的输入预处理行为为准）。不能将某个 ResNet 或 MobileNet 示例的参数机械套到另一个模型。","steps":["检查训练脚本中图像转换、resize、色彩空间与归一化代码","确认导出模型的输入是否已包含前处理","在纸上写出真实像素值到网络输入值的完整变换","只在一处执行同一种归一化操作，防止重复","用同一张图片对照 PyTorch/ONNX/RKNN 的输入张量和输出"],"pitfalls":["mean/std 的通道顺序必须与模型输入一致","不要同时在主程序与 RKNN 配置中重复做相同归一化"],"checks":["能推导实际项目需要的 mean/std","知道 0–1、0–255、RGB 与 BGR 混用的风险"],"homework":["为一个训练预处理为 `(x/255-μ)/σ` 的三通道模型推导部署参数"],"code":"训练侧：y = ((x / 255) - μ) / σ\n若 RKNN 侧收到原始 0~255 的 x 且使用 y = (x - mean) / std，\n可推导：mean = 255 × μ，std = 255 × σ。\n注意：实际 API 对 dtype、布局和输入范围的约定需按版本验证。"}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"像素归一化不是可选装饰","explain":"从 JPEG 解码后的像素通常是 [0,255] 的 uint8，而模型训练时可能使用 [0,1]、[-1,1] 或按 ImageNet 均值标准差归一化的 float32。常见变换为 y=(x/255-mean)/std，但 RKNN `config` 的 mean_values/std_values 往往针对原始 0–255 像素定义变换；同一数值参数放在不同阶段不必然等价。必须以当前 SDK 的实际定义和训练脚本核对。","takeaway":"不要只看 mean/std 的数字，还要看输入像素是否已除以 255。"},{"title":"颜色与张量布局","explain":"RGB 与 OpenCV 常用的 BGR 是通道排列差异；NCHW 与 NHWC 是内存维度顺序差异。一个形状为 [1,3,224,224] 的 NCHW 张量与 [1,224,224,3] 的 NHWC 张量具有相同元素个数，却不可直接交换输入含义。图像长宽和插值方式也会影响识别输出。","takeaway":"能明确写出源框架和板端各阶段的 shape、dtype、layout、channel order。"},{"title":"如何做数值级回归","explain":"给同一测试图片分别通过训练预处理与部署预处理，计算每通道最小值/最大值/均值，并比较若干像素位置。发现差异时先定位从哪一步开始分叉，再看模型输出，不要直接归因于量化精度。","takeaway":"输入 tensor 的等价性应先于模型 logits 或检测框的对比。"}],"lab":[{"title":"手算归一化","action":"对 RGB 像素 (0,128,255)，先除以255，再按 mean=0.5、std=0.5 计算输出，说明结果可以出现负数。","verify":"三个值约为 (-1,0.0039,1)，并解释 128/255 并不精确等于 0.5。"},{"title":"比较 RGB 和 BGR","action":"用 NumPy 构造三个纯色像素，再沿最后一维反转通道；打印数组确认红色和蓝色位置互换。","verify":"同一像素交换后为 (255,128,0) 之类的不同序列，但 shape 不变。"},{"title":"写输入协议表","action":"记录分辨率、resize/letterbox、颜色顺序、数据类型、数值范围、均值标准差和张量布局，并对照 ONNX 的输入属性。","verify":"一张规范表可让另一个人重现进入模型前的 tensor。"}],"diagnosis":[{"symptom":"分类结果全部偏向一个类别","reason":"输入被重复除以255或 RGB/BGR 顺序错误。","check":"比较模型实际输入 tensor 的统计量与训练侧同图输出。"},{"symptom":"ONNX 预测正确而 RKNN 错误","reason":"config 预处理与应用代码发生重复或遗漏，或者 tensor layout 不一致。","check":"先对非量化模型做同图输入数值核对，再讨论量化误差。"}],"case":{"problem":"训练脚本已把像素除以 255，你在板端应用再做一次除法，同时 Toolkit2 也配置了预处理，为什么输出失真？","analysis":"需要列出每个阶段的数值变换，找出重复处理。正确部署只应实现与训练等价的一次预处理，而不是把配置照搬几处。","evidence":"同一像素在解码、缩放、归一化、模型输入四个位置的数值跟踪表。"},"snippet":"import numpy as np\np = np.array([0,128,255], dtype=np.float32)\ny = (p / 255.0 - 0.5) / 0.5\nprint(y)\nprint('BGR:', p[::-1])","refs":[["RKNN 用户指南中的前处理配置","https://github.com/airockchip/rknn-toolkit2/tree/master/doc"],["《动手学深度学习》数据预处理","https://d2l.com.cn/"],["NumPy 官方手册","https://numpy.org/doc/stable/"]],"walkthrough":{"intro":"均值和标准差是训练/推理的输入协议。lesson_10.py 从真实 RGB 图像生成 float32 的 NCHW 或 NHWC 张量，通过真实像素计算标准化值，不能在 Toolkit2 和 Python 中重复处理。","flow":["JPG/PNG 文件","RGB uint8 像素","除以 255","逐通道 (x-mean)/std","NCHW/NHWC 输出 NPY"],"steps":[{"api":"RGB 像素、颜色和归一化","input":"Pillow 读取真实图片、resize 到目标尺寸","output":"uint8 RGB 数组，值域 0–255","why":"OpenCV 默认 BGR，而 Pillow.convert('RGB') 是 RGB。像素顺序不匹配会使同一个 .rknn 分类输出完全不同；转换器内置 mean/std 时，Python 端不应重复。","code":"python3 examples/lesson_10.py --image /path/to/test.jpg --width 224 --height 224 --output build/lesson10/image.npy"},{"api":"逐通道标准化公式","input":"RGB/255、mean=(0.485,0.456,0.406)、std=(0.229,0.224,0.225)","output":"float32 标准化像素张量","why":"对每个通道分别计算 (x/255-mean)/std。颜色顺序和通道顺序必须与训练一致；std 不为零。","code":"rgb = np.asarray(image, dtype=np.float32) / 255.0\nnormalized = (rgb - mean) / std"},{"api":"layout：NCHW 与 NHWC 的区别","input":"同一标准化 HWC 数组","output":"NCHW (1,3,224,224) 或 NHWC (1,224,224,3)","why":"转置只是更换轴顺序，不会修正错误的 RGB/BGR、归一化或量化协议。必须以真实模型 input attr 或 ONNX graph 为准。","code":"nchw = np.ascontiguousarray(normalized.transpose(2, 0, 1)[None, ...])\nnhwc = np.ascontiguousarray(normalized[None, ...])"}],"example":"若红色通道像素=128，标准 ImageNet 归一化为 (128/255−0.485)/0.229≈0.074；输出保存为 NPY 后可对照首个像素，检查是否发生二次 /255。","acceptance":"保存由真实图像得到的 NPY，解释 shape、dtype、每通道 mean/std 和色彩顺序，并指出哪些处理可能已经写入 RKNN 转换配置。"},"guidance":{"phases":[{"title":"确认准备条件与输入协议","action":"准备真实 RGB 图片，确定本例使用 ImageNet mean/std；换其他模型时先查训练约定，不能自动假定相同。","command":"","observe":"首个关键步骤处理 Pillow 读取真实图片、resize 到目标尺寸，输出应为 uint8 RGB 数组，值域 0–255。","diagnose":"分类异常首先检查颜色顺序、resize/crop、NCHW/NHWC、mean/std 是否重复执行，不能只改 Top-K 标签。","teach":"先检查前置条件，不能凭假设跳过环境核对。"},{"title":"教师演示最小可运行命令","action":"从仓库根目录运行。/path/to 路径和外部 SDK 必须是真实文件及兼容环境。","command":"python3 examples/lesson_10.py --image /path/to/test.jpg --output build/lesson10/image.npy --layout NCHW","observe":"生成 (1,3,224,224) float32 NPY，打印 rgb_pixel_00、每通道 min/max 和输入路径。","diagnose":"分类异常首先检查颜色顺序、resize/crop、NCHW/NHWC、mean/std 是否重复执行，不能只改 Top-K 标签。","teach":"逐项说明参数、输出文件位置和软件层次。"},{"title":"学生解释结果并独立验收","action":"记录 color、resize/crop、layout、dtype、scale、mean、std 和 batch。用 1 张固定测试图比较 Python、ONNX 和 RKNN 相应输入张量，先核对首个像素与数值范围，再讨论预测结果。","command":"python3 -c \"import numpy as np; x=np.load('build/lesson10/image.npy'); print(x.shape,x.dtype,x.min(),x.max())\"","observe":"RGB 红通道 128 的 ImageNet 标准化约 `(128/255−0.485)/0.229≈0.074`。单图 224×224×3 uint8 内存约 150528 字节；转换为 NCHW float32 batch 张量后约 602112 字节。两者不仅内存不同，Runtime 所要求的张量格式也不同。","diagnose":"保存由真实图像得到的 NPY，解释 shape、dtype、每通道 mean/std 和色彩顺序，并指出哪些处理可能已经写入 RKNN 转换配置。","teach":"结合实际输出解释因果，记录未通过项；PC 数据不能冒充 ROCK 5B 实测。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
