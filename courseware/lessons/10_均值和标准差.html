<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>均值和标准差｜RK3588 HTML 教学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":10,"title":"均值和标准差","intro":"解决 RKNN 部署中最常见的前处理不一致问题。","goals":["区别 Min-Max 归一化与 Z-score 标准化","推导 `mean_values` / `std_values`","排查颜色通道、像素范围与重复归一化"],"core":"深度学习中常见预处理为 `x'=(x-μ)/σ`。RKNN 的 `mean_values`、`std_values` 应与训练前处理、应用传入的像素范围、通道顺序相对应。若训练代码使用先除以 255 再减去 μ、除以 σ，而给 RKNN 传入的却是 0–255 像素，则同一通道的等效 mean/std 通常分别是 `255μ` 和 `255σ`（具体以 SDK 的输入预处理行为为准）。不能将某个 ResNet 或 MobileNet 示例的参数机械套到另一个模型。","steps":["检查训练脚本中图像转换、resize、色彩空间与归一化代码","确认导出模型的输入是否已包含前处理","在纸上写出真实像素值到网络输入值的完整变换","只在一处执行同一种归一化操作，防止重复","用同一张图片对照 PyTorch/ONNX/RKNN 的输入张量和输出"],"checks":["能推导实际项目需要的 mean/std","知道 0–1、0–255、RGB 与 BGR 混用的风险"],"pitfalls":["mean/std 的通道顺序必须与模型输入一致","不要同时在主程序与 RKNN 配置中重复做相同归一化"],"homework":["为一个训练预处理为 `(x/255-μ)/σ` 的三通道模型推导部署参数"],"code":"训练侧：y = ((x / 255) - μ) / σ\n若 RKNN 侧收到原始 0~255 的 x 且使用 y = (x - mean) / std，\n可推导：mean = 255 × μ，std = 255 × σ。\n注意：实际 API 对 dtype、布局和输入范围的约定需按版本验证。"}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
