<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>yolov26模型部署(从0到1版) · windows环境搭建与模型预测分析｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":30,"title":"yolov26模型部署(从0到1版) · windows环境搭建与模型预测分析","intro":"从 Windows 环境搭建开始验证检测模型预测。","goals":["配置隔离的 Python 环境","认识模型预测输出、置信度与设备参数","验证图片、视频等输入类型"],"core":"课程的第 30 讲拆成三个专题，本讲为第一部分：在 Windows 搭建深度学习实验环境，加载模型并开展预测分析，为后续的标注、训练和部署奠定基础。PyTorch、CUDA、显卡驱动、Python、Ultralytics 等依赖必须匹配。视频所称“YOLOv26”的具体权重、代码版本与推理接口应以课程配套源码和实际版本文档为准，避免套用其他 YOLO 导出方式。","steps":["确认显卡驱动、是否支持 CUDA 和可用内存；记录 Python 版本","新建专用虚拟环境，按模型对应版本安装检测框架与 PyTorch","下载可合法使用且与框架版本匹配的预训练权重","对图片和视频输入运行基线预测，保留结果图和控制台日志","对比不同置信度阈值、输入分辨率和 device 参数的影响","保存依赖版本冻结文件，为训练及 ONNX 导出提供基线"],"pitfalls":["Windows 路径包含空格/中文时要注意脚本引用和编码","CUDA 不可用时应先在 CPU 模式完成冒烟测试","不要把依赖版本不匹配导致的错误误判为模型错误"],"checks":["在目标 Windows 环境中可成功运行单图预测","知道预测框、类别、置信度与输入输出路径含义"],"homework":["整理训练主机环境表，并保存 2 组不同阈值的预测结果"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"训练环境先建立可复现的‘最小闭环’","explain":"在 Windows 进行 YOLO26 等检测模型实验，建议先配置受支持的 Python、PyTorch 与 Ultralytics 环境，确认 GPU 驱动/CUDA 是否与 torch wheel 匹配。CPU 也可完成小规模预测冒烟，但大型训练效率较低。将 YOLO 模型版本、包版本和权重来源固定到记录里，特别注意 YOLO26 对应的软件 release 是否支持该模型结构。","takeaway":"单图预测成功只证明训练框架的部分环境可用，不代表 RKNN 部署链路也已跑通。"},{"title":"理解预测输出","explain":"在训练框架中 `model.predict` 通常返回具有 boxes、scores、class id 的结果对象。要区分原框架输出与原始 ONNX tensor：Ultralytics 高层接口可能自动执行解码和 NMS，导出后的 ONNX 可能产生不同形式的原始预测。对每张图保留模型权重、置信度阈值、输入尺寸和版本，避免把可视化框当作唯一验证材料。","takeaway":"能从预测输出解释类别、置信度、xyxy 坐标以及坐标所属的图像空间。"},{"title":"跨平台部署不要跳级","explain":"训练环境在 Windows 不意味着 RKNN-Toolkit2 的模型转换必须在 Windows 上执行；应优先使用官方支持的 Linux x86_64 开发环境或经文档验证的 WSL。YOLO26 是否可通过当前 RKNN 编译器，需要先做 ONNX 算子兼容性和导出输出结构检查，不能仅凭 Ultralytics 支持 ONNX 就推断 Rockchip 已正式支持该检测头。","takeaway":"始终按 PyTorch → ONNX Runtime → RKNN → 真实 RK3588 的顺序定位问题。"}],"lab":[{"title":"固定训练环境","action":"安装官方文档支持的 Python/PyTorch/Ultralytics 组合并记录 `python -V`、torch 和 ultralytics 的包版本。","verify":"明确是 GPU 还是 CPU 推理环境，能重复导入软件。"},{"title":"做单图预测","action":"使用取得许可的 YOLO26n 权重和测试图，调用高层预测并打印 boxes.xyxy、conf、cls。","verify":"保存检测结果、模型权重来源、置信度设置和原图。"},{"title":"冻结结果基线","action":"为三张不同尺寸、场景的测试图建立 JSON 结果记录，并保存训练框架和模型版本。","verify":"下一步导出 ONNX 后有可对照的框、类别和分数。"}],"diagnosis":[{"symptom":"PyTorch 无法使用 CUDA","reason":"显卡驱动、PyTorch CUDA 构建与设备能力不匹配。","check":"先验证 torch.cuda.is_available()，核对官方安装说明并保留 CPU 冒烟路径。"},{"symptom":"同样的图片预测框与教程不同","reason":"权重版本、imgsz、conf、NMS 实现和 Ultralytics 版本不同。","check":"固定权重 hash、输入图片与全部推理参数。"}],"case":{"problem":"Windows 下模型能推理，但装了新版本 Ultralytics 后检测框数量发生变化，是否意味着训练数据错了？","analysis":"先调查升级导致的后处理阈值、默认参数或输出形式变化，恢复固定软件版本对照同样权重与图片。功能差异不一定来自数据本身。","evidence":"权重 SHA256、软件版本、模型参数、同图预测 JSON 和可视化结果。"},"snippet":"from ultralytics import YOLO\nmodel = YOLO('yolo26n.pt')  # 权重需按官方文档获取\nresults = model.predict(source='test.jpg', imgsz=640, conf=0.25)\nfor result in results:\n    if result.boxes is not None:\n        print(result.boxes.xyxy, result.boxes.conf, result.boxes.cls)\n# 这是训练框架的高层预测，不是 RK3588 板端推理。","refs":[["Ultralytics YOLO Python 使用","https://docs.ultralytics.com/usage/python/"],["Ultralytics YOLO 模型导出","https://docs.ultralytics.com/modes/export/"],["PyTorch 安装向导","https://pytorch.org/get-started/locally/"]]}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
