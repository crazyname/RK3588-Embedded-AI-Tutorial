<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型内存评估｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":16,"title":"模型内存评估","intro":"评估 RKNN 权重、运行时张量与整体部署内存。","goals":["了解权重与中间特征的内存组成","使用 SDK 内存评估接口","区分模型文件大小和进程真实内存"],"core":"模型文件在磁盘上的大小不等于推理时的实际内存。评估可能包含模型权重（weight memory）、中间 tensor（internal memory）与其他（other memory）等分类。板端还需要图像输入输出缓冲、应用程序、运行时句柄及系统服务。课程介绍 `eval_memory` 一类工具，在某些 SDK 版本中需在初始化运行时开启内存评估选项。","steps":["加载一个已经验证可正常推理的 `.rknn` 模型","核对当前 Toolkit2 是否要求在 `init_runtime` 中开启内存评估开关","运行内存评估并保存 weight/internal/other/total 输出","使用系统内存观测手段检查整个应用进程","估算多实例、多路视频增加的缓存和上下文开销"],"pitfalls":["运行时内存统计不一定涵盖应用全部内存","不同比特宽度、批量和输入形状会改变内存要求"],"checks":["能说明模型文件、NPU 内存和进程 RSS 的区别","能记录同一模型多种输入尺寸的内存变化"],"homework":["拟定单路与四路摄像头推理的内存预算表"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"模型大小不等于实际内存","explain":"`.rknn` 是磁盘文件，运行时需要权重、中间激活张量、运行时上下文、输入/输出 buffer。图像解码、视频缓冲和系统进程额外消耗 RAM。Linux RSS 与 NPU 内部空间不是同一概念，应该分别记录文件大小、进程 VmRSS/VmHWM 和 SDK 提供的内存估算。","takeaway":"一款 80MB 模型在板端占用多于 80MB 并不异常。"},{"title":"需要关注峰值而不只是稳定值","explain":"初始化、首次推理、切换 shape 或并发开启模型上下文都可能导致短期峰值。板端设计不能把全部 RAM 分配给权重，应留操作系统、视频编解码和临时缓冲余量。","takeaway":"比较载入前、载入后、首次推理和长时间运行四个状态。"},{"title":"减内存会改变性能","explain":"量化模型、减少并发缓存或重用 buffer 可减小占用，但可能影响精度、吞吐或响应时延。每次改动都要记录内存峰值与业务指标，不能只看模型文件变小。","takeaway":"内存优化是否有效需要长期稳定测试与精度回归。"}],"lab":[{"title":"建立内存基线","action":"记录模型文件字节数、系统总内存、空载 MemAvailable。","verify":"结果标明磁盘空间和物理内存是不同单位/视角。"},{"title":"监控运行峰值","action":"对真实模型进程读取 `/proc/<PID>/status` 里的 VmRSS、VmHWM，在运行阶段取样。","verify":"获得初始化与执行中的峰值信息。"},{"title":"设计并发预算","action":"将模型、输入输出、帧缓冲与其他进程作预算，预留一定安全余量。","verify":"预算与实际观察值可对照。"}],"diagnosis":[{"symptom":"偶发 OOM","reason":"峰值 buffer 与多个并发模型叠加。","check":"记录 VmHWM 和系统 OOM 日志，查缓冲帧数。"},{"symptom":"destroy 后 RSS 未马上归零","reason":"内存分配器可能缓存已释放内存，不代表必然泄漏。","check":"重复创建销毁并观察趋势。"}],"case":{"problem":"4GB RAM 的 RK3588 能放下 80MB 模型，为什么两个摄像头一启动就 OOM？","analysis":"检查视频解码和高分辨率中间帧缓存的数量，连同模型上下文、系统服务和运行时中间 tensor 计算峰值。文件大小是非常不足的容量估计。","evidence":"分段内存日志、帧缓冲估算和系统可用内存。"},"snippet":"cat /proc/meminfo | head\n# 用实际进程号替换 PID：\ngrep -E 'VmRSS|VmHWM|VmSize' /proc/PID/status","refs":[["Linux /proc 内存说明","https://docs.kernel.org/filesystems/proc.html"],["RKNN 工具链内存分析指南","https://github.com/airockchip/rknn-toolkit2/tree/master/doc"]],"walkthrough":{"intro":"第 16 讲读取 Linux /proc/<pid>/status 中 VmRSS、VmHWM、VmSize，观察 CPU 进程内存；这不是 RK3588 NPU 专用显存或所有 DDR 占用的直接测量。","flow":["真实 Linux PID","/proc/PID/status","VmRSS / VmHWM / VmSize","CSV 样本","内存解释"],"steps":[{"api":"/proc/PID/status：从系统读取进程内存","input":"一个正在运行的 Linux PID","output":"VmRSS、VmHWM、VmSize 字段","why":"VmRSS 是当前驻留页大致用量；VmHWM 是历史高水位；VmSize 是虚拟地址空间，三个量不能混为一谈。","code":"cat /proc/$/status | grep -E 'VmRSS|VmHWM|VmSize'"},{"api":"lesson_16.py：定时采样而非单点猜测","input":"--pid、--samples、--interval","output":"含时间戳和内存字段的 CSV","why":"采样太少可能错过瞬时峰值；PID 退出时脚本会报错。需明确程序的模型初始化和实际推理发生在采样窗口内。","code":"python3 examples/lesson_16.py --pid 1234 --samples 10 \\\n  --interval 0.5 --csv build/lesson16/memory.csv"},{"api":"不要把 VmRSS 解释为全部 NPU 内存","input":"Linux 进程地址空间统计和 SDK 单独报告","output":"有边界的 CPU 内存观察值","why":"驱动分配、DMA 缓冲、专有 NPU 工作区可能不全反映在普通进程 RSS；评价模型 RAM 预算还应结合 SDK 的内存评估及实际机器可用内存。","code":"# 采样同时记录真实 PID 与模型初始化时间\n# NPU / DMA 资源需另看对应 SDK 和系统工具"}],"example":"如果 VmRSS=200 MB、VmHWM=350 MB，只能说明进程当前驻留约 200 MB、历史达到约 350 MB，不能据此判断 NPU 的全部模型工作区等于 350 MB。","acceptance":"保存实际 Linux PID 的 CSV，注明采样时间、程序阶段以及 VmRSS 的测量边界；不要把 VMSize 当成已占用物理内存。"}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
