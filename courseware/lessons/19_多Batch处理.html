<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多Batch处理｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":19,"title":"多Batch处理","intro":"利用批量推理理解多核 NPU 的吞吐能力。","goals":["区别单样本时延和批量吞吐","了解 batch、上下文和多核调度之间的关系","测量批量输入的内存及性能开销"],"core":"多 Batch 将多个同类样本放入同一批次，有助于提升吞吐或利用多核，但不保证每张图片响应更快。SDK 可能通过上下文复制、运行时线程和多核调度分担工作。应区分“batch 维度变大”和“建立多个独立推理上下文”：它们的数据路径及调度方式可能不同。","steps":["检查模型与工具链允许的 batch 规格","准备同尺寸、同通道布局的多张图片并组装输入","分别测试 batch=1 和支持的多 batch 组合","测量每批耗时、单图等效耗时、吞吐以及内存","将结果与多线程/多上下文方案比较"],"pitfalls":["不同 RKNN 模型可能不支持期望的 batch 尺寸","三核 NPU 不意味着业务吞吐必然线性提升三倍"],"checks":["能解释批量吞吐提升不等于单请求延迟降低","能够测出 batch 增大后的内存开销"],"homework":["规划 batch=1/2/3 的精度与速度对照测试"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"Batch 并非多输入","explain":"模型形状 [N,C,H,W] 中 N 是一次推理的样本数。N=4 通常表示四张图组成一个 tensor；多输入模型则包含多个独立入口，两种概念不可混同。RKNN 能否处理多 Batch 取决于模型导出、转换与运行时所声明的规格。","takeaway":"不能直接把固定 batch=1 的 RKNN 改成接收 batch=4。"},{"title":"吞吐与响应时延的矛盾","explain":"多 Batch 可能提升单位时间样本数，但收集完整批次需要排队。首帧等待后续输入可能让实时单帧时延更差。评估时记录 samples/s、batch 耗时、每个样本等待时间与 p95。","takeaway":"根据实时性目标决定用大 Batch 还是低延迟单样本路径。"},{"title":"逐个样本保存对应元数据","explain":"同批次图像可能来自不同尺寸和摄像头。预处理之后要存储每张图的 resize 比例、填充偏移和类别映射，输出按 batch 索引正确拆分，否则检测结果会发生错位。","takeaway":"验证时用四张不同类别图片避免误判顺序正确。"}],"lab":[{"title":"检查 batch 维","action":"打印模型输入 shape 并确认 N、C、H、W 或 NHWC 中的 N。","verify":"知道 batch 和 channel 的区别。"},{"title":"堆叠四张测试图","action":"使用 NumPy `stack` 将四张同尺寸图组成一个数组；只做张量练习，不强行送入不支持的模型。","verify":"数组第一维为 4，内存维度与模型协议一致。"},{"title":"估算排队延迟","action":"假设四帧每 10ms 到达，一批需等齐四帧后才推理，计算首帧额外等待。","verify":"在理想场景首帧至少需要等 30ms 才能开始计算。"}],"diagnosis":[{"symptom":"更换 batch 后 shape 报错","reason":"导出/编译规格不支持该 batch。","check":"查询 SDK 支持矩阵和输入属性。"},{"symptom":"预测结果对应错图","reason":"程序在拆分 batch 输出时用错索引。","check":"给每个输入分配唯一 ID 并逐一核对。"}],"case":{"problem":"某检测服务将 N 从 1 提升为 8，samples/s 提升但最早到来的帧超过响应时限，是算法有问题吗？","analysis":"这更可能是批处理聚合导致的等待时间问题。吞吐优化与交互实时性指标不同，应按端到端 p95 与采集队列评估合适的 batch。","evidence":"每帧到达、批次启动、推理完成的时间戳与最终输出对应关系。"},"snippet":"import numpy as np\nimgs = [np.zeros((224,224,3),np.uint8) for _ in range(4)]\nprint(np.stack(imgs,axis=0).shape)  # (4, 224, 224, 3)","refs":[["RKNN Toolkit2 功能文档","https://github.com/airockchip/rknn-toolkit2/tree/master/doc"],["NumPy stack 文档","https://numpy.org/doc/stable/reference/generated/numpy.stack.html"]],"walkthrough":{"intro":"多 Batch 输入的第一步是把 N 张图片预处理成一个张量，但推理设备是否接受 N>1，取决于 ONNX/RKNN 编译时的模型输入形状。lesson_19.py 只负责从真实图片创建 B×H×W×C 的 uint8 数据，并保存原图顺序映射。","flow":["N 张真实图片","RGB + resize 到相同大小","np.stack(axis=0)","Batch NHWC NPY","images 顺序 JSON"],"steps":[{"api":"输入数量必须和 --batch 一致","input":"--images 的真实文件列表与 --batch 数字","output":"有效 N 张输入，或在数量不等时拒绝","why":"批输入并不等于程序读到几张就自动凑成某个 N。若模型输入是固定 batch=1，制作 batch=4 文件也不能据此认为 RKNN 支持 4。","code":"python3 examples/lesson_19.py --images /path/to/a.jpg /path/to/b.jpg --batch 2 --width 224 --height 224 --output build/lesson19/batch.npy"},{"api":"np.stack：在第 0 维合并单图张量","input":"两张已处理的 RGB uint8 HWC (224,224,3)","output":"dtype uint8、shape=(2,224,224,3)","why":"stack 会新增批维，要求单图形状一致。NHWC 的 Batch 维是 N，不是把通道数从 3 变成 6；顺序与原始 images 列表一一对应。","code":"batch = np.stack([image_a, image_b], axis=0)\nassert batch.shape == (2,224,224,3)"},{"api":"用保存的 JSON 还原样本与输出对应关系","input":"batch.npy、batch.json","output":"images 顺序、shape 和 dtype","why":"实际推理如果输出是 (N,C)，第 i 行对应输入的第 i 张图，但必须确认模型/Runtime 没有改变 batch 顺序与输出格式。","code":"python3 -c \"import numpy as np,json; a=np.load('build/lesson19/batch.npy'); print(a.shape); print(json.load(open('build/lesson19/batch.json')))\""}],"example":"如果输入两张 224×224×3 的 RGB 图片，生成 (2,224,224,3) 的 uint8 数组。输出若是 (2,1000)，通常是每张图片 1000 类分数，但该 shape 必须来自真实模型而非脚本推断。","acceptance":"使用两张真实图片生成 NPY 与 JSON，能从 batch 索引定位原图；仅证明组 Batch 正确，是否可由 RK3588 NPU 接收需要同协议模型上板验收。"}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
