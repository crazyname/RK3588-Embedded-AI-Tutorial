<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>yolov26模型部署(从0到1版) · 导出onnx与rknn模型并板端推理｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":32,"title":"yolov26模型部署(从0到1版) · 导出onnx与rknn模型并板端推理","intro":"完成训练权重 → ONNX → RKNN → RK3588 C++ 推理。","goals":["正确导出并验证 ONNX","执行 RKNN 模型转换与量化决策","部署与特定检测头对应的板端后处理"],"core":"这是第 30 讲的收尾专题。训练权重本身不一定适合直接给 RKNN 工具链，需要先确定稳定的 ONNX 导出方式，并检查导出后的检测头输出形状。有时教程采用特定源码补丁调整导出头，但源码修改有框架版本依赖，应以具体代码版本为准，并对每个转换阶段做结果回归。最终板端程序需要完成输入预处理、RKNN 推理、检测结果解码、NMS 和坐标映射。","steps":["固定训练框架、最优权重、导出脚本版本和测试图片","导出 ONNX 并在 ONNX Runtime 中对照源框架测试","通过 Netron 检查输入输出 shape、dtype 与输出头","使用 RKNN-Toolkit2 转换目标 RK3588 模型，按需准备校准数据","在板端使用 C/C++ 运行时加载模型，正确构造预处理输入","按对应模型版本完成检测头解码、置信度筛选、NMS 和坐标还原","比较 PyTorch、ONNX 与 RKNN 输出的精度和性能"],"pitfalls":["不同 YOLO 版本的输出头不能直接套用同一段后处理","ONNX 生成成功不代表量化 RKNN 精度一定合格","改动框架源码前应备份并记录补丁"],"checks":["同一张图在三个阶段均有可解释的预测结果","板端结果与训练/验证基线差异可定位"],"homework":["做一张三阶段结果对照表，包含模型哈希、指标、耗时"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"每次导出都要验证模型语义","explain":"从 `best.pt` 到 ONNX，建议显式记录 imgsz、opset、dynamic、simplify、是否将 NMS 包进图以及导出工具版本。Ultralytics 支持 ONNX 导出不保证该 ONNX 所有节点都可在 RKNPU2 上编译；YOLO26 目标板适配要特别关注模型检测头和后处理方式。第一步先用 ONNX Runtime 对固定图片比较源框架输出或最终检测结果。","takeaway":"导出成功只是文件格式转换通过，不代表 RK3588 一定支持。"},{"title":"RKNN 转换与算子兼容性","explain":"ONNX 图经过 RKNN-Toolkit2 编译时，算子集合、动态 shape、量化和内存要求要匹配当前 SDK。优先尝试非量化转换以隔离精度问题，遇到不支持算子时记录具体节点再考虑重导出、图改写或使用官方支持的替代模型。不能宣称未经验证的 YOLO26 改写可直接上板。","takeaway":"准备一个官方 Model Zoo YOLOv5/YOLOv8 作为已知可用的 RK3588 基线，用以分离环境与模型兼容问题。"},{"title":"端到端检测结果回归","explain":"对比 PyTorch、ONNX Runtime、RKNN 模拟和真实板端时，必须使用相同图像、前处理、框坐标系统、阈值与 NMS 定义。输出张量不同格式要先采用各自正确的后处理，再比较同一评估集的 mAP 与漏检，而不是直接比较两个未对齐的 raw tensor。","takeaway":"一张部署对照表包含精度、耗时、输入 shape、导出参数、SDK 版本和前后处理实现。"}],"lab":[{"title":"导出并校验 ONNX","action":"用当前 Ultralytics 版本导出 ONNX，运行 ONNX checker 和 ONNX Runtime，对已保存的训练框架测试图比较最终检测结果。","verify":"保留 ONNX opset、input/output shape、结果差异和文件 SHA。"},{"title":"尝试 RKNN 转换","action":"在受支持 Linux 主机上以 RKNN-Toolkit2 进行非量化编译。若失败，记录错误算子、日志与更改记录，不伪造成功产物。","verify":"清楚说明已支持的算子路径及障碍；转换成功再开始量化。"},{"title":"上板验收","action":"用与当前模型输出匹配的 C/Python 推理代码加载 `.rknn`，对固定验证集统计 mAP、端到端 FPS 和内存。","verify":"PyTorch/ONNX/RKNN 的可比任务指标与问题样例完整归档。"}],"diagnosis":[{"symptom":"RKNN build 报不支持算子","reason":"YOLO26 导出图包含当前 Toolkit2 不支持或不兼容的算子。","check":"用日志定位节点；检查导出 opset、nms 设置与工具链支持列表。"},{"symptom":"板端框正确性下降","reason":"量化、前处理、检测头 decode 或坐标逆变换不一致。","check":"先对非量化版本和少量固定样本做逐阶段回归。"}],"case":{"problem":"你在 Windows 训练得到 best.pt，导出 ONNX 后 ONNX Runtime 正常，但 RKNN build 失败。接下来应该刷驱动吗？","analysis":"先不要刷驱动，build 阶段发生在主机，主要应检查 opset、算子兼容、shape 和转换日志。驱动问题通常在板端加载或推理阶段定位。","evidence":"PyTorch/ONNX 结果、失败节点、SDK release、修改策略与转换日志。"},"snippet":"from ultralytics import YOLO\nmodel=YOLO('runs/detect/train/weights/best.pt')\nmodel.export(format='onnx', imgsz=640, dynamic=False)\n# 下一步：使用 ONNX Runtime 校验；之后在兼容的 Linux 主机转换 RKNN。\n# 仅 ONNX 导出成功，不代表 YOLO26 已得到 RK3588 官方支持。","refs":[["Ultralytics 模型导出","https://docs.ultralytics.com/modes/export/"],["Ultralytics ONNX 集成","https://docs.ultralytics.com/integrations/onnx/"],["RKNN 官方工具链","https://github.com/airockchip/rknn-toolkit2"],["RKNN 官方 Model Zoo","https://github.com/airockchip/rknn_model_zoo"]]}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
