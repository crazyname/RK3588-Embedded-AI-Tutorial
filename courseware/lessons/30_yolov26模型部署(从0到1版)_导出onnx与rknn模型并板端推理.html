<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>yolov26模型部署(从0到1版) · 导出onnx与rknn模型并板端推理｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":32,"title":"yolov26模型部署(从0到1版) · 导出onnx与rknn模型并板端推理","intro":"完成训练权重 → ONNX → RKNN → RK3588 C++ 推理。","goals":["正确导出并验证 ONNX","执行 RKNN 模型转换与量化决策","部署与特定检测头对应的板端后处理"],"core":"这是第 30 讲的收尾专题。训练权重本身不一定适合直接给 RKNN 工具链，需要先确定稳定的 ONNX 导出方式，并检查导出后的检测头输出形状。有时教程采用特定源码补丁调整导出头，但源码修改有框架版本依赖，应以具体代码版本为准，并对每个转换阶段做结果回归。最终板端程序需要完成输入预处理、RKNN 推理、检测结果解码、NMS 和坐标映射。","steps":["固定训练框架、最优权重、导出脚本版本和测试图片","导出 ONNX 并在 ONNX Runtime 中对照源框架测试","通过 Netron 检查输入输出 shape、dtype 与输出头","使用 RKNN-Toolkit2 转换目标 RK3588 模型，按需准备校准数据","在板端使用 C/C++ 运行时加载模型，正确构造预处理输入","按对应模型版本完成检测头解码、置信度筛选、NMS 和坐标还原","比较 PyTorch、ONNX 与 RKNN 输出的精度和性能"],"pitfalls":["不同 YOLO 版本的输出头不能直接套用同一段后处理","ONNX 生成成功不代表量化 RKNN 精度一定合格","改动框架源码前应备份并记录补丁"],"checks":["同一张图在三个阶段均有可解释的预测结果","板端结果与训练/验证基线差异可定位"],"homework":["做一张三阶段结果对照表，包含模型哈希、指标、耗时"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"每次导出都要验证模型语义","explain":"从 `best.pt` 到 ONNX，建议显式记录 imgsz、opset、dynamic、simplify、是否将 NMS 包进图以及导出工具版本。Ultralytics 支持 ONNX 导出不保证该 ONNX 所有节点都可在 RKNPU2 上编译；YOLO26 目标板适配要特别关注模型检测头和后处理方式。第一步先用 ONNX Runtime 对固定图片比较源框架输出或最终检测结果。","takeaway":"导出成功只是文件格式转换通过，不代表 RK3588 一定支持。"},{"title":"RKNN 转换与算子兼容性","explain":"ONNX 图经过 RKNN-Toolkit2 编译时，算子集合、动态 shape、量化和内存要求要匹配当前 SDK。优先尝试非量化转换以隔离精度问题，遇到不支持算子时记录具体节点再考虑重导出、图改写或使用官方支持的替代模型。不能宣称未经验证的 YOLO26 改写可直接上板。","takeaway":"准备一个官方 Model Zoo YOLOv5/YOLOv8 作为已知可用的 RK3588 基线，用以分离环境与模型兼容问题。"},{"title":"端到端检测结果回归","explain":"对比 PyTorch、ONNX Runtime、RKNN 模拟和真实板端时，必须使用相同图像、前处理、框坐标系统、阈值与 NMS 定义。输出张量不同格式要先采用各自正确的后处理，再比较同一评估集的 mAP 与漏检，而不是直接比较两个未对齐的 raw tensor。","takeaway":"一张部署对照表包含精度、耗时、输入 shape、导出参数、SDK 版本和前后处理实现。"}],"lab":[{"title":"导出并校验 ONNX","action":"用当前 Ultralytics 版本导出 ONNX，运行 ONNX checker 和 ONNX Runtime，对已保存的训练框架测试图比较最终检测结果。","verify":"保留 ONNX opset、input/output shape、结果差异和文件 SHA。"},{"title":"尝试 RKNN 转换","action":"在受支持 Linux 主机上以 RKNN-Toolkit2 进行非量化编译。若失败，记录错误算子、日志与更改记录，不伪造成功产物。","verify":"清楚说明已支持的算子路径及障碍；转换成功再开始量化。"},{"title":"上板验收","action":"用与当前模型输出匹配的 C/Python 推理代码加载 `.rknn`，对固定验证集统计 mAP、端到端 FPS 和内存。","verify":"PyTorch/ONNX/RKNN 的可比任务指标与问题样例完整归档。"}],"diagnosis":[{"symptom":"RKNN build 报不支持算子","reason":"YOLO26 导出图包含当前 Toolkit2 不支持或不兼容的算子。","check":"用日志定位节点；检查导出 opset、nms 设置与工具链支持列表。"},{"symptom":"板端框正确性下降","reason":"量化、前处理、检测头 decode 或坐标逆变换不一致。","check":"先对非量化版本和少量固定样本做逐阶段回归。"}],"case":{"problem":"你在 Windows 训练得到 best.pt，导出 ONNX 后 ONNX Runtime 正常，但 RKNN build 失败。接下来应该刷驱动吗？","analysis":"先不要刷驱动，build 阶段发生在主机，主要应检查 opset、算子兼容、shape 和转换日志。驱动问题通常在板端加载或推理阶段定位。","evidence":"PyTorch/ONNX 结果、失败节点、SDK release、修改策略与转换日志。"},"snippet":"from ultralytics import YOLO\nmodel=YOLO('runs/detect/train/weights/best.pt')\nmodel.export(format='onnx', imgsz=640, dynamic=False)\n# 下一步：使用 ONNX Runtime 校验；之后在兼容的 Linux 主机转换 RKNN。\n# 仅 ONNX 导出成功，不代表 YOLO26 已得到 RK3588 官方支持。","refs":[["Ultralytics 模型导出","https://docs.ultralytics.com/modes/export/"],["Ultralytics ONNX 集成","https://docs.ultralytics.com/integrations/onnx/"],["RKNN 官方工具链","https://github.com/airockchip/rknn-toolkit2"],["RKNN 官方 Model Zoo","https://github.com/airockchip/rknn_model_zoo"]],"walkthrough":{"intro":"第 30 讲专题三需要分清三种成功：从 .pt 导出 ONNX 成功、RKNN build 成功、目标板检测后处理成功。仓库 lesson_32.py 覆盖前两段，第三段仍须模型专属验证。","flow":["best.pt","ONNX export + checker","Toolkit2 build","兼容模型.rknn","正确检测头解码（另验收）"],"steps":[{"api":"Ultralytics 导出与 ONNX checker","input":"真实 .pt 权重、imgsz=640 和固定 export 版本","output":"ONNX 图 + input/output shape 与算子列表","why":"ONNX checker 只能证明文件结构有效，不能保证其算子组合被 RKNN Toolkit2 支持。记录导出选项，不要在未验证情况下拼接通用后处理。","code":"exported = YOLO(str(weights)).export(format='onnx', imgsz=640, dynamic=False)\nmodel = onnx.load(str(exported))\nonnx.checker.check_model(model)"},{"api":"convert_onnx.py：构建 RKNN 的真实边界","input":"ONNX 图、mean/std 和目标 rk3588","output":"SDK 认可时生成 .rknn 或在 build 记录失败","why":"转换脚本内部依次执行 config、load_onnx、build、export；如果 build 失败，通常要定位导出图的算子与 shape，先不要刷板端驱动。","code":"python3 examples/lesson_32.py --weights /path/to/best.pt \\\n  --imgsz 640 --rknn build/lesson32/model.rknn"},{"api":"板端后处理必须匹配 YOLO26 检测头","input":"真实 RKNN 输出 tensor 的数量、shape、dtype","output":"按该模型适配的检测框与类别","why":"不可以将 YOLOv8 Model Zoo 优化版的 64/80/1 输出结构强套给任意 YOLO26 ONNX。仓库该专题目前不包含通用的 YOLO26 C++ 检测头适配。","code":"# 必须先打印真实输出的数量、shape 和 dtype\n# 再根据模型导出协议实现正确 decode / NMS"}],"example":"模型能从 .pt 导出 ONNX 但 Toolkit2 报不支持算子：应首先收集 ONNX 节点、opset、错误日志和工具版本；ONNX Runtime 的预测对照属于 PC 阶段，不能替代 RKNN NPU 检测结果。","acceptance":"至少提供实际 ONNX 检查与 RKNN 编译日志。没有兼容输出头及板端同图检测对照时，必须将最后一段标记“待验证”，不能写成 YOLO26 已部署。"},"guidance":{"phases":[{"title":"先校对模型和真实输入","action":"先固定成功完成专题一预测的真实权重和框架，确认导出环境已安装 onnx；分清 PC 导出与板端推理。","command":"","observe":"关键输入为 真实 .pt 权重、imgsz=640 和固定 export 版本；正确输出应为 ONNX 图 + input/output shape 与算子列表。","diagnose":"导出时报算子错误时记录模型/框架版本、opset 与 Toolkit2 日志；不要更换成不匹配的 YOLOv8 解码。","teach":"展示实际模型来源、类别/输出头形状及主机与板端角色。"},{"title":"教师演示一条可运行路径","action":"在正确的 PC 或 ROCK 5B 环境执行；路径占位符须替换为已取得的真实资源。","command":"python3 examples/lesson_32.py --weights /path/to/best.pt --imgsz 640 --report build/lesson32/conversion.json","observe":"真实运行可导出 ONNX 并进行 checker 检查，报告图结构；需要配套 Toolkit2 才能额外使用 --rknn 构建。","diagnose":"导出时报算子错误时记录模型/框架版本、opset 与 Toolkit2 日志；不要更换成不匹配的 YOLOv8 解码。","teach":"结合当前 SDK 对参数逐一解释，检查结果是否可复现。"},{"title":"学生验收：解释结果与技术边界","action":"分别归档 .pt 权重来源、ONNX opset/输入输出、Toolkit2 build 日志、RKNN 文件哈希及板端实测。当前课程第 30 讲专题三以导出和兼容性验证为闭环，不把未完成的 YOLO26 C++ 后处理写成已部署成功。","command":"python3 -c \"import json;j=json.load(open('build/lesson32/conversion.json'));print(sorted(j.keys()))\"","observe":"`onnx.checker.check_model()` 成功只说明 ONNX protobuf/图合法；Toolkit2 仍可能因不支持的算子或动态 shape 在 load_onnx/build 阶段失败。若输出只有一个经过框架后处理的张量，强行将它拆成 `[1,64,H,W]` 的 DFL 分支属于协议错误。","diagnose":"至少提供实际 ONNX 检查与 RKNN 编译日志。没有兼容输出头及板端同图检测对照时，必须将最后一段标记“待验证”，不能写成 YOLO26 已部署。","teach":"问学生为何 PC 成功、转换成功和 NPU 推理成功是不同层次的证据。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
