<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型转换工具rknn · convert｜RK3588 HTML 教学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":11,"title":"模型转换工具rknn · convert","intro":"使用命令行与配置文件组织模型转换。","goals":["知道 CLI 与 Python API 的对应关系","学会查阅 YAML 模板与参数含义","让模型转换记录可重复执行"],"core":"`rknn_convert` 是相关 SDK 提供的命令行转换工具，可通过配置文件组织源模型、目标平台、输入信息及量化选项。它与 Python API 的核心目标类似，适合批量转换或持续集成。由于 CLI 参数和 YAML 键名会随工具链版本变化，本讲不凭口播字幕猜测完整命令，实际应使用该版本自带 `--help` 与示例。","steps":["查找当前 RKNN SDK 附带的转换工具和示例 YAML","读取 `--help`，确定参数和配置文件位置","复制官方示例，替换模型文件与输出路径","运行 CLI 并检查退出状态、转换日志和输出模型","使用已知测试输入比较 Python API 和 CLI 导出的模型"],"checks":["能解释配置文件中模型路径、平台、量化方式的作用","保留转换工具版本和配置文件用于复现"],"pitfalls":["CLI 与 Python API 可能提供不同的选项与默认值","不可从自动转写直接复制拼写不确定的命令"],"homework":["把第 09 讲模型转换过程记录成一份可复现配置清单"],"code":""}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
