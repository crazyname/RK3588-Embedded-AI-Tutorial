<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型转换工具rknn · convert｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":11,"title":"模型转换工具rknn · convert","intro":"使用命令行与配置文件组织模型转换。","goals":["知道 CLI 与 Python API 的对应关系","学会查阅 YAML 模板与参数含义","让模型转换记录可重复执行"],"core":"`rknn_convert` 是相关 SDK 提供的命令行转换工具，可通过配置文件组织源模型、目标平台、输入信息及量化选项。它与 Python API 的核心目标类似，适合批量转换或持续集成。由于 CLI 参数和 YAML 键名会随工具链版本变化，本讲不凭口播字幕猜测完整命令，实际应使用该版本自带 `--help` 与示例。","steps":["查找当前 RKNN SDK 附带的转换工具和示例 YAML","读取 `--help`，确定参数和配置文件位置","复制官方示例，替换模型文件与输出路径","运行 CLI 并检查退出状态、转换日志和输出模型","使用已知测试输入比较 Python API 和 CLI 导出的模型"],"pitfalls":["CLI 与 Python API 可能提供不同的选项与默认值","不可从自动转写直接复制拼写不确定的命令"],"checks":["能解释配置文件中模型路径、平台、量化方式的作用","保留转换工具版本和配置文件用于复现"],"homework":["把第 09 讲模型转换过程记录成一份可复现配置清单"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"转换 CLI 只是 SDK 的自动化入口","explain":"命令行转换工具把模型输入路径、目标平台、量化策略和输出位置变成参数或配置文件，适合批处理和 CI，但并不会自动修正错误的训练前处理。不同 release 的 `rknn_convert` 参数、配置字段可能变化，因此运行前看同版本 `--help` 和官方示例比背口播命令更可靠。","takeaway":"首先核查实际安装的是哪个可执行文件、属于哪个 SDK release。"},{"title":"配置文件要留下审计痕迹","explain":"转换配置至少应含输入模型来源与 SHA256、target_platform、输入 layout、量化开关、校准数据位置和输出路径。相同文件名可能被覆盖，生成后还要记录转换日志和模型文件哈希值，便于复现与回滚。","takeaway":"将配置和输出 hash 一起提交版本库，避免把不同构建混为一谈。"},{"title":"设计一个可重复批量转换流水线","explain":"一个健壮的脚本先做参数合法性与文件存在性检查，再调用转换、保存 stdout/stderr、检查退出码和输出文件；最后执行固定样本的精度验证。仅看 shell 返回 0，无法判断转换后业务语义是否正确。","takeaway":"转换自动化以‘构建通过 + 语义回归’两个条件判断是否合格。"}],"lab":[{"title":"核对 CLI 版本","action":"在匹配 SDK 环境里先检查 `which rknn_convert` 与帮助信息（若该 release 提供此命令）；找不到则使用 SDK 的 Python 示例。","verify":"确认使用的是已经安装的真实工具，并保存帮助页面和版本。"},{"title":"准备转换任务单","action":"为一个 ONNX 模型建立 src_model、target、dtype、quantize、calibration、output、sdk_version 的表格。","verify":"任务单里每一项有确定值或明确的‘不适用’。"},{"title":"添加产物校验","action":"转换前计算源 ONNX 的 SHA256；转换后计算 RKNN 的 SHA256 并归档日志。","verify":"至少有一个可解释的输入到输出的追踪链。"}],"diagnosis":[{"symptom":"复制命令却提示未知参数","reason":"参数来自另一版 `rknn_convert`。","check":"查当前 SDK 的 `--help`，不要在无法验证的情况下猜测选项名称。"},{"symptom":"同一条命令重复输出不同结果","reason":"模型来源变化、校准集变化或安装依赖未固定。","check":"对比输入 SHA256、校准列表、SDK 版本及转换日志。"}],"case":{"problem":"你在自动化系统中每次生成 `model.rknn`，文件名一样但某周精度骤降，怎样回溯？","analysis":"查看该构建的源模型 hash、校准数据清单、SDK tag、转换参数和输出 hash，再使用保存的验证集运行回归测试。没有这些数据就很难定位。","evidence":"每次构建的 manifest、日志与量化/非量化对照结果。"},"snippet":"sha256sum model.onnx\n# 如当前 SDK 提供 CLI：先执行 rknn_convert --help\n# 再根据该版本参数转换模型，而不是臆造选项。\nsha256sum model.rknn","refs":[["官方 Toolkit2 文档与示例","https://github.com/airockchip/rknn-toolkit2"],["RKNN Model Zoo 具体 convert.py","https://github.com/airockchip/rknn_model_zoo"],["Git 文档","https://git-scm.com/docs"]],"walkthrough":{"intro":"第 11 讲的 lesson_11.py 是一个小型批量转换器：从 JSON jobs 依次调用同一个 convert_onnx.py，保存每个模型的实际转换日志。它不是替代 RKNN-Toolkit2 的魔法转换格式。","flow":["jobs.json","单项 ONNX + mean/std","convert_onnx.py","task_XX.log","manifest.json"],"steps":[{"api":"jobs.json：每个转换任务的输入协议","input":"数组内每项包含 onnx、output、mean、std","output":"明确文件名与可选 quantize/dataset 的任务表","why":"model.onnx 需要真实存在；mean/std 要根据该图的训练输入规定填写，不能把所有模型统一写成 0/1。","code":"[\n  {\"onnx\":\"build/tiny.onnx\",\"output\":\"build/tiny.rknn\",\"mean\":\"0,0,0\",\"std\":\"1,1,1\"}\n]"},{"api":"subprocess.run：逐项执行官方 Toolkit2 API 封装","input":"转换任务 cmd 数组","output":"真实 exit_code 与 stdout/stderr 合并日志","why":"转换器实际调用 config/load_onnx/build/export_rknn，失败会记入日志并导致脚本退出非零。日志成功不一定表明 RK3588 能跑。","code":"python3 examples/lesson_11.py --jobs /path/to/jobs.json --log-dir build/lesson11"},{"api":"manifest.json：分清成功和失败","input":"每项返回码、模型输出路径和日志路径","output":"每个任务的运行摘要；不能反推出真实量化精度","why":"转换通过后还要跑后续模拟/板端推理，并用相同输入做数值或任务指标对照。INT8 必须有代表性校准数据。","code":"python3 -c \"import json; print(json.load(open('build/lesson11/manifest.json')))\""}],"example":"同一项目 2 个模型：A 转换成功、B 因不支持算子失败。manifest 必须保留两项不同 exit_code，不得只保留成功的 A 再声称全部模型可部署。","acceptance":"在具备 Toolkit2 的真实主机上保存逐任务日志、输出模型及成功/失败清单；在无 Toolkit2 时先完成 JSON 配置理解。"}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
