<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>yolov5模型部署实战｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":29,"title":"yolov5模型部署实战","intro":"完成 YOLOv5 图片和视频目标检测应用。","goals":["识别 YOLO 检测与 MobileNet 分类的差异","掌握置信度筛选、NMS 与坐标映射","实现 C++ 端视频流检测并测量端到端 FPS"],"core":"YOLOv5 推理得到的是检测候选框、类别与相关置信度，通常需要配套后处理。应明确导出模型的输出头布局、anchor/stride 约定，以及 NMS 位于网络内部还是应用端；不同 YOLO 版本或导出方式不可共用错误的解码代码。应用还需要预处理、映射回原图坐标、绘制检测框与处理视频帧。","steps":["获取与 RKNN 转换脚本匹配的 YOLOv5 ONNX/RKNN","用 Netron 和 `rknn_query` 核对输入输出 tensor 的形状","实现正确的 Resize 或 letterbox 预处理","执行 RKNN C/C++ 推理并实现与检测头匹配的解码","进行置信度筛选、NMS、标签显示与原图坐标还原","扩展到视频流并记录解码、推理、后处理、绘制各阶段耗时"],"pitfalls":["错误的 letterbox 坐标还原会令框偏移","置信度/IoU 阈值不能只按视频示例硬编码","纯 NPU FPS 不能等同于视频业务 FPS"],"checks":["能在图片上得到正确的检测框和类别","视频处理输出稳定 FPS 且无持续增长的内存占用"],"homework":["制作一次图片检测与视频检测的延迟分解报告"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"目标检测输出不只是类别分数","explain":"YOLOv5 输出通常表示候选框、物体置信度与类别概率，并可能经过不同形式的检测头。官方 RKNN 适配模型会为量化/编译调整输出节点布局，不能拿原版 PyTorch 的后处理直接生搬。先在 Netron 查看 output shape，再比对 Model Zoo 对应 C++ 和 Python 的 decode。","takeaway":"后处理设计必须与这份 ONNX/RKNN 的实际输出 tensor 精确匹配。"},{"title":"Letterbox 和坐标还原","explain":"将原图等比例缩放后填充到固定输入时，预测的 x/y 坐标在 letterbox 画布上。还原回原图必须减去 padding 偏移，再除以 scale，最终裁剪到图片边界。若直接将网络 640×640 坐标按宽高简单拉伸，非方形原图上的框会系统性偏移。","takeaway":"用已知矩形坐标手算一遍反变换，才能信任模型检测框。"},{"title":"NMS 与性能评估","explain":"NMS 根据置信度、IoU 和类别筛选重叠框。IoU 是交集面积除并集面积；过低阈值可能压掉邻近对象，过高可能产生重复框。模型量化和后处理阈值改变后应重新测 mAP、漏检和端到端 FPS，而非只看单图效果。","takeaway":"每张检测结果应可追溯到输入、置信度阈值、NMS 阈值和类别列表。"}],"lab":[{"title":"跑官方 YOLOv5 Demo","action":"按 Model Zoo 对应文档获取配套模型，使用样例图片执行 ONNX 与 RKNN 推理。","verify":"保存推理输出框及官方预计的输出图片。"},{"title":"手算 letterbox","action":"假设原图 1280×720 输入 640×640，scale=min(640/1280,640/720)=0.5，纵向填充共 280，通常上下各 140。","verify":"能由模型坐标反推出原图 y=(y_pred-140)/0.5。"},{"title":"验证 NMS","action":"构造同类别高 IoU 的两个候选框，比较启用 NMS 前后数量；再在真实样本上评估召回。","verify":"阈值变化带来的检测差异可解释。"}],"diagnosis":[{"symptom":"检测框明显偏上或偏下","reason":"letterbox padding 或比例还原不正确。","check":"核对 preprocess resize/padding 和 box 反变换公式。"},{"symptom":"输出 tensor 数目与教程不同","reason":"模型来自不同版本或导出时检测头被改写。","check":"确认 Model Zoo 优化模型的结构与后处理实现。"}],"case":{"problem":"一张 1280×720 的图像在 640×640 模型输入上检测正确，画回原图后框向下偏 280 像素。可能漏掉什么？","analysis":"很可能忽略了 letterbox 的填充偏移，或把总填充当成单侧填充。应记录 scale、pad_left、pad_top，与模型框进行逆变换。","evidence":"原图尺寸、输入缩放及填充示意、变换前后坐标与检测图片。"},"snippet":"orig_w,orig_h,model_w,model_h=1280,720,640,640\nscale=min(model_w/orig_w,model_h/orig_h)\npad_x=(model_w-orig_w*scale)/2\npad_y=(model_h-orig_h*scale)/2\nx_model,y_model=300,250\nprint((x_model-pad_x)/scale,(y_model-pad_y)/scale)\n# 整数取整策略应与实际 letterbox 预处理一致。","refs":[["RKNN YOLOv5 官方示例","https://github.com/airockchip/rknn_model_zoo/tree/main/examples/yolov5"],["Ultralytics 检测任务文档","https://docs.ultralytics.com/tasks/detect/"],["《动手学深度学习》目标检测","https://d2l.com.cn/"]]}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
