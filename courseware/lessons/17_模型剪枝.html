<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型剪枝｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":17,"title":"模型剪枝","intro":"正确理解 SDK 自动剪枝与训练期模型剪枝的区别。","goals":["解释剪枝降低模型体积与计算量的原理","认识自动无损剪枝的适用边界","对剪枝结果进行精度、速度和内存复测"],"core":"剪枝通过删除冗余权重、通道或计算路径来降低资源占用。课程介绍 RKNN-Toolkit2 在某些版本提供的自动剪枝能力，着重于可无损移除的冗余计算。它与深度学习训练阶段的结构化剪枝/微调不同，并非所有网络都存在足够冗余可以优化。是否启用相应配置应查对当前 SDK 版本文档，而不是直接按口播转写猜测参数名称。","steps":["记录原始模型的权重大小、任务精度、NPU 延迟和内存","核对当前 SDK 的剪枝开关、条件与支持的模型结构","启用自动剪枝并保留构建日志","比较剪枝前后模型大小、运算量和端到端性能","若收益过低，分析模型结构是否具备可裁剪冗余"],"pitfalls":["没有剪枝日志不一定意味着转换失败","不能把自动无损剪枝等同于手工结构化剪枝训练"],"checks":["能说明剪枝成功和性能加速并非同义词","能以一致的验证集检查精度是否变化"],"homework":["设计一份对照实验表，记录剪枝前后模型大小与精度"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"剪枝与实际加速的区别","explain":"非结构化剪枝把部分权重变为零，但如果硬件仍按稠密矩阵计算，不一定提速。结构化剪枝删除通道或卷积块，可能减少真实运算量，却会改变后续层维度。是否有收益取决于 NPU 算子支持、图优化和内存访问。","takeaway":"参数量减少不能替代板端时延测量。"},{"title":"评估剪枝精度损失","explain":"重要通道被剪掉可能造成严重精度下降。通常先用浮点基线，然后剪枝、微调、验证，再导出 ONNX 和 RKNN；若当前 SDK 不支持自动剪枝接口，应该遵循训练框架方案，而不是猜命令。","takeaway":"保存未剪枝、剪枝后、量化后三个版本。"},{"title":"优化顺序和归因","explain":"单独评估剪枝和量化效果后再组合：原模型 FP、剪枝 FP、原模型 INT8、剪枝 INT8 的消融表可以区分每个阶段的贡献。性能指标同时包含延迟、内存、mAP/Top-1 和温度。","takeaway":"一次只改变一个因素才容易解释成败。"}],"lab":[{"title":"建立 FP 基线","action":"选择一个固定验证集记录参数、shape、准确率、板端时延。","verify":"所有基线文件和版本可追溯。"},{"title":"尝试结构化剪枝","action":"依据训练框架或 SDK 支持的 API 删除少量通道，检查新图的 shape。","verify":"能指出哪些实际计算节点发生变化。"},{"title":"做对照实验","action":"测试剪枝和量化前后的 mAP、时延、文件大小。","verify":"精度性能取舍而非仅声明模型变小。"}],"diagnosis":[{"symptom":"剪枝 30% 权重但速度不变","reason":"NPU 没有利用稀疏性，瓶颈也可能不在该算子。","check":"检查是否减少 tensor 维度与有效计算。"},{"symptom":"剪枝后漏检剧增","reason":"削弱了检测头或特征提取。","check":"降低剪枝强度、微调并重测独立验证集。"}],"case":{"problem":"自动剪枝后 RKNN 文件变小 10%，NPU 延迟几乎不变，继续把剪枝比例加倍可以吗？","analysis":"不要盲目加倍。先确认稀疏模式、算子图和硬件执行方式；如果没有减少实际计算或搬运，继续剪可能只会牺牲精度。","evidence":"原始与剪枝后 ONNX 图、时延、任务精度和内存对照。"},"snippet":"# 实验记录字段示例\n# model_sha, prune_strategy, prune_ratio,\n# accuracy, npu_ms, end_to_end_ms, peak_rss_mb\n# 剪枝 API 以当前 PyTorch/SDK 文档为准。","refs":[["PyTorch 剪枝教学","https://docs.pytorch.org/tutorials/intermediate/pruning_tutorial.html"],["深度学习理论教材","https://www.deeplearningbook.org/"]],"walkthrough":{"intro":"第 17 讲的 lesson_17.py 实际修改两层 Conv 权重数组，按第一层通道权重的 L1 绝对值选择保留通道，并同步切掉第二层对应输入通道。它是结构化剪枝数学实验，不包含微调或模型部署。","flow":["conv1[out,in,kh,kw]","计算各 out 通道 L1","筛选 kept_indices","裁剪 conv1 输出和 conv2 输入","pruned.npz"],"steps":[{"api":"计算每个输出通道的 L1 分数","input":"卷积权重 conv1，shape=(Cout,Cin,Kh,Kw)","output":"每个 Cout 对应一个 L1 分数","why":"按 |W| 总和选通道是一种简单的启发式规则，不代表它在训练数据上的重要性排序绝对正确。默认未指定权重时脚本使用显式的随机两层演示权重。","code":"python3 examples/lesson_17.py --keep-ratio 0.75 --output build/lesson17/pruned.npz"},{"api":"选择索引并同时修改相邻卷积","input":"第一层 conv1 和第二层 conv2，要求 conv2.shape[1]==conv1.shape[0]","output":"conv1[keep,:,:,:] 和 conv2[:,keep,:,:]","why":"只改第一层输出通道会造成第二层 input channels 不匹配；完整网络还可能包括 BN、残差、分支连接等，不能套用简单两层剪枝代码。","code":"score = np.sum(np.abs(conv1), axis=(1,2,3))\nkeep = np.sort(np.argsort(score)[-n:])\nconv1_new = conv1[keep]\nconv2_new = conv2[:,keep]"},{"api":"剪枝结果保存的是权重，不是可部署模型","input":"剪枝后权重和保留通道索引","output":"npz 的 conv1、conv2、kept_channel_indices","why":"结构形状变小不等于 RK3588 NPU 推理自动加速；后续必须重新构建模型图、微调并验证精度和 RKNN 兼容性。","code":"python3 -c \"import numpy as np; z=np.load('build/lesson17/pruned.npz'); print(z['conv1'].shape,z['conv2'].shape,z['kept_channel_indices'])\""}],"example":"原 conv1=(16,3,3,3)、conv2=(32,16,3,3)，keep_ratio=0.75 时保留 12 通道，输出应是 (12,3,3,3) 和 (32,12,3,3)；这是权重操作，不是经过训练的 MobileNet。","acceptance":"在 PC 验证两层权重的通道数一致、保留索引合理；把模型精度、RKNN 转换与加速明确列为下一阶段，不夸称本例已完成。"},"guidance":{"phases":[{"title":"先把输入、模型与运行环境对齐","action":"首先理解 `(Cout,Cin,Kh,Kw)` 轴的物理意义；真实模型实验需通过 --weights 提供权重。","command":"","observe":"输入契约为 卷积权重 conv1，shape=(Cout,Cin,Kh,Kw)；此步目标输出 每个 Cout 对应一个 L1 分数。","diagnose":"若 conv2 的输入通道与 conv1 的输出不一致，先检查两层图结构，再决定能否直接用简单示例剪枝。","teach":"把输入格式和主机/开发板角色写在黑板上。"},{"title":"运行可复现的最小代码","action":"在仓库根目录执行示范命令，先替换真实文件占位路径。","command":"python3 examples/lesson_17.py --keep-ratio 0.75 --output build/lesson17/pruned.npz","observe":"明确提示默认合成两层 CNN 权重，输出原始/剪枝后 shape、保留通道索引和 NPZ 路径。","diagnose":"若 conv2 的输入通道与 conv1 的输出不一致，先检查两层图结构，再决定能否直接用简单示例剪枝。","teach":"展示终端真实输出，对照字段解释代码数据流。"},{"title":"核对数值与验收边界","action":"先验证裁剪前后每层输入/输出通道能接续，再做微调、准确率回归、ONNX 导出与 RKNN 编译测试；不要把 NPZ 矩阵变小写成已完成模型部署。","command":"python3 -c \"import numpy as np;z=np.load('build/lesson17/pruned.npz');print(z['conv1'].shape,z['conv2'].shape)\"","observe":"若 conv1 权重 `(16,3,3,3)`、conv2 为 `(32,16,3,3)`，保持比例 0.75 后，第一层输出通道变 12，第二层输入通道也必须从 16 变 12；否则图无法正常执行。理论参数数量下降仍不保证 RK3588 更快，需要重新导出图、微调并测量真实 NPU 延迟。","diagnose":"在 PC 验证两层权重的通道数一致、保留索引合理；把模型精度、RKNN 转换与加速明确列为下一阶段，不夸称本例已完成。","teach":"要求解释结果能证明什么、尚不能证明什么。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
