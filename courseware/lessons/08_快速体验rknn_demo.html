<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快速体验rknn · demo｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":8,"title":"快速体验rknn · demo","intro":"通过官方 demo 建立主机与 RK3588 板端推理闭环。","goals":["定位 RKNN 官方 examples 与测试资源","在主机验证示例模型","在板端执行 NPU 推理并检查结果"],"core":"本讲先运行现有官方示例，再学习自己写转换和推理代码。PC 端可以使用模型转换示例或模拟器快速检查模型输入输出；RK3588 板端运行则真正涉及 NPU 驱动和用户态运行时。建议始终保留测试图片、模型版本、返回值及日志。","steps":["选择和正在使用的 SDK release 匹配的官方 demo","核对测试图片、源模型/RKNN 模型和依赖库的路径","在 Ubuntu 主机执行官方文档提供的对应示例","将板端程序、模型和测试数据复制到开发板","在板端运行并比对识别输出与输入内容"],"pitfalls":["不同 SDK 版本的 `examples` 路径及脚本名称可能不同","避免把没有真正运行的模拟器结果当作板端测量值"],"checks":["能说明模拟器与真实 NPU 推理区别","同一测试输入有合理的分类或检测结果"],"homework":["更换一张测试图片并记录两种运行环境的输出差异"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"为什么从官方 Demo 开始","explain":"工程学习的第一个任务是建立已知可用的基线。官方 Model Zoo 通常提供模型文件来源、convert.py、Python 推理、C/C++ 示例和期望结果。相比立刻开发自己的推理框架，先让这个闭环成功可以排除硬件、驱动、转换和输入图片的问题。要固定同一仓库提交和匹配的 SDK。","takeaway":"第一个成功案例应能回答：模型来自哪里、怎么构建、在哪个系统上运行、产生了什么输出。"},{"title":"区分主机验证和板端推理","explain":"有些官方示例允许在开发主机侧执行模型转换或模拟验证，但目标板上仍要有对应 NPU 驱动与 runtime。主机 `python convert.py` 输出 `.rknn` 不是板端性能证据；板端运行时也可能用与转换脚本不同的语言或编译器。","takeaway":"一条闭环包含“模型可转换”和“板端结果可信”，并且要保留对应输入图片。"},{"title":"Demo 的输入输出协议","explain":"以 YOLOv5 为例，官方适配模型可能与原始上游模型输出节点布局不同。预处理方式、量化参数及后处理应与这个具体模型适配。简单替换成网络下载的另一个 ONNX，不应期待旧 C++ Demo 无修改即可运行。","takeaway":"优先使用示例 README 中配套的模型和图片，再逐步替换输入。"}],"lab":[{"title":"固定版本","action":"clone `airockchip/rknn_model_zoo`，选择官方示例支持 RK3588 的分支，并记录 commit。","verify":"repo URL、SHA、model zoo 子目录和 target 平台字段都有记录。"},{"title":"运行配套模型","action":"按示例 README 下载安装模型和依赖，先使用随例图片执行转换与推理；C++ Demo 按 Linux 编译说明选择 aarch64。","verify":"保存模型转换日志、编译输出和带框/类别结果文件。"},{"title":"只修改输入图片","action":"保持模型与应用代码不变，换成尺寸不同的测试图并验证预处理与图像输出。","verify":"检测框仍可映射到原图正确位置，并能解释失败样本。"}],"diagnosis":[{"symptom":"build-linux 失败","reason":"交叉编译器路径、CMake 工具链或 ARM 架构设置错误。","check":"先检查编译器可执行文件与 `-t rk3588 -a aarch64` 的对应关系。"},{"symptom":"显示大量错框","reason":"模型输出与后处理版本不匹配，也可能是 BGR/RGB 或 letterbox 映射错误。","check":"恢复官方配套模型和图片，逐阶段检查结果。"}],"case":{"problem":"官方 YOLOv5 Demo 用样例图正常，但你把 ONNX 换成新下载的 YOLOv5 后得到乱码框。这说明 NPU 坏了吗？","analysis":"不说明。模型导出节点、后处理部署头、类别数、输入规格可能变化。查看 Netron 与官方示例说明，确认模型输出 tensor 和代码解码逻辑一一对应。","evidence":"原模型与替换模型的输入输出 shape、导出参数及结果对照图。"},"snippet":"git clone https://github.com/airockchip/rknn_model_zoo.git\ngit -C rknn_model_zoo rev-parse HEAD\n# 阅读对应示例 README 后再下载模型和执行板端构建：\n# https://github.com/airockchip/rknn_model_zoo/tree/main/examples/yolov5","refs":[["官方模型示例与各型号平台支持","https://github.com/airockchip/rknn_model_zoo"],["YOLOv5 官方 RKNN 案例","https://github.com/airockchip/rknn_model_zoo/tree/main/examples/yolov5"],["RKNN SDK 入口","https://github.com/airockchip/rknn-toolkit2"]]}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
