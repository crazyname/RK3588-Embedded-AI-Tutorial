<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快速体验rknn · demo｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":8,"title":"快速体验rknn · demo","intro":"通过官方 demo 建立主机与 RK3588 板端推理闭环。","goals":["定位 RKNN 官方 examples 与测试资源","在主机验证示例模型","在板端执行 NPU 推理并检查结果"],"core":"本讲先运行现有官方示例，再学习自己写转换和推理代码。PC 端可以使用模型转换示例或模拟器快速检查模型输入输出；RK3588 板端运行则真正涉及 NPU 驱动和用户态运行时。建议始终保留测试图片、模型版本、返回值及日志。","steps":["选择和正在使用的 SDK release 匹配的官方 demo","核对测试图片、源模型/RKNN 模型和依赖库的路径","在 Ubuntu 主机执行官方文档提供的对应示例","将板端程序、模型和测试数据复制到开发板","在板端运行并比对识别输出与输入内容"],"pitfalls":["不同 SDK 版本的 `examples` 路径及脚本名称可能不同","避免把没有真正运行的模拟器结果当作板端测量值"],"checks":["能说明模拟器与真实 NPU 推理区别","同一测试输入有合理的分类或检测结果"],"homework":["更换一张测试图片并记录两种运行环境的输出差异"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"为什么从官方 Demo 开始","explain":"工程学习的第一个任务是建立已知可用的基线。官方 Model Zoo 通常提供模型文件来源、convert.py、Python 推理、C/C++ 示例和期望结果。相比立刻开发自己的推理框架，先让这个闭环成功可以排除硬件、驱动、转换和输入图片的问题。要固定同一仓库提交和匹配的 SDK。","takeaway":"第一个成功案例应能回答：模型来自哪里、怎么构建、在哪个系统上运行、产生了什么输出。"},{"title":"区分主机验证和板端推理","explain":"有些官方示例允许在开发主机侧执行模型转换或模拟验证，但目标板上仍要有对应 NPU 驱动与 runtime。主机 `python convert.py` 输出 `.rknn` 不是板端性能证据；板端运行时也可能用与转换脚本不同的语言或编译器。","takeaway":"一条闭环包含“模型可转换”和“板端结果可信”，并且要保留对应输入图片。"},{"title":"Demo 的输入输出协议","explain":"以 YOLOv5 为例，官方适配模型可能与原始上游模型输出节点布局不同。预处理方式、量化参数及后处理应与这个具体模型适配。简单替换成网络下载的另一个 ONNX，不应期待旧 C++ Demo 无修改即可运行。","takeaway":"优先使用示例 README 中配套的模型和图片，再逐步替换输入。"}],"lab":[{"title":"固定版本","action":"clone `airockchip/rknn_model_zoo`，选择官方示例支持 RK3588 的分支，并记录 commit。","verify":"repo URL、SHA、model zoo 子目录和 target 平台字段都有记录。"},{"title":"运行配套模型","action":"按示例 README 下载安装模型和依赖，先使用随例图片执行转换与推理；C++ Demo 按 Linux 编译说明选择 aarch64。","verify":"保存模型转换日志、编译输出和带框/类别结果文件。"},{"title":"只修改输入图片","action":"保持模型与应用代码不变，换成尺寸不同的测试图并验证预处理与图像输出。","verify":"检测框仍可映射到原图正确位置，并能解释失败样本。"}],"diagnosis":[{"symptom":"build-linux 失败","reason":"交叉编译器路径、CMake 工具链或 ARM 架构设置错误。","check":"先检查编译器可执行文件与 `-t rk3588 -a aarch64` 的对应关系。"},{"symptom":"显示大量错框","reason":"模型输出与后处理版本不匹配，也可能是 BGR/RGB 或 letterbox 映射错误。","check":"恢复官方配套模型和图片，逐阶段检查结果。"}],"case":{"problem":"官方 YOLOv5 Demo 用样例图正常，但你把 ONNX 换成新下载的 YOLOv5 后得到乱码框。这说明 NPU 坏了吗？","analysis":"不说明。模型导出节点、后处理部署头、类别数、输入规格可能变化。查看 Netron 与官方示例说明，确认模型输出 tensor 和代码解码逻辑一一对应。","evidence":"原模型与替换模型的输入输出 shape、导出参数及结果对照图。"},"snippet":"git clone https://github.com/airockchip/rknn_model_zoo.git\ngit -C rknn_model_zoo rev-parse HEAD\n# 阅读对应示例 README 后再下载模型和执行板端构建：\n# https://github.com/airockchip/rknn_model_zoo/tree/main/examples/yolov5","refs":[["官方模型示例与各型号平台支持","https://github.com/airockchip/rknn_model_zoo"],["YOLOv5 官方 RKNN 案例","https://github.com/airockchip/rknn_model_zoo/tree/main/examples/yolov5"],["RKNN SDK 入口","https://github.com/airockchip/rknn-toolkit2"]],"walkthrough":{"intro":"第 08 讲使用仓库 lesson_08.py 调起实际存在的官方 Model Zoo Demo，保存命令、退出码与 stdout/stderr；必须阅读检测或分类结果，而不是只关注退出码。","flow":["官方匹配 DEMO 可执行文件","板端 .rknn 模型","测试图片","subprocess.run","日志与结果"],"steps":[{"api":"外部 Demo 输入约定","input":"--program 实际 ELF/脚本、--model .rknn、--image JPG","output":"要运行的完整命令","why":"脚本不会自动下载、编译或替换官方 Demo；三种文件需与 SDK/驱动版本和模型协议一致。","code":"python3 examples/lesson_08.py --program /path/to/rknn_mobilenet_demo \\\n  --model /path/to/model.rknn --image /path/to/test.jpg"},{"api":"subprocess.run：直接执行真实目标程序","input":"三个路径组成的命令列表","output":"returncode、stdout、stderr 和墙钟耗时","why":"这里是操作系统进程调用而不是纯 Python 模拟推理；时间包含进程启动和加载，不等于 NPU 算子耗时。","code":"result = subprocess.run(cmd, capture_output=True, text=True, timeout=120)\nprint(result.returncode, result.stdout, result.stderr)"},{"api":"如何判断第一次 NPU Demo 真正成功","input":"进程日志和终端分类/检测输出","output":"实测类别/框、运行库版本、输入图路径","why":"退出码为零只表示程序自报成功，还要看到能解释的模型输出与运行环境。输出类别索引不匹配时先看图像预处理和标签。","code":"# 记录真实 stdout 中模型推理的类别/框\n# 没有实际设备与模型时保持“待上板”"}],"example":"运行 JSON 中 seconds 是整个外部 Demo 进程的墙钟时间，不能直接换算 NPU FPS；要测 NPU 推理应使用模型或 SDK 自身的分段计时。","acceptance":"在 ROCK 5B 获取匹配模型 Demo 的真实输出，并保存设备、Runtime 与驱动版本。PC 上执行 --help 不属于本实验成功。"},"guidance":{"phases":[{"title":"确认准备条件与输入协议","action":"先按官方示例编译并确认板端可执行 Demo，准备与该模型对应的 `.rknn` 和真实测试图片。","command":"","observe":"首个关键步骤处理 --program 实际 ELF/脚本、--model .rknn、--image JPG，输出应为 要运行的完整命令。","diagnose":"非零退出码时先看保存的 stderr 和模型/Runtime 版本，再检查模型输入是否接受所给图片。","teach":"先检查前置条件，不能凭假设跳过环境核对。"},{"title":"教师演示最小可运行命令","action":"从仓库根目录运行。/path/to 路径和外部 SDK 必须是真实文件及兼容环境。","command":"python3 examples/lesson_08.py --program /path/to/rknn_mobilenet_demo --model /path/to/model.rknn --image /path/to/test.jpg --output build/lesson08/result.json","observe":"实际执行程序并记录完整 argv、exit_code、stdout、stderr 与 seconds；有缺失文件会直接拒绝。","diagnose":"非零退出码时先看保存的 stderr 和模型/Runtime 版本，再检查模型输入是否接受所给图片。","teach":"逐项说明参数、输出文件位置和软件层次。"},{"title":"学生解释结果并独立验收","action":"用厂家提供的已知模型和测试图片建立第一份实测证据。单次整体 seconds 包含进程启动和模型载入；要取得 NPU 模型耗时应看 SDK profiler 或程序内部计时。","command":"python3 -c \"import json; j=json.load(open('build/lesson08/result.json')); print(j['exit_code'],j['seconds'],j['stdout'][:120])\"","observe":"同一张猫的图像，Demo 输出 class_id=281，但标签文件按 1001 类索引而非 1000 类索引时，显示文本可能错位。排查顺序：先确认 demo、模型与标签属于同一发布版本，再核对 RGB/BGR 和尺寸；不能一开始就改 NPU 驱动。","diagnose":"在 ROCK 5B 获取匹配模型 Demo 的真实输出，并保存设备、Runtime 与驱动版本。PC 上执行 --help 不属于本实验成功。","teach":"结合实际输出解释因果，记录未通过项；PC 数据不能冒充 ROCK 5B 实测。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
