<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RKNPU2—零拷贝C API｜RK3588 HTML 教学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":26,"title":"RKNPU2—零拷贝C API","intro":"通过绑定专用推理缓冲区优化 CPU-NPU 数据搬运。","goals":["理解通用 API 与零拷贝数据路径的不同","认识 I/O 内存创建和绑定接口","正确比较全流程延迟、CPU 负载与内存"],"core":"通用 API 常有输入输出缓冲拷贝；零拷贝 API 可让应用分配并绑定供 NPU 使用的张量内存，典型接口包括 `rknn_create_mem`、`rknn_set_io_mem` 和 `rknn_destroy_mem`。但性能仍受缓存一致性、图像格式、stride 对齐、内存来源与数据准备方式影响。零拷贝并不保证整个业务流程都无复制。","steps":["先以通用 API 构建可验证的性能与数值基线","读取输入输出 tensor 属性并确认 size、stride、layout","遵循官方示例申请推理内存并绑定至模型 I/O","写入图像数据，按需要处理 CPU/NPU cache 一致性","运行推理、读取输出，正确解除绑定并释放内存","使用相同输入对比结果、端到端耗时、内存及 CPU 占用"],"checks":["零拷贝结果与通用 API 具有一致的业务输出","有明确的内存分配、所有权与释放记录"],"pitfalls":["缓冲长度或步长错误可能造成结果异常","cache 不同步可能导致读取到旧数据","只比较 NPU 内部耗时无法判断端到端优化是否成功"],"homework":["绘制两种 API 的数据通路图并标注可能的复制点"],"code":""}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
