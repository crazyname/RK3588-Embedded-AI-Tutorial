<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RKNPU2—零拷贝C API｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":26,"title":"RKNPU2—零拷贝C API","intro":"通过绑定专用推理缓冲区优化 CPU-NPU 数据搬运。","goals":["理解通用 API 与零拷贝数据路径的不同","认识 I/O 内存创建和绑定接口","正确比较全流程延迟、CPU 负载与内存"],"core":"通用 API 常有输入输出缓冲拷贝；零拷贝 API 可让应用分配并绑定供 NPU 使用的张量内存，典型接口包括 `rknn_create_mem`、`rknn_set_io_mem` 和 `rknn_destroy_mem`。但性能仍受缓存一致性、图像格式、stride 对齐、内存来源与数据准备方式影响。零拷贝并不保证整个业务流程都无复制。","steps":["先以通用 API 构建可验证的性能与数值基线","读取输入输出 tensor 属性并确认 size、stride、layout","遵循官方示例申请推理内存并绑定至模型 I/O","写入图像数据，按需要处理 CPU/NPU cache 一致性","运行推理、读取输出，正确解除绑定并释放内存","使用相同输入对比结果、端到端耗时、内存及 CPU 占用"],"pitfalls":["缓冲长度或步长错误可能造成结果异常","cache 不同步可能导致读取到旧数据","只比较 NPU 内部耗时无法判断端到端优化是否成功"],"checks":["零拷贝结果与通用 API 具有一致的业务输出","有明确的内存分配、所有权与释放记录"],"homework":["绘制两种 API 的数据通路图并标注可能的复制点"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"零拷贝究竟减少什么","explain":"常规推理可能经历 CPU 图片缓冲→预处理结果→NPU 输入缓冲的多次复制。所谓零拷贝通常指通过共享或可绑定的内存对象，减少某些阶段的冗余 CPU copy；不是所有处理步骤完全没有数据迁移，也不代表无需处理颜色、stride、对齐和缓存一致性。具体接口需参照本版本 `rknn_create_mem`、`rknn_set_io_mem` 等官方定义。","takeaway":"优化目标是端到端拷贝与延迟，不能只因 API 名称就声称实现零开销。"},{"title":"共享 buffer 的格式契约","explain":"输入 tensor 对 stride、dtype、layout、大小和物理/虚拟内存可见性可能有约束。图像宽度为 641 不代表每行只占 641×channels 字节，硬件对齐可能产生行 padding。若应用忽视 `w_stride`/size 或错误覆盖内存，可能出现错行、花屏甚至越界。","takeaway":"查询真实 tensor 属性及内存要求之后，再申请或绑定 buffer。"},{"title":"缓存同步和资源生命周期","explain":"CPU 写入共享数据后，NPU 需要看到最新内容；NPU 写输出后，CPU 读取前也可能需要适当同步。同步接口和所有权视 API、驱动与内存类型而定。内存池复用需避免一帧仍被 NPU 使用时另一线程覆盖；线程、DMA 和 NPU 的异步关系需要明确。","takeaway":"所有共享 buffer 必须有同步时序和唯一可判断的释放点。"}],"lab":[{"title":"测常规 API 基线","action":"使用同一图片，记录 `rknn_inputs_set` 等涉及的时间与端到端延迟。","verify":"存在稳定的无零拷贝对照组。"},{"title":"核对可用零拷贝接口","action":"阅读当前 RKNPU2 SDK 的 zero-copy 示例并查询模型的 stride、size 和格式限制；准备完整失败回退方案。","verify":"明确哪些内存对象由 SDK 创建、哪个阶段绑定、何时释放。"},{"title":"做结果一致性验证","action":"使用相同图片分别走常规和共享内存路径，对比 top-k 或检测框，并采集内存和延迟。","verify":"相同任务输出一致，优化收益来自实测而非猜测。"}],"diagnosis":[{"symptom":"结果出现条纹/错位","reason":"行 stride、padding、颜色格式或物理内存映射不匹配。","check":"逐行检查数据地址、像素格式及接口查询的 w_stride。"},{"symptom":"随机旧帧结果","reason":"CPU-NPU 缓存同步遗漏或 buffer 被提前复用。","check":"绘制拥有者和同步时序图，加入独立帧内容核对。"}],"case":{"problem":"常规 API 正确，改用零拷贝后偶尔出现上一帧的检测结果。可能是算法不稳定吗？","analysis":"首先排查 buffer 复用时序与缓存同步：应用可能在 NPU 读完前改写或 CPU 在必要同步前读到旧输出。依照当前 SDK 的内存与同步契约修正，验证连续多帧。","evidence":"缓冲分配与同步流程、stride 属性、常规/零拷贝结果和分段耗时。"},"snippet":"// 教学流程，不是可直接编译的代码\n// 1. rknn_query() 查询输入输出属性\n// 2. rknn_create_mem() 按 SDK 要求创建 buffer\n// 3. rknn_set_io_mem() 绑定输入输出\n// 4. 写入数据 + 必要的缓存同步 + rknn_run()\n// 5. 在数据已可见后读取结果并释放内存","refs":[["RKNPU2 官方零拷贝示例","https://github.com/rockchip-linux/rknpu2"],["Model Zoo 图像与内存工具","https://github.com/airockchip/rknn_model_zoo"],["《深入理解计算机系统》缓存与内存","https://www.pearson.com/en-us/subject-catalog/p/computer-systems-a-programmers-perspective/P200000003479"]],"walkthrough":{"intro":"本讲先讲普通输入与 SDK 内存绑定的区别，不把 DMA-BUF fd 导出或 RGA 加速误称为完整零拷贝。代码 rknn_zero_copy.cpp 是 SDK buffer 绑定教学。","flow":["CPU RAW 文件","rknn_create_mem","rknn_set_io_mem","rknn_run","读取绑定输出","rknn_destroy_mem"],"steps":[{"api":"普通路径：rknn_inputs_set()","input":"普通用户内存中的 uint8 图像/RAW","output":"Runtime 接管或复制到适合 NPU 的缓冲路径","why":"这种调用简单，能作为结果正确性的基线；并不意味着一次 API 必然对应一次固定物理 memcpy。","code":"rknn_inputs_set(ctx, 1, &input);\nrknn_run(ctx, nullptr);\nrknn_outputs_get(ctx, 1, &output, nullptr);"},{"api":"绑定路径：create_mem + set_io_mem","input":"native input attr / size_with_stride","output":"与 Runtime 绑定的 rknn_tensor_mem","why":"SDK 可能要求按行 stride 对齐。raw.size 必须等于该实验查询的 native size_with_stride，不能用普通 W×H×C 盲目填充。","code":"auto *input_mem = rknn_create_mem(ctx, native.size_with_stride);\nrknn_set_io_mem(ctx, input_mem, &input_attr);\n// 把符合布局的像素拷到 input_mem->virt_addr"},{"api":"DMA-BUF 是另一个层次","input":"V4L2 导出 DMA-BUF fd","output":"RGA 可以导入 fd 作为图像源","why":"本仓库视频链在 RGA 输出之后仍有 CPU letterbox 和 rknn_inputs_set；因此不能叫摄像头→NPU 全程零拷贝。","code":"V4L2 --EXPBUF--> DMA-BUF fd --import--> RGA\nRGA --CPU letterbox--> rknn_inputs_set --> NPU"}],"example":"请画出普通路径、SDK 绑定路径、V4L2→RGA 的三种数据流，并分别圈出还存在 CPU 读写的地方；性能提升必须用相同模型/图片的真实测量判断。","acceptance":"板端用同一个输入比较普通接口与 SDK 绑定的输出是否一致；没有实机测试时只可写“原理与源码已理解”。"},"guidance":{"phases":[{"title":"准备模型、输入与真实 SDK","action":"按第 25 讲构建 C++ 工程，并用 rknn_query 查看 native 输入 attr、size_with_stride、布局和输出 dtype。","command":"","observe":"关键输入为 普通用户内存中的 uint8 图像/RAW；该步骤应产生 Runtime 接管或复制到适合 NPU 的缓冲路径。","diagnose":"创建或绑定失败先检查 size_with_stride、内存所有权与 SDK 属性，不将 CPU 内存拷贝漏计为零耗时。","teach":"先当场展示模型/输入文件与张量契约，确定 PC 和板端边界。"},{"title":"执行课内核心示范","action":"在正确运行环境中执行命令并保存实际输出；需要 SDK/模型/图片时使用真实路径。","command":"cmake -S examples/hardware -B build/native-rknn -DRKNN_INCLUDE_DIR=/sdk/rknn/include -DRKNN_LIB=/sdk/arm64/librknnrt.so\ncmake --build build/native-rknn -j2\n./build/native-rknn/rknn_zero_copy /path/to/model.rknn /path/to/native-padded.raw 1","observe":"Python 入口显示预检方式；板端 C++ 程序在真实 SDK 上绑定输入输出、运行 1 次，输入 RAW 必须匹配 native stride。","diagnose":"创建或绑定失败先检查 size_with_stride、内存所有权与 SDK 属性，不将 CPU 内存拷贝漏计为零耗时。","teach":"对照返回码、输入 shape、Top-K 或检测框解释运行日志。"},{"title":"对照结果并判定验收","action":"本课程把“普通 SDK 输入”“SDK 张量内存绑定”“摄像头 DMA-BUF 共享”分别验收。不能把 SDK create_mem 视为全链路零拷贝，也不能假定所有 cache flush/同步都是自动的；应遵守所用 SDK release 的内存契约。","command":"ls -lh /path/to/native-padded.raw","observe":"一个宽为 224、每行 RGB888 紧密 672 字节的图像，在 NPU native attr 需要额外行对齐时，内存需按 `size_with_stride` 分配，RAW 字节也必须与该布局相符；单纯 W×H×3 可能不够。性能测试必须比较同模型、同输入、同精度结果，区分 CPU memcpy、rknn_run 和总调用时间。 注意这段只是 SDK 内存绑定，不是摄像头到 NPU 的 DMA-BUF 全程零拷贝。","diagnose":"板端用同一个输入比较普通接口与 SDK 绑定的输出是否一致；没有实机测试时只可写“原理与源码已理解”。","teach":"要求学生说明输入与输出为什么有意义，不用 CI mock 代替设备实测。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
