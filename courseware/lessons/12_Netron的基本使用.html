<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Netron的基本使用｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":12,"title":"Netron的基本使用","intro":"可视化检查模型结构、输入输出与维度变换。","goals":["使用 Netron 阅读 ONNX 网络图","定位输入、输出及关键算子","比较修改前后的模型结构"],"core":"[Netron](https://netron.app/) 可打开多种深度学习模型格式，展示节点、连接关系、权重和张量信息。它非常适合检查输入输出维度、Transpose、Reshape 等操作，帮助分析模型为什么在转换后出现形状问题或额外开销。不同模型格式的支持随软件版本变化。","steps":["打开 Netron 网页版或桌面版","导入一份自己保存的 ONNX 模型","记录所有输入输出的名称、dtype、shape","观察卷积、激活、池化、Reshape、Transpose 与多分支结构","比较两份模型是否新增/移除了关键节点"],"pitfalls":["私有模型上传在线服务前应检查保密要求","看起来正确的网络图仍可能包含不支持的算子"],"checks":["能找到网络输入输出和一个维度变换节点","能解释图可视化不是模型真实运行验证"],"homework":["制作一份模型输入输出信息表，供后续转换时使用"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"模型文件是有向计算图","explain":"ONNX 图由输入、算子节点、常量权重、输出构成。节点连接表达依赖，不等于运行时严格按屏幕中的从左到右逐节点执行；编译器可以融合与重排。Netron 是可视化和检查工具，主要用于确认输入输出 tensor 名称、shape、dtype、算子种类和异常布局转换。","takeaway":"可以据图解释‘这个模型期望什么输入、给出什么输出’。"},{"title":"模型输入输出推断","explain":"分类常见输出形状类似 [1,1000]；检测模型输出可能有多个尺度或不同的节点布局。单从‘共有几个输出’无法推断类别语义：需要结合训练框架、模型导出方式与对应后处理。Netron 显示的维度若是符号变量，表示静态信息不完整，不保证当前 NPU 版本接受所有尺寸。","takeaway":"读懂节点名称并不等于理解其实际部署后处理。"},{"title":"可视化与程序化检查结合","explain":"Netron 容易定位 `Transpose`、`Reshape`、`Concat` 和输出层，ONNX 官方 checker 与 shape_inference 能做结构校验。某些算子的 shape 推导不完整；对真实运行协议的验证还需 ONNX Runtime 进行固定输入的数值推理。","takeaway":"先可视化、再静态检查、最后运行比对，三者互补。"}],"lab":[{"title":"打开一个真实 ONNX","action":"选 Model Zoo 的 MobileNet 或 YOLO 模型，在 Netron 查看所有 input/output 的名称、数据类型、shape。","verify":"截图或记录中能分辨 batch、channel、height、width。"},{"title":"找出维度转换节点","action":"搜索 `Transpose`、`Reshape`、`Concat`，解释哪些是布局重排、哪些是结果拼接。","verify":"对至少一个 Transpose 写出其 perm 导致的维度变化。"},{"title":"用 ONNX API 校验","action":"用 onnx.load、onnx.checker.check_model 和 onnx.shape_inference.infer_shapes 检查图结构，保存输出信息。","verify":"校验无错误；若形状无法完全推断，在日志说明未知维度。"}],"diagnosis":[{"symptom":"显示某些维度为 ? 或符号","reason":"模型使用动态或尚未推断的维度。","check":"核查导出参数、opset 和 ONNX shape inference，避免猜成固定尺寸。"},{"symptom":"Netron 看着没问题但 RKNN build 失败","reason":"图语义可读不代表 NPU 支持其中全部算子。","check":"以官方支持算子表和转换日志找到实际不支持的节点。"}],"case":{"problem":"Netron 显示模型有三个输出，你便按 YOLOv5 的三层 anchor head 解码，却发现框全错。问题可能在哪里？","analysis":"‘三个输出’不是 YOLOv5 的唯一标志。核对模型版本、每个 tensor 的元素含义与官方 Model Zoo 示例，有些优化版模型将解码逻辑移到 CPU 或采用其他输出布局。","evidence":"截图、每个输出的 shape/dtype、解码设计来源。"},"snippet":"import onnx\nm = onnx.load('model.onnx')\nonnx.checker.check_model(m)\nfor v in m.graph.input:\n    print('input', v.name)\nfor v in m.graph.output:\n    print('output', v.name)","refs":[["Netron 官方仓库","https://github.com/lutzroeder/netron"],["ONNX 官方 Shape Inference","https://github.com/onnx/onnx/blob/main/docs/ShapeInference.md"],["ONNX Python 文档","https://onnx.ai/onnx/"]],"walkthrough":{"intro":"Netron 是图结构可视化工具，不能取代 ONNX checker、shape inference 和 RKNN Toolkit2 的编译验证。lesson_12.py 读取真实 ONNX protobuf，输出算子数量、输入/输出张量以及潜在 layout 相关节点，和 Netron 交叉核对。","flow":["真实 .onnx","onnx.checker","onnx.shape_inference","操作符/输入输出解析","graph.json + Netron 可视化"],"steps":[{"api":"onnx.load 与 checker：确认 ONNX 基础结构","input":"真实模型文件 .onnx","output":"可解析的 ModelProto 或明确错误","why":"checker 通过不证明算子满足 RKNN NPU 支持表。先锁定 opset、输入输出节点和是否具有动态维度。","code":"python3 examples/lesson_12.py --onnx /path/to/model.onnx --output build/lesson12/graph.json"},{"api":"shape_inference 与 shape()：提取张量契约","input":"每个图 input/output 的 elem_type 与维度","output":"输入/输出名称、ONNX dtype 编号、维度列表","why":"动态维度可能以符号字符串或 ? 出现，不能未经验证就替换成具体数值。是否 NCHW/NHWC 要结合模型训练约定，单纯看 shape 不一定足够。","code":"model = onnx.shape_inference.infer_shapes(model)\nfor value in model.graph.input:\n    print(value.name, value.type.tensor_type.shape)"},{"api":"算子统计与布局敏感节点","input":"graph.node 的 op_type、Transpose/Reshape/Concat 等","output":"operators 次数表及 layout_sensitive_nodes","why":"Netron 上看到节点很多不等于性能瓶颈就在该层；需要与 RKNN build 日志和运行时 profiler 一起判断。","code":"python3 -c \"import json; g=json.load(open('build/lesson12/graph.json')); print(g['inputs'], g['outputs'], g['operators'])\""}],"example":"TensorProto.FLOAT 在 ONNX 中的 dtype 编号是 1，而不是运行时 NumPy float32 对象；动态图的 '?' 也不是 0 维。打开 Netron 时应将名字、shape、dtype 和算子与 JSON 核对。","acceptance":"用同一真实 ONNX 模型生成 graph.json，能在 Netron 中指出图输入、至少一个算子和输出，且不把 checker 当成 NPU 支持认证。"},"guidance":{"phases":[{"title":"先把输入、模型与运行环境对齐","action":"准备实际 ONNX 模型并安装 onnx，先在 Netron 中观察至少一个输入、一个算子和一个输出。","command":"","observe":"输入契约为 真实模型文件 .onnx；此步目标输出 可解析的 ModelProto 或明确错误。","diagnose":"checker 失败优先定位模型格式或源图导出流程；不知道 axis 时结合输入协议核对，不猜测动态图维度。","teach":"把输入格式和主机/开发板角色写在黑板上。"},{"title":"运行可复现的最小代码","action":"在仓库根目录执行示范命令，先替换真实文件占位路径。","command":"python3 examples/lesson_12.py --onnx /path/to/model.onnx --output build/lesson12/graph.json","observe":"实际输出 inputs、outputs、opsets、operators、layout_sensitive_nodes 及 graph.json 文件。","diagnose":"checker 失败优先定位模型格式或源图导出流程；不知道 axis 时结合输入协议核对，不猜测动态图维度。","teach":"展示终端真实输出，对照字段解释代码数据流。"},{"title":"核对数值与验收边界","action":"转换前列出 opset、输入名/shape/dtype、输出头数量、Transpose/Reshape 等潜在难点，再参考 Toolkit2 build 错误定位实际不支持节点。性能判断必须另用 profiler；Netron 的节点数不等于算力需求。","command":"python3 -c \"import json; j=json.load(open('build/lesson12/graph.json')); print(j['inputs'],j['outputs'],j['opsets'])\"","observe":"一个 `Transpose([0,2,3,1])` 可能将 NCHW 转成 NHWC，但只凭算子名称不能判断训练前处理是否已正确。若 graph.input 为 `(1,3,224,224)` FLOAT，实际送入 HWC uint8 则类型和轴均不合约定。图里存在 Reshape/Concat 只提示需要检查形状，不自动代表 RKNN 不支持。","diagnose":"用同一真实 ONNX 模型生成 graph.json，能在 Netron 中指出图输入、至少一个算子和输出，且不把 checker 当成 NPU 支持认证。","teach":"要求解释结果能证明什么、尚不能证明什么。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
