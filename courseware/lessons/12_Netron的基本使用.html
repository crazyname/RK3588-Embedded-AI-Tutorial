<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Netron的基本使用｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":12,"title":"Netron的基本使用","intro":"可视化检查模型结构、输入输出与维度变换。","goals":["使用 Netron 阅读 ONNX 网络图","定位输入、输出及关键算子","比较修改前后的模型结构"],"core":"[Netron](https://netron.app/) 可打开多种深度学习模型格式，展示节点、连接关系、权重和张量信息。它非常适合检查输入输出维度、Transpose、Reshape 等操作，帮助分析模型为什么在转换后出现形状问题或额外开销。不同模型格式的支持随软件版本变化。","steps":["打开 Netron 网页版或桌面版","导入一份自己保存的 ONNX 模型","记录所有输入输出的名称、dtype、shape","观察卷积、激活、池化、Reshape、Transpose 与多分支结构","比较两份模型是否新增/移除了关键节点"],"pitfalls":["私有模型上传在线服务前应检查保密要求","看起来正确的网络图仍可能包含不支持的算子"],"checks":["能找到网络输入输出和一个维度变换节点","能解释图可视化不是模型真实运行验证"],"homework":["制作一份模型输入输出信息表，供后续转换时使用"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"模型文件是有向计算图","explain":"ONNX 图由输入、算子节点、常量权重、输出构成。节点连接表达依赖，不等于运行时严格按屏幕中的从左到右逐节点执行；编译器可以融合与重排。Netron 是可视化和检查工具，主要用于确认输入输出 tensor 名称、shape、dtype、算子种类和异常布局转换。","takeaway":"可以据图解释‘这个模型期望什么输入、给出什么输出’。"},{"title":"模型输入输出推断","explain":"分类常见输出形状类似 [1,1000]；检测模型输出可能有多个尺度或不同的节点布局。单从‘共有几个输出’无法推断类别语义：需要结合训练框架、模型导出方式与对应后处理。Netron 显示的维度若是符号变量，表示静态信息不完整，不保证当前 NPU 版本接受所有尺寸。","takeaway":"读懂节点名称并不等于理解其实际部署后处理。"},{"title":"可视化与程序化检查结合","explain":"Netron 容易定位 `Transpose`、`Reshape`、`Concat` 和输出层，ONNX 官方 checker 与 shape_inference 能做结构校验。某些算子的 shape 推导不完整；对真实运行协议的验证还需 ONNX Runtime 进行固定输入的数值推理。","takeaway":"先可视化、再静态检查、最后运行比对，三者互补。"}],"lab":[{"title":"打开一个真实 ONNX","action":"选 Model Zoo 的 MobileNet 或 YOLO 模型，在 Netron 查看所有 input/output 的名称、数据类型、shape。","verify":"截图或记录中能分辨 batch、channel、height、width。"},{"title":"找出维度转换节点","action":"搜索 `Transpose`、`Reshape`、`Concat`，解释哪些是布局重排、哪些是结果拼接。","verify":"对至少一个 Transpose 写出其 perm 导致的维度变化。"},{"title":"用 ONNX API 校验","action":"用 onnx.load、onnx.checker.check_model 和 onnx.shape_inference.infer_shapes 检查图结构，保存输出信息。","verify":"校验无错误；若形状无法完全推断，在日志说明未知维度。"}],"diagnosis":[{"symptom":"显示某些维度为 ? 或符号","reason":"模型使用动态或尚未推断的维度。","check":"核查导出参数、opset 和 ONNX shape inference，避免猜成固定尺寸。"},{"symptom":"Netron 看着没问题但 RKNN build 失败","reason":"图语义可读不代表 NPU 支持其中全部算子。","check":"以官方支持算子表和转换日志找到实际不支持的节点。"}],"case":{"problem":"Netron 显示模型有三个输出，你便按 YOLOv5 的三层 anchor head 解码，却发现框全错。问题可能在哪里？","analysis":"‘三个输出’不是 YOLOv5 的唯一标志。核对模型版本、每个 tensor 的元素含义与官方 Model Zoo 示例，有些优化版模型将解码逻辑移到 CPU 或采用其他输出布局。","evidence":"截图、每个输出的 shape/dtype、解码设计来源。"},"snippet":"import onnx\nm = onnx.load('model.onnx')\nonnx.checker.check_model(m)\nfor v in m.graph.input:\n    print('input', v.name)\nfor v in m.graph.output:\n    print('output', v.name)","refs":[["Netron 官方仓库","https://github.com/lutzroeder/netron"],["ONNX 官方 Shape Inference","https://github.com/onnx/onnx/blob/main/docs/ShapeInference.md"],["ONNX Python 文档","https://onnx.ai/onnx/"]]}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
