<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>查看和调整CPU · NPU · DDR频率｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":7,"title":"查看和调整CPU · NPU · DDR频率","intro":"认识动态调频和性能基准的实验条件。","goals":["查询 CPU、NPU 与 DDR 的运行频率","理解 DVFS 和 governor","建立公平的性能对比条件"],"core":"RK3588 CPU 大小核处于多个 cpufreq 策略域，NPU 与 DDR 也可能由 devfreq 管理。频率固定可能便于对比，但会提高功耗并受到温度、功耗和电源供应约束。课程介绍频率查看与定频；路径、可选频点以及生效权限依赖内核 BSP。","steps":["只读查询当前 governor、工作频率和支持频点","在默认策略下运行相同模型的多轮 benchmark","依据板卡文档选择测试策略，并同步记录温度、电压或功耗","分别记录 NPU 推理延迟与端到端吞吐","测量结束后恢复原有调频设置"],"pitfalls":["频率文件单位可能是 Hz 或 kHz，不能直接比较数字","强制定频可能导致过热和额外功耗","不要不经确认地写入不支持的 sysfs 频点"],"checks":["能说明定频对实验可重复性的作用","能区分短时峰值和长时间稳定帧率"],"homework":["制作默认/性能模式下温度、延迟和帧率对照表"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"频率变化和 DVFS","explain":"CPU、NPU 与 DDR 可能通过 DVFS（动态电压频率调整）策略在不同负载和温度下改变频率。设备树与内核 governor 决定支持哪些频点，路径因 BSP 而异。强制定频并不等于软件不会降频，因为热保护、电源能力和系统策略仍可能生效。","takeaway":"先读出当前 governor、可用频点和温度，变更之前保存原值。"},{"title":"为什么测试必须热稳定","explain":"持续负载会让芯片温度上升，可能触发降频。第一次运行还可能包含模型初始化和缓存预热，因此单次最快耗时通常不能反映长期表现。测试要固定分辨率、模型、输入顺序、板端后台任务及测量时长，分别记录 warm-up 与稳定阶段。","takeaway":"报告平均值、至少一个尾延迟指标和温度区间，比只报最大 FPS 更可信。"},{"title":"功耗与速度的取舍","explain":"提升 CPU/NPU/DDR 频率可能缩短部分阶段耗时，但也可能提升发热与能耗。若应用主要瓶颈是 NMS 或输入复制，仅提高 NPU 频率收益有限。应先对端到端管线逐段计时，再选影响最大的资源进行控制变量实验。","takeaway":"不要同时改三个频率；否则即使 FPS 上升，也无法解释是哪一项产生效果。"}],"lab":[{"title":"建立无侵入基线","action":"在不改频的条件下使用固定输入测试多次，记录 CPU/NPU/DDR 当前频率（若 BSP 暴露只读节点）及温度。","verify":"输出时间序列包含空载与负载各一个阶段，不是只有一个瞬间值。"},{"title":"寻找可用接口","action":"根据具体 BSP 查阅 `/sys/class/devfreq` 与 cpufreq 可读项。不同发行版可能不公开 NPU 节点，不要猜路径。","verify":"记录存在的目录与其 governor/频率，不存在则注明‘此 BSP 未暴露’。"},{"title":"做单变量分析","action":"只有在确定允许操作且做好回退时，修改一个受支持的 governor，再重复完全相同的工作负载。","verify":"形成条件、频率、温度、延迟与功耗（若可测）的对照表。"}],"diagnosis":[{"symptom":"强制定频后仍然降速","reason":"散热不足、系统功耗约束或频率设置被其他服务覆盖。","check":"同步记录温度和频率曲线，查看节流及 governor 状态。"},{"symptom":"频率节点不存在","reason":"教程示例对应的内核/BSP 与当前设备不同。","check":"以设备树、驱动和 `/sys` 实际只读结果为准，不按教程硬写不存在的节点。"}],"case":{"problem":"CPU 频率设高后，短跑 30 秒提速，连续运行 15 分钟却变慢。怎样解释？","analysis":"先查看温度及频率随时间变化，排除热节流；再确认输入、模型和背景负载一致。高频率可能导致更快升温，最终进入更低可持续频点。","evidence":"按分钟记录温度、频率、p50/p95 延迟和 FPS 的时间序列表。"},"snippet":"find /sys/class/devfreq -maxdepth 2 -name cur_freq -print 2>/dev/null\nfind /sys/devices/system/cpu -name scaling_cur_freq -print 2>/dev/null\n# 只读检查，频点名称与单位需要按 BSP 文档解释。","refs":[["RKNPU2 文档","https://github.com/rockchip-linux/rknpu2"],["RKNN Model Zoo 基线指标","https://github.com/airockchip/rknn_model_zoo"],["Linux CPUFreq 文档","https://docs.kernel.org/admin-guide/pm/cpufreq.html"]],"walkthrough":{"intro":"频率是性能解释的实验条件，不是“调高就一定更快”。lesson_07.py 只读取 CPU/NPU/DDR 可见 sysfs 频率和温度，输出带时间戳的 CSV；不写入 governors 或驱动节点。","flow":["Linux sysfs 可用节点","CPU/NPU/DDR 频率与温度","多次只读采样","frequency.csv","与真实推理耗时对照"],"steps":[{"api":"nodes()：发现 sysfs 而非猜测路径","input":"/sys/devices/system/cpu、/sys/class/devfreq、/sys/class/thermal","output":"可读取的 cur_freq、scaling_cur_freq、temp 节点列表","why":"不同板商 BSP 可能有不同设备路径，也可能因为权限不允许读取。路径名字不能保证全都对应 NPU；看到数值应先判断单位和设备。","code":"python3 examples/lesson_07.py --samples 3 --interval 0.5 --output build/lesson07/frequency.csv"},{"api":"CSV：建立时间序列而非单点截图","input":"每次 sysfs 读取的原始字符串与 Unix 时间","output":"unix_time、sysfs_path、raw_value","why":"CPU/DDR/NPU 频率通常以 kHz 或驱动定义单位表示；温度节点一般是毫摄氏度，展示前要先确认来源。","code":"python3 -c \"import csv; print(next(csv.DictReader(open('build/lesson07/frequency.csv'))))\""},{"api":"频率与 FPS 的因果边界","input":"同一真实模型/输入下的频率、热状态与推理时延","output":"可解释的采样条件，而非一定提升的性能承诺","why":"即使 NPU 频率升高，CPU 前处理、DDR 带宽与采集瓶颈仍可能主导端到端 FPS；热节流也会改变长时间运行结果。","code":"# 对照同一段实验的 CSV 和真实推理延迟日志\n# 不修改 sysfs 或调用驱动升级命令"}],"example":"sysfs raw_value 为 800000 时，只有节点明确以 kHz 报告 CPU 频率才可换成 800 MHz；不要把所有 /sys/class/devfreq 数值都标成 CPU MHz。","acceptance":"提供真实 CSV，标出每个节点名称和单位；有开发板时可与同条件推理延迟对照，但本讲不要求修改频率或刷写系统。"},"guidance":{"phases":[{"title":"确认准备条件与输入协议","action":"在 Linux 系统确认 /sys 下存在可读的 CPU/devfreq/thermal 节点；不要将毫摄氏度误报成摄氏度。","command":"","observe":"首个关键步骤处理 /sys/devices/system/cpu、/sys/class/devfreq、/sys/class/thermal，输出应为 可读取的 cur_freq、scaling_cur_freq、temp 节点列表。","diagnose":"无任何采样行时检查 sysfs 节点权限、内核导出接口及实际设备；不可据此断言芯片不支持 NPU。","teach":"先检查前置条件，不能凭假设跳过环境核对。"},{"title":"教师演示最小可运行命令","action":"从仓库根目录运行。/path/to 路径和外部 SDK 必须是真实文件及兼容环境。","command":"python3 examples/lesson_07.py --samples 5 --interval 0.5 --output build/lesson07/frequency.csv","observe":"CSV 每行包含 unix_time、sysfs_path、raw_value；没有节点时输出明确提示而不是造数据。","diagnose":"无任何采样行时检查 sysfs 节点权限、内核导出接口及实际设备；不可据此断言芯片不支持 NPU。","teach":"逐项说明参数、输出文件位置和软件层次。"},{"title":"学生解释结果并独立验收","action":"只读监测是第一阶段。对比时固定图像、模型、线程数、NPU 核配置与运行区间，至少保存延迟分布和相应的频率/温度原始记录；不直接修改未知 sysfs 节点。","command":"python3 -c \"import csv; r=list(csv.DictReader(open('build/lesson07/frequency.csv'))); print(len(r),r[0]['sysfs_path'] if r else 'no visible nodes')\"","observe":"同一模型的 NPU 耗时为 4ms、CPU 前后处理共 16ms，串行总时延约 20ms，即 50FPS；即使 NPU 降为 2ms，总时延仍约 18ms、约 55.6FPS。若温度升高触发降频，短时首帧数据也不代表稳定运行性能。","diagnose":"提供真实 CSV，标出每个节点名称和单位；有开发板时可与同条件推理延迟对照，但本讲不要求修改频率或刷写系统。","teach":"结合实际输出解释因果，记录未通过项；PC 数据不能冒充 ROCK 5B 实测。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
