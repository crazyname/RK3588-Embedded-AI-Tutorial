<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>查看和调整CPU · NPU · DDR频率｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":7,"title":"查看和调整CPU · NPU · DDR频率","intro":"认识动态调频和性能基准的实验条件。","goals":["查询 CPU、NPU 与 DDR 的运行频率","理解 DVFS 和 governor","建立公平的性能对比条件"],"core":"RK3588 CPU 大小核处于多个 cpufreq 策略域，NPU 与 DDR 也可能由 devfreq 管理。频率固定可能便于对比，但会提高功耗并受到温度、功耗和电源供应约束。课程介绍频率查看与定频；路径、可选频点以及生效权限依赖内核 BSP。","steps":["只读查询当前 governor、工作频率和支持频点","在默认策略下运行相同模型的多轮 benchmark","依据板卡文档选择测试策略，并同步记录温度、电压或功耗","分别记录 NPU 推理延迟与端到端吞吐","测量结束后恢复原有调频设置"],"pitfalls":["频率文件单位可能是 Hz 或 kHz，不能直接比较数字","强制定频可能导致过热和额外功耗","不要不经确认地写入不支持的 sysfs 频点"],"checks":["能说明定频对实验可重复性的作用","能区分短时峰值和长时间稳定帧率"],"homework":["制作默认/性能模式下温度、延迟和帧率对照表"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"频率变化和 DVFS","explain":"CPU、NPU 与 DDR 可能通过 DVFS（动态电压频率调整）策略在不同负载和温度下改变频率。设备树与内核 governor 决定支持哪些频点，路径因 BSP 而异。强制定频并不等于软件不会降频，因为热保护、电源能力和系统策略仍可能生效。","takeaway":"先读出当前 governor、可用频点和温度，变更之前保存原值。"},{"title":"为什么测试必须热稳定","explain":"持续负载会让芯片温度上升，可能触发降频。第一次运行还可能包含模型初始化和缓存预热，因此单次最快耗时通常不能反映长期表现。测试要固定分辨率、模型、输入顺序、板端后台任务及测量时长，分别记录 warm-up 与稳定阶段。","takeaway":"报告平均值、至少一个尾延迟指标和温度区间，比只报最大 FPS 更可信。"},{"title":"功耗与速度的取舍","explain":"提升 CPU/NPU/DDR 频率可能缩短部分阶段耗时，但也可能提升发热与能耗。若应用主要瓶颈是 NMS 或输入复制，仅提高 NPU 频率收益有限。应先对端到端管线逐段计时，再选影响最大的资源进行控制变量实验。","takeaway":"不要同时改三个频率；否则即使 FPS 上升，也无法解释是哪一项产生效果。"}],"lab":[{"title":"建立无侵入基线","action":"在不改频的条件下使用固定输入测试多次，记录 CPU/NPU/DDR 当前频率（若 BSP 暴露只读节点）及温度。","verify":"输出时间序列包含空载与负载各一个阶段，不是只有一个瞬间值。"},{"title":"寻找可用接口","action":"根据具体 BSP 查阅 `/sys/class/devfreq` 与 cpufreq 可读项。不同发行版可能不公开 NPU 节点，不要猜路径。","verify":"记录存在的目录与其 governor/频率，不存在则注明‘此 BSP 未暴露’。"},{"title":"做单变量分析","action":"只有在确定允许操作且做好回退时，修改一个受支持的 governor，再重复完全相同的工作负载。","verify":"形成条件、频率、温度、延迟与功耗（若可测）的对照表。"}],"diagnosis":[{"symptom":"强制定频后仍然降速","reason":"散热不足、系统功耗约束或频率设置被其他服务覆盖。","check":"同步记录温度和频率曲线，查看节流及 governor 状态。"},{"symptom":"频率节点不存在","reason":"教程示例对应的内核/BSP 与当前设备不同。","check":"以设备树、驱动和 `/sys` 实际只读结果为准，不按教程硬写不存在的节点。"}],"case":{"problem":"CPU 频率设高后，短跑 30 秒提速，连续运行 15 分钟却变慢。怎样解释？","analysis":"先查看温度及频率随时间变化，排除热节流；再确认输入、模型和背景负载一致。高频率可能导致更快升温，最终进入更低可持续频点。","evidence":"按分钟记录温度、频率、p50/p95 延迟和 FPS 的时间序列表。"},"snippet":"find /sys/class/devfreq -maxdepth 2 -name cur_freq -print 2>/dev/null\nfind /sys/devices/system/cpu -name scaling_cur_freq -print 2>/dev/null\n# 只读检查，频点名称与单位需要按 BSP 文档解释。","refs":[["RKNPU2 文档","https://github.com/rockchip-linux/rknpu2"],["RKNN Model Zoo 基线指标","https://github.com/airockchip/rknn_model_zoo"],["Linux CPUFreq 文档","https://docs.kernel.org/admin-guide/pm/cpufreq.html"]]}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
