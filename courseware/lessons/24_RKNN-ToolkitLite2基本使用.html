<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RKNN-ToolkitLite2基本使用｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":24,"title":"RKNN-ToolkitLite2基本使用","intro":"使用 Python 在 RK3588 板端执行 RKNN 模型。","goals":["区分 Toolkit2 与 Toolkit-Lite2 运行环境","安装板端 Python 推理接口","完成模型加载和推理结果解析"],"core":"RKNN-Toolkit-Lite2 为开发板提供 Python 推理接口，适合快速验证与原型开发，通常不用于主机端的 ONNX → RKNN 转换。模型应先通过 PC 端 Toolkit2 导出。板端 RK3588 往往采用 aarch64 架构，安装包必须与 Python ABI、系统和驱动版本匹配。","steps":["确认开发板 Python、CPU 架构、驱动和 librknnrt 版本","从对应 SDK 安装板端适配的 RKNN-Toolkit-Lite2","准备已转换的 RKNN 模型和固定测试图片","按官方 API 加载模型、初始化运行时并执行推理","完成分类或检测输出解析，并释放资源"],"pitfalls":["PC 的 Toolkit2 wheel 通常不能直接安装到 ARM 板端","应用仍需处理模型专用的预处理和后处理","API 和运行时兼容关系随 SDK 版本变化"],"checks":["能在目标板正常导入 Lite2","在板端得到与源模型预期一致的输出"],"homework":["记录一个可复现的板端 Python 推理环境与测试用例"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"Lite2 在哪里使用","explain":"RKNN-Toolkit-Lite2 是运行在支持的 Rockchip 板端系统上的 Python 推理接口，常用于模型加载、快速验证和板端原型。主机 Toolkit2 负责源模型到 `.rknn` 的构建；Lite2 一般不负责将 ONNX 转成 RKNN。运行前应确认开发板 Python 版本、aarch64 wheel 和 runtime/驱动配套关系。","takeaway":"不能把主机工具链和板端 Python 运行库混成一个 pip 包。"},{"title":"推理结果需要解释","explain":"通过 Lite2 加载 RKNN、初始化运行时并传入 NumPy 输入。输出通常为 ndarray 列表，具体排列、shape 和 dtype 按模型与版本决定。分类常需 top-k 和标签映射；检测常需框解码、置信度过滤及 NMS。","takeaway":"打印每个输出的 shape、dtype 以及一小段数值，别只看 ‘inference success’。"},{"title":"从 Python 过渡到 C++","explain":"Python 更适合算法与预处理验证、调试和教学。稳定后可把前后处理接口封装并迁移到 RKNPU2 C API，但迁移时要保持图像颜色、插值、layout、量化属性与标签映射一致。性能比较也应在相同输入和设备条件下进行。","takeaway":"把 Python 结果保存为 C++ 版本回归测试的黄金样本。"}],"lab":[{"title":"核对 Lite2 环境","action":"在板端确认 Python 与 wheel 的架构匹配，完成 `from rknnlite.api import RKNNLite` 的导入检查。","verify":"无 ABI 错误；日志记录了版本。"},{"title":"跑最小推理","action":"加载兼容的模型、调用 init_runtime，再用 shape/dtype 正确的 NumPy 数组执行 inference。","verify":"输出张量属性与样例模型定义一致。"},{"title":"建立可移植基线","action":"保存输入图片、预处理后的数组统计、输出数组摘要以及标签映射。","verify":"C++ 实现可以逐项对照这些结果。"}],"diagnosis":[{"symptom":"Lite2 无法安装","reason":"下载的 wheel 与 Python ABI 或 CPU 架构不匹配。","check":"核对板端 Python 版本和 aarch64 标签。"},{"symptom":"输出数组存在但类别错误","reason":"缺失后处理、标签顺序或预处理不一致。","check":"与同版本官方模型实例的输出和输入协议比较。"}],"case":{"problem":"Lite2 推理返回三个 ndarray，你准备直接将最大值作为目标检测坐标。可能出错在哪里？","analysis":"输出是 tensor，不直接等于完成后的检测框。需要理解模型检测头语义、反量化、decode、阈值与坐标还原。先用对应的 Model Zoo 后处理对照验证。","evidence":"tensor shape/dtype/scale、完整后处理流程和图像检测结果。"},"snippet":"from rknnlite.api import RKNNLite\nlite=RKNNLite()\ntry:\n    ret=lite.load_rknn('model.rknn')\n    if ret: raise RuntimeError(ret)\n    ret=lite.init_runtime()\n    if ret: raise RuntimeError(ret)\n    # 此处构造与模型输入 shape/dtype 匹配的 numpy 数据\nfinally:\n    lite.release()","refs":[["RKNN-Toolkit-Lite2 官方仓库","https://github.com/airockchip/rknn-toolkit2/tree/master/rknn_toolkit_lite2"],["模型与 Python 案例","https://github.com/airockchip/rknn_model_zoo"]]}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
