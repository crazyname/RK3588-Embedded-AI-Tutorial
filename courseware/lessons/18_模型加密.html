<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型加密｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":18,"title":"模型加密","intro":"学习 RKNN 模型加密与平台适配。","goals":["理解加密模型的用途和限制","核对加密 API 的芯片/SDK 支持条件","完成加密前后推理验证"],"core":"模型加密可提高部署模型结构和权重的保密性，但无法替代完整的访问控制、密钥保管和系统加固。课程提到加密等级与不同芯片支持差异，并强调加密后的模型必须与目标平台、SDK 和运行时能力匹配。加密 API 的名称、等级及参数应查当前 SDK 手册。","steps":["备份原始 `.rknn` 文件并记录 hash","确认 RK3588 及所用运行时支持模型加密","按 SDK 对应示例生成加密模型文件","在同一板卡分别加载原始和加密模型，检查推理成功与输出","测试不支持平台或错误版本时的异常处理"],"pitfalls":["不能将加密等级理解为不可破解的安全承诺","不支持的板卡或运行库可能无法运行加密后的模型"],"checks":["加密模型在目标板能正常推理","有明确的模型版本和安全存储方案"],"homework":["拟定产品模型发布流程，列出校验、权限和版本记录步骤"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"建立威胁模型","explain":"模型加密主要保护模型内容不被轻易直接读取，但不意味着密钥不可获取，也不自动提供设备绑定、签名、安全启动或远程授权。保护级别取决于攻击者是否能拷贝文件、读取内存、取得 root 访问或控制固件。","takeaway":"需要把‘模型保密’与‘设备访问控制’分成两个问题。"},{"title":"加密模型的版本约束","explain":"RKNN 加密相关接口及模型格式受工具链和运行库支持条件约束。采用官方当前 release 可用功能，并确认 runtime 能加载对应模型；生产环境的密钥不应硬编码在开源仓库、日志或纯文本配置中。","takeaway":"先验证当前 SDK 是否支持，然后在测试模型上演练。"},{"title":"安全变更也要回归功能","explain":"加密后的模型要重新验证正确输入输出、返回码、错误密钥行为、内存及初始化时间。安全机制若破坏恢复或升级流程，也会带来可用性风险。","takeaway":"同一测试图的明文/加密模型输出应满足既定一致性标准。"}],"lab":[{"title":"威胁分析","action":"列出文件访问者、板端 root、固件和网络攻击面，并写保护目标。","verify":"每个目标有对应的防护机制和非目标。"},{"title":"阅读版本支持","action":"在官方 Toolkit2 用户指南中核查该 release 的加密接口、运行时要求。","verify":"记录受支持的 SoC 与 SDK 组合，不猜参数。"},{"title":"设计安全回归","action":"测试合法密钥加载、错误密钥失败及一致性校验。","verify":"有清晰的安全与正确性双重验收清单。"}],"diagnosis":[{"symptom":"加密后模型加载失败","reason":"runtime 不兼容、模型密钥或数据损坏。","check":"记录返回码、SDK 和模型生成历史。"},{"symptom":"加密仍能被复制","reason":"未提供设备绑定或密钥管理。","check":"复查威胁模型与密钥分发方式。"}],"case":{"problem":"将解密密钥硬编码到公开 C++ 程序中，是否就保护了模型？","analysis":"不能将其作为充分保证。具备程序读取能力的攻击者可能找到硬编码密钥。需要合适的密钥管理和多层安全机制，并接受独立安全审查。","evidence":"威胁模型、密钥管理设计、兼容性验证和回退方案。"},"snippet":"# 先在文档中记录支持情况；不要把生产密钥上传 GitHub。\n# 测试项：正确密钥成功、错误密钥安全失败、结果一致性。","refs":[["RKNN 官方文档","https://github.com/airockchip/rknn-toolkit2/tree/master/doc"],["OWASP 密钥管理","https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html"]]}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
