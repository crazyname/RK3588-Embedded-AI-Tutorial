<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>yolov8模型部署(优化加速版)｜RK3588 HTML 教学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":33,"title":"yolov8模型部署(优化加速版)","intro":"以 YOLOv8 为例建立优化前后的性能、精度对照。","goals":["独立测量未优化版本的耗时","比较 INT8、线程池、算子改动和前处理方案","保证加速后检测精度与稳定性"],"core":"本节比较原版与加速版 YOLOv8：转换 ONNX/RKNN、测量板端基线，再尝试量化、线程池/流水线、输出处理和输入 letterbox 优化。需要分清纯 NPU 推理速度与图像采集、预处理、NMS、绘制及显示构成的总帧率。视频中的数十帧至上百帧实验结果依赖模型尺寸、输入视频、频率及代码，不应作为所有设备的性能保证。课程提及 RGA，但未将该部分视作已验证成功的优化成果。","steps":["准备一个已验证精度的 YOLOv8 基线模型","用固定测试视频测量 mAP、NPU 延迟、端到端 FPS、CPU/DDR 占用与温度","只改变一个变量，优先测试 INT8 量化带来的速度与精度变化","尝试线程池/流水线并发，避免反复创建上下文","检查 letterbox 是否保留宽高比、检测框坐标是否正确还原","研究激活或模型图变更时执行数值回归与任务级评估","进行多轮长时间测试，记录各单项优化和叠加优化效果"],"checks":["每项优化有同条件实验数据证明","同时记录 FPS、精度与资源占用"],"pitfalls":["量化提升吞吐可能伴随 mAP 损失","多线程可能受限于内存带宽、CPU 竞争和调度开销","不要把尚未完整验证的 RGA 优化写成已完成"],"homework":["制作消融实验表：基线、量化、线程池、letterbox、综合优化"],"code":""}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
