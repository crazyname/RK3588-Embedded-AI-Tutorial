<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>yolov8模型部署(优化加速版)｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":33,"title":"yolov8模型部署(优化加速版)","intro":"以 YOLOv8 为例建立优化前后的性能、精度对照。","goals":["独立测量未优化版本的耗时","比较 INT8、线程池、算子改动和前处理方案","保证加速后检测精度与稳定性"],"core":"本节比较原版与加速版 YOLOv8：转换 ONNX/RKNN、测量板端基线，再尝试量化、线程池/流水线、输出处理和输入 letterbox 优化。需要分清纯 NPU 推理速度与图像采集、预处理、NMS、绘制及显示构成的总帧率。视频中的数十帧至上百帧实验结果依赖模型尺寸、输入视频、频率及代码，不应作为所有设备的性能保证。课程提及 RGA，但未将该部分视作已验证成功的优化成果。","steps":["准备一个已验证精度的 YOLOv8 基线模型","用固定测试视频测量 mAP、NPU 延迟、端到端 FPS、CPU/DDR 占用与温度","只改变一个变量，优先测试 INT8 量化带来的速度与精度变化","尝试线程池/流水线并发，避免反复创建上下文","检查 letterbox 是否保留宽高比、检测框坐标是否正确还原","研究激活或模型图变更时执行数值回归与任务级评估","进行多轮长时间测试，记录各单项优化和叠加优化效果"],"pitfalls":["量化提升吞吐可能伴随 mAP 损失","多线程可能受限于内存带宽、CPU 竞争和调度开销","不要把尚未完整验证的 RGA 优化写成已完成"],"checks":["每项优化有同条件实验数据证明","同时记录 FPS、精度与资源占用"],"homework":["制作消融实验表：基线、量化、线程池、letterbox、综合优化"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"YOLOv8 的实际输出依赖部署版本","explain":"官方 RKNN Model Zoo 的 YOLOv8 转换示例采用针对 RKNN 适配过的输出结构，与上游原始 YOLOv8 模型输出可能不同。部分检测头输出将边框坐标和类别概率分开，解码可能包括分布式边框回归（DFL）等步骤。应使用相同 Model Zoo commit 的模型和后处理，避免换一个 ONNX 后沿用旧代码。","takeaway":"任何优化前先在 Netron 确认输出 shape、名称、量化属性和解码实现。"},{"title":"定位 端到端 FPS 的瓶颈","explain":"检测系统常包含相机、图像变换、NPU 推理、decode/NMS、绘图与显示。可优化的方向包括减少不必要拷贝、图像预处理硬件化、合理量化、更小的输入尺寸、合适的 NPU 核配置和高效后处理。每个因素有精度、算子支持和功耗代价，需要有控制变量实验。","takeaway":"给每项优化记录相同分辨率、相同数据集的 mAP、p95 延迟和 FPS。"},{"title":"不要把实验速度当成业务速度","explain":"Model Zoo 的 benchmark 可能只统计特定条件下的推理时间，不能直接代表你项目摄像头运行的端到端 FPS。短时间展示的高帧率还可能受热频率变化、输入缓存及计时范围影响。最终优化应以足够长的实际应用负载与独立验证集为依据。","takeaway":"对所有声称的‘加速倍率’给出基线、测量方法、持续时间和精度变化。"}],"lab":[{"title":"复现官方 YOLOv8 baseline","action":"按 Model Zoo 的 YOLOv8 README 在 RK3588 上完成配套转换/推理，保存输出图片与 tensor 信息。","verify":"得到对应版本的正确检测结果与完整日志。"},{"title":"列出性能构成","action":"为 resize、NPU、解码、NMS、绘图分别计时，记录 p50/p95 与温度。","verify":"能指出占用最高的阶段并提出假设。"},{"title":"进行一次消融","action":"只改一个因素，例如后处理实现或图片 resize 方案，其他条件固定，重新测精度和吞吐。","verify":"至少形成一行前后对照并解释收益和代价。"}],"diagnosis":[{"symptom":"切换模型后检测框全部错误","reason":"采用了另一模型版本的输出布局或 DFL/后处理方法。","check":"打印输出 tensor 属性并与该版本 Model Zoo 对比。"},{"symptom":"FPS 提升但小目标漏检","reason":"输入变小或量化导致分辨率/精度损失。","check":"分组计算小目标召回率，检查 NMS 和置信度阈值。"}],"case":{"problem":"有人宣称 YOLOv8 在 RK3588 上优化到 150 FPS，但你的摄像头只显示 30 FPS。这个数据必然造假吗？","analysis":"不能直接下结论。需要确认对方是否只计纯 NPU benchmark、使用更小的模型/分辨率或读内存中的固定图片，而摄像头端到端还受传感器帧率限制。只有同测量边界才可比较。","evidence":"设备/模型/输入配置、分段时间、数据源和至少一次长时间运行日志。"},"snippet":"# Linux demo 构建参数示意；确切语法以对应 Model Zoo README 为准\n# git clone https://github.com/airockchip/rknn_model_zoo.git\n# cd rknn_model_zoo\n# ./build-linux.sh -t rk3588 -a aarch64 -d yolov8\n# 使用与该示例配套的 ONNX、转换器和后处理。","refs":[["RKNN Model Zoo YOLOv8","https://github.com/airockchip/rknn_model_zoo/tree/main/examples/yolov8"],["YOLOv8 说明与项目","https://docs.ultralytics.com/models/yolov8/"],["RKNN C++ YOLOv8 代码","https://github.com/airockchip/rknn_model_zoo/tree/main/examples/yolov8/cpp"]],"walkthrough":{"intro":"第 31 讲采用 Rockchip Model Zoo 优化版 YOLOv8 的六或九个输出头，在 RKNNLite 摄像头程序中通过 letterbox、DFL、NMS 还原真实物体的坐标。","flow":["V4L2 BGR 帧","RGB+letterbox 640","RKNNLite 六/九输出","DFL 64→4 距离","NMS","原图 xyxy"],"steps":[{"api":"letterbox()：保留比例和补边偏移","input":"例如原图 1280×720、目标边长 640","output":"ratio=0.5、横向 pad=0、纵向 pad=140","why":"算法要保存 ratio、pad 用于框的逆映射；普通拉伸和 letterbox 不是相同预处理。坐标例题：输入框左上 (160,190) 对应原图 (320,100)。","code":"rgb, meta = letterbox(frame, size=640)\nprint(rgb.shape, meta)"},{"api":"DFL：从 64-channel logits 解出四个距离","input":"每个尺度的 [1,64,H,W]，按 4 组×16 bins","output":"每格四个预期距离 [left,top,right,bottom]","why":"对每组 16 个 logits 做 softmax，求 Σ(k×p_k)，再乘该尺度 stride。输出还需结合网格中心变成 xyxy。这个协议只属于匹配的优化版模型。","code":"logits = logits.reshape(1, 4, 16, H, W)\nprob = softmax(logits, axis=2)\ndistance = (prob * np.arange(16).reshape(1, 1, 16, 1, 1)).sum(axis=2)"},{"api":"decode() 与 NMS：将分类分数映回原图","input":"类别分数、候选框、阈值、meta 中的缩放偏移","output":"每帧 0～N 个 class_id、score、xyxy","why":"先按阈值过滤、进行同类别 NMS，再做坐标逆变换与 clip。不能把输出 shape 错误的模型通过 reshape 强行适配，也不能将一个 FPS 数直接当 NPU 硬件耗时。","code":"outputs = sdk.inference(inputs=[rgb])\ndetections = decode(outputs, meta, size=640,\n                    num_classes=80, conf=0.25, iou=0.45)"}],"example":"在 1280×720→640×640 的例子中，输入空间框 (160,190,480,390) 去掉 (0,140) padding，再除以 0.5 后应得到原图框 (320,100,960,500)。这一计算不依赖模型推理，适合手算验证。","acceptance":"在 ROCK 5B 保存真实逐帧 JSONL 和一张同图对照；模型必须明确为优化版 YOLOv8 六/九输出，检查类别映射、框边界、DFL/NMS 与真实帧采集。"},"guidance":{"phases":[{"title":"先校对模型和真实输入","action":"检查摄像头可读取真实帧、模型输出确为优化版 6/9 头协议且标签数符合模型类别数。","command":"","observe":"关键输入为 例如原图 1280×720、目标边长 640；正确输出应为 ratio=0.5、横向 pad=0、纵向 pad=140。","diagnose":"检测框错位先核对 ratio/pad 和 DFL head 维度；未识别摄像头先查 V4L2 设备和访问权限，不改 NMS 算法。","teach":"展示实际模型来源、类别/输出头形状及主机与板端角色。"},{"title":"教师演示一条可运行路径","action":"在正确的 PC 或 ROCK 5B 环境执行；路径占位符须替换为已取得的真实资源。","command":"python3 boards/radxa-rock5b/apps/camera_yolov8_lite.py --model /path/to/optimized-yolov8n.rknn --source /dev/video0 --size 640 --frames 30 --warmup 0 --labels boards/radxa-rock5b/assets/coco80.txt --confirm-optimized-yolov8","observe":"在匹配 RKNNLite/ROCK 5B、真实 UVC 摄像头、优化版 Model Zoo 模型下输出逐帧类别、框及时间统计。","diagnose":"检测框错位先核对 ratio/pad 和 DFL head 维度；未识别摄像头先查 V4L2 设备和访问权限，不改 NMS 算法。","teach":"结合当前 SDK 对参数逐一解释，检查结果是否可复现。"},{"title":"学生验收：解释结果与技术边界","action":"两条路线必须分清：源码 `lesson_33.py` 对比的是 PC Ultralytics 两个真实权重的时延；ROCK 5B 真正的摄像头 YOLOv8 用 `camera_yolov8_lite.py` 与独立后处理文件。板端验收记录一帧图、模型输出头 shape、DFL/NMS 框和分段耗时。","command":"python3 examples/lesson_33.py --help","observe":"将原图 1280×720 letterbox 到 640×640，则 ratio=0.5，竖直补边 140。模型空间 xyxy=(160,190,480,390) 去掉 padding 后再除 ratio，得到原图 (320,100,960,500)。若先除 ratio 再减 pad，会造成垂直偏移错误。不同类别 NMS 与 IoU 阈值会改变最终框数。","diagnose":"在 ROCK 5B 保存真实逐帧 JSONL 和一张同图对照；模型必须明确为优化版 YOLOv8 六/九输出，检查类别映射、框边界、DFL/NMS 与真实帧采集。","teach":"问学生为何 PC 成功、转换成功和 NPU 推理成功是不同层次的证据。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
