<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>yolov8模型部署(优化加速版)｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":33,"title":"yolov8模型部署(优化加速版)","intro":"以 YOLOv8 为例建立优化前后的性能、精度对照。","goals":["独立测量未优化版本的耗时","比较 INT8、线程池、算子改动和前处理方案","保证加速后检测精度与稳定性"],"core":"本节比较原版与加速版 YOLOv8：转换 ONNX/RKNN、测量板端基线，再尝试量化、线程池/流水线、输出处理和输入 letterbox 优化。需要分清纯 NPU 推理速度与图像采集、预处理、NMS、绘制及显示构成的总帧率。视频中的数十帧至上百帧实验结果依赖模型尺寸、输入视频、频率及代码，不应作为所有设备的性能保证。课程提及 RGA，但未将该部分视作已验证成功的优化成果。","steps":["准备一个已验证精度的 YOLOv8 基线模型","用固定测试视频测量 mAP、NPU 延迟、端到端 FPS、CPU/DDR 占用与温度","只改变一个变量，优先测试 INT8 量化带来的速度与精度变化","尝试线程池/流水线并发，避免反复创建上下文","检查 letterbox 是否保留宽高比、检测框坐标是否正确还原","研究激活或模型图变更时执行数值回归与任务级评估","进行多轮长时间测试，记录各单项优化和叠加优化效果"],"pitfalls":["量化提升吞吐可能伴随 mAP 损失","多线程可能受限于内存带宽、CPU 竞争和调度开销","不要把尚未完整验证的 RGA 优化写成已完成"],"checks":["每项优化有同条件实验数据证明","同时记录 FPS、精度与资源占用"],"homework":["制作消融实验表：基线、量化、线程池、letterbox、综合优化"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"YOLOv8 的实际输出依赖部署版本","explain":"官方 RKNN Model Zoo 的 YOLOv8 转换示例采用针对 RKNN 适配过的输出结构，与上游原始 YOLOv8 模型输出可能不同。部分检测头输出将边框坐标和类别概率分开，解码可能包括分布式边框回归（DFL）等步骤。应使用相同 Model Zoo commit 的模型和后处理，避免换一个 ONNX 后沿用旧代码。","takeaway":"任何优化前先在 Netron 确认输出 shape、名称、量化属性和解码实现。"},{"title":"定位 端到端 FPS 的瓶颈","explain":"检测系统常包含相机、图像变换、NPU 推理、decode/NMS、绘图与显示。可优化的方向包括减少不必要拷贝、图像预处理硬件化、合理量化、更小的输入尺寸、合适的 NPU 核配置和高效后处理。每个因素有精度、算子支持和功耗代价，需要有控制变量实验。","takeaway":"给每项优化记录相同分辨率、相同数据集的 mAP、p95 延迟和 FPS。"},{"title":"不要把实验速度当成业务速度","explain":"Model Zoo 的 benchmark 可能只统计特定条件下的推理时间，不能直接代表你项目摄像头运行的端到端 FPS。短时间展示的高帧率还可能受热频率变化、输入缓存及计时范围影响。最终优化应以足够长的实际应用负载与独立验证集为依据。","takeaway":"对所有声称的‘加速倍率’给出基线、测量方法、持续时间和精度变化。"}],"lab":[{"title":"复现官方 YOLOv8 baseline","action":"按 Model Zoo 的 YOLOv8 README 在 RK3588 上完成配套转换/推理，保存输出图片与 tensor 信息。","verify":"得到对应版本的正确检测结果与完整日志。"},{"title":"列出性能构成","action":"为 resize、NPU、解码、NMS、绘图分别计时，记录 p50/p95 与温度。","verify":"能指出占用最高的阶段并提出假设。"},{"title":"进行一次消融","action":"只改一个因素，例如后处理实现或图片 resize 方案，其他条件固定，重新测精度和吞吐。","verify":"至少形成一行前后对照并解释收益和代价。"}],"diagnosis":[{"symptom":"切换模型后检测框全部错误","reason":"采用了另一模型版本的输出布局或 DFL/后处理方法。","check":"打印输出 tensor 属性并与该版本 Model Zoo 对比。"},{"symptom":"FPS 提升但小目标漏检","reason":"输入变小或量化导致分辨率/精度损失。","check":"分组计算小目标召回率，检查 NMS 和置信度阈值。"}],"case":{"problem":"有人宣称 YOLOv8 在 RK3588 上优化到 150 FPS，但你的摄像头只显示 30 FPS。这个数据必然造假吗？","analysis":"不能直接下结论。需要确认对方是否只计纯 NPU benchmark、使用更小的模型/分辨率或读内存中的固定图片，而摄像头端到端还受传感器帧率限制。只有同测量边界才可比较。","evidence":"设备/模型/输入配置、分段时间、数据源和至少一次长时间运行日志。"},"snippet":"# Linux demo 构建参数示意；确切语法以对应 Model Zoo README 为准\n# git clone https://github.com/airockchip/rknn_model_zoo.git\n# cd rknn_model_zoo\n# ./build-linux.sh -t rk3588 -a aarch64 -d yolov8\n# 使用与该示例配套的 ONNX、转换器和后处理。","refs":[["RKNN Model Zoo YOLOv8","https://github.com/airockchip/rknn_model_zoo/tree/main/examples/yolov8"],["YOLOv8 说明与项目","https://docs.ultralytics.com/models/yolov8/"],["RKNN C++ YOLOv8 代码","https://github.com/airockchip/rknn_model_zoo/tree/main/examples/yolov8/cpp"]]}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
