<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>rknn模型转换｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":9,"title":"rknn模型转换","intro":"掌握从 ONNX 等源模型到 `.rknn` 的标准转换流程。","goals":["理解配置、加载、构建和导出的步骤","辨别量化与非量化转换","阅读转换日志与返回码"],"core":"标准调用顺序为：创建 `RKNN` 对象 → `config` 指定目标平台及预处理 → `load_onnx` 等接口加载模型 → `build` 构建 → `export_rknn` 导出 → `release` 释放。启用 INT8 量化通常还需要代表性校准数据集。任何一步的返回码异常都应停止后续流程。","steps":["用 Netron 或 ONNX Runtime 确认输入输出的形状与数据类型","指定 `target_platform='rk3588'` 并检查 mean/std 与布局","按源框架格式加载模型","先尝试非量化 build，再考虑校准量化","导出 RKNN，并以相同测试输入验证"],"pitfalls":["模型转换成功并不等于量化后精度达标","模型的 RGB/BGR、NCHW/NHWC、前处理方式需要在所有阶段一致"],"checks":["`.rknn` 文件存在且能够被正确加载","转换配置、SDK 版本及输出信息可被复现"],"homework":["比较同一模型的非量化与量化方案，并保存配置差异"],"code":"from rknn.api import RKNN\n\nrknn = RKNN(verbose=True)\ntry:\n    assert rknn.config(target_platform='rk3588') == 0\n    assert rknn.load_onnx(model='model.onnx') == 0\n    assert rknn.build(do_quantization=False) == 0\n    assert rknn.export_rknn('model.rknn') == 0\nfinally:\n    rknn.release()\n# 实际部署应添加与训练一致的输入均值、标准差及数据布局配置。"}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"转换五阶段及返回码","explain":"创建 `RKNN` → `config` 配置平台和预处理 → `load_onnx` 加载计算图 → `build` 执行图优化与编译 → `export_rknn` 导出目标模型，最后 `release` 清理资源。所有步骤的返回码必须检查；示例路径需要替换成自己实际下载的模型。`target_platform='rk3588'` 对应目标 NPU，而非训练机器的 CPU。","takeaway":"能说明 config、load、build、export 的前后依赖关系，并知道在哪一阶段捕获异常。"},{"title":"非量化优先构建","explain":"第一次转换应先构建非 INT8 版本，用来验证算子、shape 与基本模型语义。启用 INT8 校准需要使用代表性图片列表或模型相关数据集；错误的校准样本可能导致严重精度损失。版本不同，参数和路径要求应以官方示例为准。","takeaway":"非量化是定位转换问题的对照组，不是声称永远优于 INT8。"},{"title":"数值一致性与部署验收","explain":"源框架、ONNX Runtime、RKNN 模拟器、RK3588 板端的数值路径可能有合理差异，但应采用同一图片、等价的预处理、相同输出后处理和可比的度量。分类比较 top-k 与 logits；检测需要比较 mAP、漏检和定位误差。只拿一张图片肉眼判断不够。","takeaway":"转换成功后必须做功能回归、性能评估、精度统计三个环节。"}],"lab":[{"title":"检查 ONNX","action":"用 onnx/checker 或 ONNX Runtime 读取模型输入输出，打印每个 tensor 的名称、维度、数据类型；记录 opset。","verify":"输入 shape 与实际输入预处理计划一致，模型语法检查通过。"},{"title":"完成非量化转换","action":"在匹配的 Toolkit2 环境创建 RKNN 对象，完成 config/load/build/export，并在 finally 中 release。","verify":"确认每步返回码成功且 .rknn 文件存在，附上 SHA256。"},{"title":"设置对照基线","action":"固定一个小型验证集，以同样预处理比较 ONNX 和 RKNN 的输出；再评估是否启动 INT8 校准。","verify":"记录数值差异、任务级精度和不一致的测试样本。"}],"diagnosis":[{"symptom":"build 失败提示不支持算子","reason":"源模型 opset 或图算子超出当前 Toolkit2 支持范围。","check":"定位日志中的算子名称及节点，参考官方 User Guide 重新导出或修改模型。"},{"symptom":"量化后准确率降低","reason":"校准集范围或预处理参数不代表真实输入。","check":"先恢复非量化基线，检查训练/转换时的 mean、std 与颜色顺序。"}],"case":{"problem":"ONNX 能用 ONNX Runtime 预测正确，RKNN 导出成功但分类几乎随机。下一步直接换新模型吗？","analysis":"先检查模型输入布局和数值范围：ONNX 常使用 NCHW float32，而 RKNN 可能配置了不同的 RGB、mean/std、dtype 路径。使用固定样本对比进入模型前的真实张量，再比较非量化输出，最后才进入校准阶段。","evidence":"模型 shape、预处理参数、SDK 版本、同一图像在各阶段的 top-k 与输出差异。"},"snippet":"from rknn.api import RKNN\nrknn = RKNN(verbose=True)\ntry:\n    assert rknn.config(target_platform='rk3588') == 0\n    assert rknn.load_onnx(model='model.onnx') == 0\n    assert rknn.build(do_quantization=False) == 0\n    assert rknn.export_rknn('model.rknn') == 0\nfinally:\n    rknn.release()\n# 替换实际模型路径；mean/std 需要结合训练协议设置。","refs":[["RKNN 官方用户指南","https://github.com/airockchip/rknn-toolkit2/tree/master/doc"],["RKNN Model Zoo 转换示例","https://github.com/airockchip/rknn_model_zoo"],["ONNX Runtime 官方文档","https://onnxruntime.ai/docs/"]],"walkthrough":{"intro":"第 09 讲以仓库生成的 Tiny CNN 为固定输入，演示 ONNX checker、RKNN config/load_onnx/build/export 四个阶段；先不量化，以减少变量。","flow":["Tiny CNN ONNX","onnx.checker","RKNN config/load_onnx","build(non-INT8)","export .rknn"],"steps":[{"api":"生成最小真实 ONNX 与固定 NCHW 输入","input":"create_tiny_onnx.py 输出路径","output":"tiny.onnx + input.npy，shape=(1,3,4,4)","why":"固定模型只是验证工具链，并不是 ImageNet 分类器。ONNX Runtime 按图计算的预期值是 [0.5,0.25]，需用真实运行验证。","code":"python3 examples/hardware/create_tiny_onnx.py \\\n  --onnx build/tiny.onnx --input-npy build/input.npy"},{"api":"转换器 API 四步的含义","input":"onnx model、target_platform='rk3588'、mean/std","output":"成功时编译并导出 .rknn","why":"config 约束目标平台和预处理，load_onnx 解析图，build 编译/可选量化，export 序列化模型；某一步返回非零不可跳过。","code":"r.config(target_platform='rk3588', mean_values=[[0,0,0]], std_values=[[1,1,1]])\nr.load_onnx(model='build/tiny.onnx')\nr.build(do_quantization=False)\nr.export_rknn('build/tiny.rknn')"},{"api":"区分编译与设备运行","input":"真实 .rknn 文件与 Toolkit2 版本","output":"编译日志和导出模型路径","why":"ONNX checker 成功不意味着 RKNN build 成功；RKNN 导出成功也不意味着 ROCK 5B 的 NPU 已执行。","code":"python3 examples/lesson_09.py --onnx build/tiny.onnx \\\n  --output build/tiny.rknn --mean 0,0,0 --std 1,1,1"}],"example":"如果 RKNN build 失败：先保存错误算子、opset、输入 layout、Toolkit2 release，而不是刷板端驱动。mean/std 设置必须与模型输入的 float 值约定一致。","acceptance":"分别记录 ONNX 校验、真实 RKNN build 返回码和导出结果；未安装 Toolkit2 的 PC 只能完成前半段。"},"guidance":{"phases":[{"title":"确认准备条件与输入协议","action":"先安装与 x86_64 Python ABI 匹配的 Toolkit2、ONNX；尚无 SDK 时先执行只需 ONNX 的第一步。","command":"","observe":"首个关键步骤处理 create_tiny_onnx.py 输出路径，输出应为 tiny.onnx + input.npy，shape=(1,3,4,4)。","diagnose":"构建失败优先保存具体 Toolkit2 `load_onnx`/`build` 日志和工具版本，不把模型没生成归因于板端环境。","teach":"先检查前置条件，不能凭假设跳过环境核对。"},{"title":"教师演示最小可运行命令","action":"从仓库根目录运行。/path/to 路径和外部 SDK 必须是真实文件及兼容环境。","command":"python3 examples/hardware/create_tiny_onnx.py --onnx build/tiny.onnx --input-npy build/input.npy\npython3 examples/lesson_09.py --onnx build/tiny.onnx --output build/tiny.rknn --mean 0,0,0 --std 1,1,1","observe":"第一步在安装 onnx 的 PC 上生成真实 ONNX 与 NPY；第二步需要兼容 Toolkit2，成功时输出 RKNN 和含源/目标 SHA256 的 manifest。","diagnose":"构建失败优先保存具体 Toolkit2 `load_onnx`/`build` 日志和工具版本，不把模型没生成归因于板端环境。","teach":"逐项说明参数、输出文件位置和软件层次。"},{"title":"学生解释结果并独立验收","action":"实验分别核对 ONNX 图通过、RKNN 导出成功和板端输出一致三道门槛。`mean_values=[[0,0,0]], std_values=[[1,1,1]]` 只是适用于特定小模型的中性转换设置，不应直接照搬到 ImageNet/Yolo 权重。","command":"python3 -c \"import json; d=json.load(open('build/lesson09/build.json')); print(d['onnx_nodes'],d['rknn_sha256'])\"","observe":"最小 Tiny CNN 的输入 `(1,3,4,4)` float32 NCHW，输出为 `(1,2)`；先在 ONNX Runtime 保存参考 NPZ，再尝试非量化 RKNN 转换。出现 `load_onnx` 不支持算子时检查 opset/图结构，而不是改动已经未使用的摄像头驱动。","diagnose":"分别记录 ONNX 校验、真实 RKNN build 返回码和导出结果；未安装 Toolkit2 的 PC 只能完成前半段。","teach":"结合实际输出解释因果，记录未通过项；PC 数据不能冒充 ROCK 5B 实测。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
