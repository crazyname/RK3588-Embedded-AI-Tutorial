<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>rknn模型转换｜RK3588 HTML 教学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":9,"title":"rknn模型转换","intro":"掌握从 ONNX 等源模型到 `.rknn` 的标准转换流程。","goals":["理解配置、加载、构建和导出的步骤","辨别量化与非量化转换","阅读转换日志与返回码"],"core":"标准调用顺序为：创建 `RKNN` 对象 → `config` 指定目标平台及预处理 → `load_onnx` 等接口加载模型 → `build` 构建 → `export_rknn` 导出 → `release` 释放。启用 INT8 量化通常还需要代表性校准数据集。任何一步的返回码异常都应停止后续流程。","steps":["用 Netron 或 ONNX Runtime 确认输入输出的形状与数据类型","指定 `target_platform='rk3588'` 并检查 mean/std 与布局","按源框架格式加载模型","先尝试非量化 build，再考虑校准量化","导出 RKNN，并以相同测试输入验证"],"checks":["`.rknn` 文件存在且能够被正确加载","转换配置、SDK 版本及输出信息可被复现"],"pitfalls":["模型转换成功并不等于量化后精度达标","模型的 RGB/BGR、NCHW/NHWC、前处理方式需要在所有阶段一致"],"homework":["比较同一模型的非量化与量化方案，并保存配置差异"],"code":"from rknn.api import RKNN\n\nrknn = RKNN(verbose=True)\ntry:\n    assert rknn.config(target_platform='rk3588') == 0\n    assert rknn.load_onnx(model='model.onnx') == 0\n    assert rknn.build(do_quantization=False) == 0\n    assert rknn.export_rknn('model.rknn') == 0\nfinally:\n    rknn.release()\n# 实际部署应添加与训练一致的输入均值、标准差及数据布局配置。"}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
