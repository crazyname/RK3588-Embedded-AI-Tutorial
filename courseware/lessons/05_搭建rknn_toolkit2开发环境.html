<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搭建rknn · toolkit2开发环境｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":5,"title":"搭建rknn · toolkit2开发环境","intro":"在 Ubuntu x86_64 上配置 RKNN-Toolkit2。","goals":["建立独立的 Conda 环境","安装匹配的工具链依赖和 wheel","完成 Python 包导入验证"],"core":"课程以 Ubuntu 20.04、Miniconda、Python 3.8 为演示环境。PC 开发机通常为 x86_64，RK3588 开发板为 aarch64，安装包不能混用。实际可用 Python 版本、Ubuntu 版本和依赖请核对正在使用的 RKNN-Toolkit2 release 文档。","steps":["准备 Ubuntu 系统与网络环境","安装 Miniconda 并建立名为 rknn-toolkit2 的独立环境","从官方 SDK 下载适配本机架构与 Python 版本的依赖清单和 wheel","在激活的环境中安装 requirements 和 Toolkit2","尝试导入 RKNN，并记录版本与安装日志"],"pitfalls":["不能凭视频口播推断 wheel 文件名或依赖版本","先核对官方支持矩阵，避免污染全局 Python","虚拟机与开发板要具备可达网络或可用的数据传输通道"],"checks":["`from rknn.api import RKNN` 能正常执行","能说明 x86_64 和 aarch64 wheel 的差异"],"homework":["保存 Conda 环境配置和导入验证日志"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"主机工具链的运行边界","explain":"RKNN-Toolkit2 是开发主机侧转换工具，通常安装在 SDK 支持的 Linux x86_64 与特定 Python 版本组合中。wheel 包含编译扩展，文件名中的 cp310、manylinux、x86_64 等标签不是装饰。Python 解释器版本、glibc 和 CPU 架构不符时，即使 pip 显示安装成功，也可能在 import 时崩溃。","takeaway":"先确认 `uname -m`、`python -V`、官方支持矩阵，再选择同版本的 wheel 与依赖。"},{"title":"隔离环境和锁定依赖","explain":"建议通过 venv 或 Conda 为模型转换创建独立环境，避免与训练阶段的 PyTorch、NumPy、protobuf 等依赖相互覆盖。不要把某个视频出现的旧版本列表当成当前推荐值。优先使用官方仓库对应 release 的 requirements 与 Quick Start，并保存 pip freeze、wheel 文件名和安装日志。","takeaway":"一次只升级一个关键组件，成功后冻结环境并记录其关联的 SDK tag。"},{"title":"安装成功如何检验","explain":"验证路径分三级：Python 能导入 `RKNN`、SDK 能实例化并打印版本信息、一个官方示例能够用受支持模型完成转换。只有第三级才验证模型构建所需依赖。主机转换成功也不能代替目标板的驱动及 Runtime 检查。","takeaway":"把导入、构建、板端运行分别列出通过/失败状态，不把单一步骤当完整验收。"}],"lab":[{"title":"检查主机架构","action":"运行 `uname -m`、`python3 -V`、`python3 -m pip -V`，记录实际调用的 Python 所在路径与版本。","verify":"确认是官方支持的主机架构和 Python 版本，pip 与 python 指向同一虚拟环境。"},{"title":"建立干净环境","action":"通过 `python3 -m venv .venv` 建立新环境并激活；依据对应 SDK 的 Quick Start 安装官方 wheel 与依赖，记录 wheel 文件完整名称。","verify":"`pip show rknn-toolkit2` 可以定位安装信息；包名、版本以该 wheel 为准。"},{"title":"完成最小导入","action":"执行仅导入 `RKNN` 的 Python 片段，然后基于同一 SDK 的官方示例执行一次非量化转换。","verify":"没有 ImportError，示例打印的返回码为成功；日志中能看到导出路径。"}],"diagnosis":[{"symptom":"ImportError / undefined symbol","reason":"wheel 的 Python ABI、NumPy 等二进制依赖不匹配。","check":"使用 `python -V`、`pip -V`、`pip show` 与 wheel 标签逐项对照，不先全局升级依赖。"},{"symptom":"安装一个包后另一个项目坏了","reason":"训练依赖和转换依赖装在同一个 site-packages 中发生冲突。","check":"为转换独立新建虚拟环境，比较 `pip freeze` 变化。"}],"case":{"problem":"你在 ARM64 板端执行 pip install 一个 x86_64 的 Toolkit2 wheel，提示 not a supported wheel。是网络问题吗？","analysis":"不是。wheel 明确声明所支持的 ABI 和系统架构。转换工具一般运行在兼容的开发主机上，板端 Python 推理应查看 Toolkit-Lite2 对应的安装说明。","evidence":"主机架构、wheel 标签、Python 版本和导入验证记录。"},"snippet":"uname -m\npython3 -V\npython3 -m venv .venv\nsource .venv/bin/activate\npython -c 'from rknn.api import RKNN; print(\"RKNN import OK\")'\n# 请先依据官方 Quick Start 安装与环境匹配的 wheel。","refs":[["官方 Toolkit2 快速入门与支持矩阵","https://github.com/airockchip/rknn-toolkit2/tree/master/doc"],["Toolkit2 软件仓库","https://github.com/airockchip/rknn-toolkit2"],["Python venv 文档","https://docs.python.org/3/library/venv.html"]],"walkthrough":{"intro":"第 05 讲先做主机端 ABI 与 RKNN Toolkit2 版本检查：RKNN-Toolkit2 是 x86_64 Linux 的模型转换工具，不能把其 wheel 安装到 ROCK 5B 的 ARM64 RKNNLite 环境。","flow":["x86_64 Linux / Python ABI","官方匹配 wheel","from rknn.api import RKNN","读取 Toolkit2 环境报告","转换 Tiny ONNX"],"steps":[{"api":"核对 Python ABI 而不是只看 Python 大版本","input":"当前 python3 解释器、OS 与机器架构","output":"SOABI、machine、executable、是否虚拟环境","why":"相同 Python 3 版本也可能安装了错误架构或 ABI 的 wheel；固定 Python 版本应以官方 Toolkit2 release 可用的 wheel 为准。","code":"python3 -c \"import platform,sys,sysconfig; print(platform.machine(),sys.version,sysconfig.get_config_var('SOABI'))\""},{"api":"lesson_05.py：检查 SDK 是否真的可导入","input":"已经安装的 Toolkit2 包","output":"rknn_module_found 和 RKNN_class_imported 布尔值","why":"检测到 Python 模块不等于它能导入全部所需动态依赖；显式 --require-toolkit 会拒绝不可用环境。","code":"python3 examples/lesson_05.py --require-toolkit --output build/toolkit_env.json"},{"api":"第一次转换前锁定环境信息","input":"SDK release、Python ABI 与模型导出参数","output":"可重现的软件版本记录","why":"模型转换报错应先确定是 wheel 环境、ONNX 图不支持，还是板端 Runtime 不匹配，而不把所有问题归类为驱动损坏。","code":"python3 -c \"from rknn.api import RKNN; print('RKNN API imported')\"\npython3 examples/hardware/convert_onnx.py --help"}],"example":"安装成功的最小证据是当前目标虚拟环境中能导入 RKNN 类，并能打印真实 Python 版本、SOABI 与平台；它还不代表模型转换或 NPU 推理通过。","acceptance":"保存实际工具链版本/架构与导入检查，不凭一张 pip 安装成功的截图认为所有 SDK 已兼容。"}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
