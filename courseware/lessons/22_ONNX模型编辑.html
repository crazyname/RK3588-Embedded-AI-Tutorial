<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONNX模型编辑｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":22,"title":"ONNX模型编辑","intro":"分析并优化 ONNX 模型图中的布局变换。","goals":["识别 Reshape、Transpose 和输入输出布局问题","认识 RKNN 相关 ONNX 编辑工具","确保图修改后数值含义不发生错误变化"],"core":"某些框架导出的 ONNX 在输入输出附近存在多余的数据布局变换节点；减少必要之外的 Transpose/Reshape 可能降低转换后的 NPU/CPU 开销。修改这些算子既可能提升性能，也可能无意改变张量语义。因此应先保留原始模型，编辑后运行 ONNX Runtime 数值回归，再比较 RKNN 量化精度和板端耗时。","steps":["保存原始 ONNX 与参考输入输出样本","使用 Netron 定位输入输出附近的 Transpose/Reshape","核对 SDK 提供的 ONNX 编辑工具与示例适用范围","对编辑后的 ONNX 运行数值回归测试","以相同参数构建 RKNN，比较精度、延迟及内存"],"pitfalls":["不要仅为减少节点个数而删除必要的 Transpose","图变化会影响应用预处理布局，必须同步修改"],"checks":["新 ONNX 模型与原模型在等价输入下输出一致","测得的速度收益可在板端复现"],"homework":["制作一次模型图优化的回归测试清单"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"ONNX 图编辑的目的","explain":"图优化包括删除冗余算子、常量折叠、合理的节点融合、输入输出规范化与兼容性修改。但是 `Transpose`、`Reshape`、`Concat` 和 `Softmax` 都可能具有必要语义，不能因为看起来多余就直接删掉。图编辑前先保存原始模型和可信的 ONNX Runtime 基线。","takeaway":"任何图改写都需要语义保持证明，而不仅是 `checker` 通过。"},{"title":"形状重排如何影响语义","explain":"以 tensor 形状 [1,3,224,224] 为例，交换为 [1,224,224,3] 后元素数相同，布局语义不同。`Reshape` 通常改变组织方式而不显式交换数值轴；`Transpose` 会改变轴排列，两者不是可随意相互替代的操作。","takeaway":"在修改前给每个候选节点标出输入 shape、输出 shape 和 perm 属性。"},{"title":"正确的模型图回归","explain":"先运行 ONNX checker、shape inference，再用保存的输入样本对原/新 ONNX 分别运行推理，比较输出形状、最大绝对差、余弦相似度及任务级精度。只有验证通过后才能进入 RKNN 转换和真实 NPU 性能测试。","takeaway":"图更简洁不等于执行更快；优化有效性最终仍靠板端时延证明。"}],"lab":[{"title":"检查输入图","action":"选择一个有 Reshape/Transpose 的 ONNX，保存源文件 SHA256 与固定测试输入。","verify":"可追溯原模型来源和 tensor shape。"},{"title":"执行安全静态检查","action":"使用 onnx.checker 与 shape_inference 检查原模型，记录图中各节点数量。","verify":"无语法问题，未知维度被单独标注。"},{"title":"做前后数值对照","action":"在经过检验的 ONNX 编辑工具完成一个明确的常量节点整理，比较同样输入下的输出值。","verify":"用绝对误差/精度判断，避免凭图片观察。"}],"diagnosis":[{"symptom":"删除节点后输出异常","reason":"节点实际上负责布局转换或后处理。","check":"在 Netron 确认数据轴和实际数值回归差异。"},{"symptom":"checker 通过但 RKNN build 失败","reason":"语法合法与硬件算子兼容是两个不同判断。","check":"查看 Toolkit2 不支持算子列表与实际 build 日志。"}],"case":{"problem":"删除 YOLO 检测头前的 Transpose 后，网络仍能导出 ONNX，框却全部偏移。为什么？","analysis":"Transpose 的轴变换可能是检测头解码所依赖的布局。当后处理继续按旧的轴含义读取 tensor 时，索引解释完全错乱。需要恢复节点或同步修改后处理，并通过回归测试验证。","evidence":"编辑前后节点属性、输出 shape、同图数值和检测 mAP。"},"snippet":"import onnx\nm=onnx.load('model.onnx')\nonnx.checker.check_model(m)\nx=onnx.shape_inference.infer_shapes(m)\nprint('nodes',len(x.graph.node))\n# 不应直接删除不理解的 Transpose 或 Reshape。","refs":[["ONNX Python API","https://onnx.ai/onnx/"],["ONNX Shape Inference","https://github.com/onnx/onnx/blob/main/docs/ShapeInference.md"],["ONNX Runtime 验证工具","https://onnxruntime.ai/docs/"]],"walkthrough":{"intro":"第 22 讲用真实 ONNX 图执行一项可解释的改写：删去一输入一输出的 Identity 节点并把消费者连回原始张量。lesson_22.py 的目标是理解图的连接关系，绝不是“随便改图也能提升 NPU 性能”。","flow":["真实 ONNX ModelProto","定位 Identity 节点","重连消费者与 graph.output","onnx.checker","可选 ONNX Runtime 数值回归"],"steps":[{"api":"定位 Identity：识别不改数值的直通节点","input":"graph.node 中的 op_type='Identity'、input/output 名称","output":"待移除节点与其原输入 src、原输出 dst","why":"只有明确的一进一出 Identity 才可以直接考虑绕过。其他算子即使看似简单，也不能在不理解数据语义时随意删除。","code":"for node in model.graph.node:\n    if node.op_type == 'Identity':\n        print(node.name, node.input, node.output)"},{"api":"更新所有消费者和 graph.output","input":"原来引用 dst 的后续节点与输出名","output":"引用 src 的更新后图连接","why":"删节点但不改后续引用会产生找不到张量的问题；本教学脚本不处理嵌套子图，复杂图改写需要更严谨的图语义与数值回归。","code":"for candidate in model.graph.node:\n    for i, name in enumerate(candidate.input):\n        if name == dst: candidate.input[i] = src\n# 还需重连 graph.output，再删除 Identity"},{"api":"数值回归优先于文件是否能保存","input":"同一 .npy 测试输入和改写前后 ONNX session","output":"比较每个对应输出是否 allclose","why":"checker 主要验证图格式；在涉及语义变化时必须以相同真实输入做 ONNX Runtime 输出对照，并保留最大误差。脚本可选 --input-npy 触发这一检查。","code":"python3 examples/lesson_22.py --onnx /path/to/model.onnx --output build/lesson22/optimized.onnx --input-npy /path/to/input.npy"}],"example":"假设模型 input→Identity→Relu，删除 Identity 后改成 input→Relu。若输入值 [-1,2]，前后 Relu 输出均应为 [0,2]；这是原理例题，不是自动改写所有 ONNX 图的证明。","acceptance":"保存真实改写后 ONNX、checker 结果与同输入的数值回归；不得把删除 Identity 自动称为 RK3588 上的加速优化。"}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
