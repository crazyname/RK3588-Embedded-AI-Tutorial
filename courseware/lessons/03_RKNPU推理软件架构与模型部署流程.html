<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RKNPU推理软件架构与模型部署流程｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":3,"title":"RKNPU推理软件架构与模型部署流程","intro":"串联硬件、驱动、运行时与模型转换流程。","goals":["分辨 NPU 硬件、内核驱动与用户态运行时","描述 RKNN 的开发流程","识别 PC 和板端各自承担的工作"],"core":"典型系统包含 NPU 硬件层、Linux 内核驱动层和用户态 RKNN API/运行时。常规流程是准备训练好的 PyTorch/ONNX 等模型，在主机通过 RKNN-Toolkit2 配置、加载、构建和导出 `.rknn`；在 RK3588 板端由 RKNN 运行时调用驱动完成推理。应用还必须实现模型输入预处理、输出后处理与资源释放。","steps":["获取源模型并确认输入输出信息","在主机执行 RKNN 转换与模型验证","确认板端驱动和运行库版本","编写初始化、预处理、推理、后处理、释放的流程","记录精度、延迟与内存基线"],"pitfalls":["转换成功不等于板端一定能加载","驱动、运行库和 Toolkit 版本需具备兼容性"],"checks":["能画出带有 PC/板端分界线的流程图","能说清 `.rknn` 模型和运行时库不是同一个东西"],"homework":["绘制完整 RKNN 软件架构并标注每一层的产物"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"转换与运行是两个环境","explain":"RKNN-Toolkit2 常在开发主机上读取 ONNX 等模型，执行图优化、编译与可选量化，再导出面向目标芯片的 .rknn。RKNN Runtime/Lite2 则在板端加载该文件，调用 RKNPU 驱动执行。主机工具不是板端驱动，板端运行时也不能简单代替主机模型转换。","takeaway":"画清楚训练框架、ONNX、Toolkit2、.rknn、Runtime、kernel driver 之间的边界。"},{"title":"版本协作链","explain":"一份模型由某个 Toolkit2 版本生成，目标板拥有特定版本的 librknnrt 和内核驱动。不同代 SDK 的格式及接口可能存在兼容条件；‘某篇教程可以运行’不代表你当前板子也能运行。应以官方发布的支持关系和实际 log 为准，同时保存 wheel 版本、runtime 版本与固件版本。","takeaway":"排查模型加载失败时，优先记录所有版本，再考虑是否需要升级；禁止跳过备份直接刷写。"},{"title":"理解前后处理的职责","explain":"图像从摄像头进入后还可能经过裁剪、缩放、letterbox、通道交换与标准化。模型输出的往往是 tensor，不一定是画好的检测框；分类需标签映射，检测需 box decode 和 NMS。软件框架只负责其中一段，应用正确性依赖前后处理与模型的训练约定一致。","takeaway":"可以用可重复的输入对源模型、ONNX 和 RKNN 三阶段做结果比对。"}],"lab":[{"title":"制作软件层次图","action":"绘制 PC：模型 → Toolkit2 → .rknn；板端：应用 → Runtime → Driver → NPU，并标注用于分类的输入图片和输出 scores。","verify":"解释每一条箭头传递的模型文件或张量数据。"},{"title":"创建版本表","action":"记录主机 Python/Toolkit2、板端内核、运行时库、板卡 BSP、模型转换时间及目标平台参数。","verify":"发生错误时能够准确回答‘哪一套工具生成，哪一套环境加载’。"},{"title":"设计分阶段调试","action":"分别检查 ONNX 输入输出、RKNN 转换日志、板端初始化和目标输出，把问题定位到最早发生偏差的阶段。","verify":"调试计划必须有具体输入数据和比较标准。"}],"diagnosis":[{"symptom":"模型无法初始化","reason":"转换与运行组件之间可能不兼容，也可能是文件损坏或目标 SoC 配置错误。","check":"记录详细返回码、Runtime/Driver 版本及 .rknn 创建来源。"},{"symptom":"可加载但结果错乱","reason":"前处理或输出张量属性不一致，不能仅据此断言驱动损坏。","check":"查询 shape、layout、dtype、量化 scale/zp，再逐阶段比对数值。"}],"case":{"problem":"模型在电脑模拟器上预测正确，但拷到 RK3588 后提示版本不匹配。应该先换芯片还是更新运行库？","analysis":"先确定版本链：工具链版本、模型目标平台、板端 runtime/driver 和 BSP。参考官方兼容指南制定升级或重新转换策略。不能只因为模型能在 PC 上跑，就认为任何旧固件都能加载。","evidence":"模型来源、目标参数、版本号、完整错误码和更改前后的对照日志。"},"snippet":"python3 -c \"import platform; print(platform.platform(), platform.machine())\"\n# 板端: uname -a; 开发机: python -V\n# Runtime / NPU 驱动版本应按对应板卡 SDK 查询。","refs":[["RKNN-Toolkit2 主仓库","https://github.com/airockchip/rknn-toolkit2"],["官方 SDK 文档目录","https://github.com/airockchip/rknn-toolkit2/tree/master/doc"],["RKNPU2 板端接口","https://github.com/rockchip-linux/rknpu2"]]}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
