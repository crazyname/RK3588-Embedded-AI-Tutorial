<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RKNPU推理软件架构与模型部署流程｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":3,"title":"RKNPU推理软件架构与模型部署流程","intro":"串联硬件、驱动、运行时与模型转换流程。","goals":["分辨 NPU 硬件、内核驱动与用户态运行时","描述 RKNN 的开发流程","识别 PC 和板端各自承担的工作"],"core":"典型系统包含 NPU 硬件层、Linux 内核驱动层和用户态 RKNN API/运行时。常规流程是准备训练好的 PyTorch/ONNX 等模型，在主机通过 RKNN-Toolkit2 配置、加载、构建和导出 `.rknn`；在 RK3588 板端由 RKNN 运行时调用驱动完成推理。应用还必须实现模型输入预处理、输出后处理与资源释放。","steps":["获取源模型并确认输入输出信息","在主机执行 RKNN 转换与模型验证","确认板端驱动和运行库版本","编写初始化、预处理、推理、后处理、释放的流程","记录精度、延迟与内存基线"],"pitfalls":["转换成功不等于板端一定能加载","驱动、运行库和 Toolkit 版本需具备兼容性"],"checks":["能画出带有 PC/板端分界线的流程图","能说清 `.rknn` 模型和运行时库不是同一个东西"],"homework":["绘制完整 RKNN 软件架构并标注每一层的产物"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"转换与运行是两个环境","explain":"RKNN-Toolkit2 常在开发主机上读取 ONNX 等模型，执行图优化、编译与可选量化，再导出面向目标芯片的 .rknn。RKNN Runtime/Lite2 则在板端加载该文件，调用 RKNPU 驱动执行。主机工具不是板端驱动，板端运行时也不能简单代替主机模型转换。","takeaway":"画清楚训练框架、ONNX、Toolkit2、.rknn、Runtime、kernel driver 之间的边界。"},{"title":"版本协作链","explain":"一份模型由某个 Toolkit2 版本生成，目标板拥有特定版本的 librknnrt 和内核驱动。不同代 SDK 的格式及接口可能存在兼容条件；‘某篇教程可以运行’不代表你当前板子也能运行。应以官方发布的支持关系和实际 log 为准，同时保存 wheel 版本、runtime 版本与固件版本。","takeaway":"排查模型加载失败时，优先记录所有版本，再考虑是否需要升级；禁止跳过备份直接刷写。"},{"title":"理解前后处理的职责","explain":"图像从摄像头进入后还可能经过裁剪、缩放、letterbox、通道交换与标准化。模型输出的往往是 tensor，不一定是画好的检测框；分类需标签映射，检测需 box decode 和 NMS。软件框架只负责其中一段，应用正确性依赖前后处理与模型的训练约定一致。","takeaway":"可以用可重复的输入对源模型、ONNX 和 RKNN 三阶段做结果比对。"}],"lab":[{"title":"制作软件层次图","action":"绘制 PC：模型 → Toolkit2 → .rknn；板端：应用 → Runtime → Driver → NPU，并标注用于分类的输入图片和输出 scores。","verify":"解释每一条箭头传递的模型文件或张量数据。"},{"title":"创建版本表","action":"记录主机 Python/Toolkit2、板端内核、运行时库、板卡 BSP、模型转换时间及目标平台参数。","verify":"发生错误时能够准确回答‘哪一套工具生成，哪一套环境加载’。"},{"title":"设计分阶段调试","action":"分别检查 ONNX 输入输出、RKNN 转换日志、板端初始化和目标输出，把问题定位到最早发生偏差的阶段。","verify":"调试计划必须有具体输入数据和比较标准。"}],"diagnosis":[{"symptom":"模型无法初始化","reason":"转换与运行组件之间可能不兼容，也可能是文件损坏或目标 SoC 配置错误。","check":"记录详细返回码、Runtime/Driver 版本及 .rknn 创建来源。"},{"symptom":"可加载但结果错乱","reason":"前处理或输出张量属性不一致，不能仅据此断言驱动损坏。","check":"查询 shape、layout、dtype、量化 scale/zp，再逐阶段比对数值。"}],"case":{"problem":"模型在电脑模拟器上预测正确，但拷到 RK3588 后提示版本不匹配。应该先换芯片还是更新运行库？","analysis":"先确定版本链：工具链版本、模型目标平台、板端 runtime/driver 和 BSP。参考官方兼容指南制定升级或重新转换策略。不能只因为模型能在 PC 上跑，就认为任何旧固件都能加载。","evidence":"模型来源、目标参数、版本号、完整错误码和更改前后的对照日志。"},"snippet":"python3 -c \"import platform; print(platform.platform(), platform.machine())\"\n# 板端: uname -a; 开发机: python -V\n# Runtime / NPU 驱动版本应按对应板卡 SDK 查询。","refs":[["RKNN-Toolkit2 主仓库","https://github.com/airockchip/rknn-toolkit2"],["官方 SDK 文档目录","https://github.com/airockchip/rknn-toolkit2/tree/master/doc"],["RKNPU2 板端接口","https://github.com/rockchip-linux/rknpu2"]],"walkthrough":{"intro":"部署不是一个“执行转换”按钮，而是模型、转换器、运行库、输入协议与指标的有向依赖链。lesson_03.py 能根据真实完成状态生成 Graphviz DOT 并列出尚未完成的阶段。","flow":["ONNX 图检查","RKNN Toolkit2 转换","Driver/Runtime","预处理协议","实际推理","精度验收"],"steps":[{"api":"STAGES：明确各部署阶段责任","input":"六个阶段 onnx/convert/runtime/input/inference/accuracy","output":"每一阶段的输入产物与可观察验收点","why":"主机转换和目标板执行发生在不同环境，不能在转换阶段失败时先假定是 NPU 驱动问题。完整流程中“程序能跑”也不能替代任务精度合格。","code":"python3 examples/lesson_03.py --dot build/lesson03/pipeline.dot"},{"api":"--status：用布尔事实标记进展","input":"可选 JSON 映射，如 {'onnx':true,'convert':false}","output":"completed 和 remaining 两组阶段","why":"脚本不联网也不运行 SDK；它只把已经实测的状态画成图。未提供的阶段默认未完成，不能因文件存在就自动勾选为成功。","code":"printf '{\"onnx\":true,\"convert\":false}' > /tmp/rknn_status.json\npython3 examples/lesson_03.py --status /tmp/rknn_status.json --dot build/lesson03/pipeline.dot"},{"api":"DOT 文件：将流程可视化并定位失败位置","input":"有向依赖与完成状态","output":"可由 Graphviz 转成 PNG 的流程图","why":"绿框代表手动给出的已完成状态，不是 GitHub CI 对硬件自动验证的结论；图中每条箭头是模型与数据协议的依赖关系。","code":"dot -Tpng build/lesson03/pipeline.dot -o build/lesson03/pipeline.png"}],"example":"若 ONNX 与转换已完成，但 Runtime/驱动未确认，则部署图依然包含未完成阶段，不能把这个 RKNN 文件视为在 ROCK 5B 上已能推理。","acceptance":"交一张有六阶段的依赖图，并给出每一项需要的实际证据、PC/板端工作归属与下一步实验。"},"guidance":{"phases":[{"title":"说清输入与运行环境","action":"先口述六个阶段发生在 PC 还是板端，再使用程序画图；没有实测的阶段均保持未完成。","command":"","observe":"课前核查：本讲的输入对象是 六个阶段 onnx/convert/runtime/input/inference/accuracy；输出应是 每一阶段的输入产物与可观察验收点。","diagnose":"状态 JSON 报 unknown steps 或类型错误时，确保键只用六个已定义阶段且值为 true/false。","teach":"先让学习者区分准备条件与可观察结果。"},{"title":"现场执行本讲最小实验","action":"在仓库根目录执行下面的命令；需要模型、图片或 SDK 的路径必须换成实际文件。","command":"python3 examples/lesson_03.py --dot build/lesson03/pipeline.dot","observe":"输出 completed/remaining 列表和带 onnx→convert→runtime→input→inference→accuracy 的 DOT 图。","diagnose":"状态 JSON 报 unknown steps 或类型错误时，确保键只用六个已定义阶段且值为 true/false。","teach":"逐项解释参数来源、输出路径及与上一环节的依赖。"},{"title":"用输出验证技术结论","action":"程序中的状态 JSON 是人工声明的实验事实，不是自动硬件测试；完成一项必须以输出文件、日志或数值为依据。建立明确的失败层级可以避免反复重装系统。","command":"python3 -c \"from pathlib import Path; s=Path('build/lesson03/pipeline.dot').read_text(); print('onnx -> convert' in s)\"","observe":"假设 ONNX 检查和 RKNN 导出成功，但板端 init_runtime 返回非零。这只能证明前两项通过，不能勾选推理或精度；应登记 target、Toolkit2 release、librknnrt.so、NPU driver、模型 SHA256 和错误码。画成有向图能直观呈现哪个依赖尚未验证。 本实验的结论仍以实际输出为准。","diagnose":"交一张有六阶段的依赖图，并给出每一项需要的实际证据、PC/板端工作归属与下一步实验。","teach":"要求学习者解释观察结果的边界，不拿纯主机实验冒充板端 NPU 实测。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
