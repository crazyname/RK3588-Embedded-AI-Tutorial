<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mobilenet模型部署｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":27,"title":"mobilenet模型部署","intro":"以 MobileNet 完成可运行的 RK3588 图像分类工程。","goals":["掌握分类模型在板端的预处理与后处理","通过 CMake 构建并运行示例","分析模型输入输出张量和 top-k 分类结果"],"core":"MobileNet 常用于移动端分类。完整过程包含图片读取、色彩通道调整、尺寸缩放、归一化、RKNN 推理、分类得分解析和类别标签映射。模型文件后缀、原始权重、标签数目、label 顺序都必须一致，避免输出看似正常但类别错位。","steps":["选择已验证的 MobileNet RKNN 模型与标签表","核对输入 shape、RGB/BGR、归一化、量化方式","准备 C/C++ 项目，链接正确架构的 RKNN 运行时","部署模型与测试图片，编译并在 RK3588 上运行","实现输出反量化（如需要）、top-k 和类别名称打印","使用多张已知类别图片对比原框架与板端预测"],"pitfalls":["ImageNet 标准化仅适用于采用该训练预处理的模型","输出索引映射错误会导致标签错误","仅凭单张图片不能评价总体准确率"],"checks":["程序能输出合理的前几名类别及得分","能解释张量 dtype、scale、zero point 的作用"],"homework":["把模型、图片、label 文件改成可配置的命令行参数"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"MobileNet 是怎样的小型分类网络","explain":"MobileNet 系列面向移动端与嵌入式设备，其中 Depthwise Separable Convolution 将普通卷积分解为逐通道空间卷积和通道混合点卷积，常能显著减少计算量。输入通常是固定尺寸的 RGB 图像，输出是分类 logits 或 scores。具体输入尺寸、预处理和类别数应查模型文件与训练定义。","takeaway":"能说明 Depthwise 与 Pointwise 作用以及为什么它们能减算量。"},{"title":"分类前处理与标签协议","explain":"训练侧的 resize/crop、RGB、mean/std 和 tensor layout 必须在 RK3588 上等价实现。模型输出值的大小可用于选取 top-k，但不等于‘任意最大索引对应你想象的类别’。标准 ImageNet 可能使用 1000 个类别，标签文件仍必须与具体训练模型一一对应。","takeaway":"一个完整结果包含类别索引、标签来源、分数及对应原图。"},{"title":"先 Python 再 C++","explain":"按 Model Zoo 自带的 MobileNet 示例做 PyTorch/ONNX/RKNN 的结果比对，再在板端执行官方 Python/C++ 推理。较好的自学顺序是：固定样例图→输出 shape 与 top-k→替换本地图片→用不同前处理验证错误。","takeaway":"确保输入图像原始文件和预处理后 tensor 可复用到后续封装课程。"}],"lab":[{"title":"获取官方样例","action":"选择 RKNN Model Zoo 的 MobileNet 目录，记录模型文件、输入 shape、对应 label 列表。","verify":"保证模型和示例后处理来自同一仓库版本。"},{"title":"输出 top-5","action":"使用官方示例在可用板端加载模型，打印五个最高分数对应的索引与标签。","verify":"保存原图、tensor 属性和 top-5 结果。"},{"title":"变换输入验证","action":"分别尝试正确 RGB 和错误 BGR（仅用于对照），观察同图分类输出差异。","verify":"解释为什么通道错误可能影响分类，实验后恢复正确配置。"}],"diagnosis":[{"symptom":"分类最高分不对应真实物体","reason":"输入归一化、颜色或 labels 顺序错误。","check":"核对模型官方前处理与标签索引，复用固定测试图。"},{"symptom":"MobileNet 明明小但 FPS 不高","reason":"CPU 图片解码或复制占比高、频率/运行库不匹配。","check":"分别测模型推理与完整文件输入到分类输出的耗时。"}],"case":{"problem":"MobileNet 输出的索引 283 被程序打印为‘狗’，但同版本标签表指向其他类别。是否要重新训练模型？","analysis":"先检查 label 列表是否为模型专用、是否存在从 0 还是从 1 开始的偏移，再看输出 shape 和前处理。很多此类问题不需要重新训练。","evidence":"模型来源、标签文件来源、索引映射与输出数值。"},"snippet":"import numpy as np\nscores=np.array([0.2,2.5,1.1,-0.3],dtype=np.float32)\nidx=np.argsort(scores)[::-1][:3]\nprint([(int(i),float(scores[i])) for i in idx])\n# 示例演示 top-k 排序，不是实际 MobileNet 推理数据。","refs":[["RKNN Model Zoo MobileNet","https://github.com/airockchip/rknn_model_zoo/tree/main/examples/mobilenet"],["《动手学深度学习》MobileNet 等卷积网络原理","https://d2l.com.cn/"],["ONNX Model Zoo","https://github.com/onnx/models"]],"walkthrough":{"intro":"本讲的真实模型主线在 examples/lesson_27.py：同一张图片分别交给 ONNX Runtime（PC）和 RKNNLite（ROCK 5B），不是用随机分数假装 MobileNet。","flow":["真实图片","颜色/裁剪/归一化/layout","ONNX 或 RKNN","类别 logits","Top-5 + 标签"],"steps":[{"api":"prepare_image()：模型前处理协议","input":"PIL 图片、resize、RGB/BGR、NCHW/NHWC、normalize","output":"模型预期的 batch 张量","why":"ONNX 版可能需要 float32 NCHW/ImageNet 归一化；RKNN 版常把 mean/std 编入模型，接收 uint8 HWC。这两个输入协议不能直接混用。","code":"x = prepare_image(path, 224, 224, 'squash', 'RGB',\n                  'NCHW', 'imagenet', 'onnx')\nprint(x.shape, x.dtype)"},{"api":"run_model()：区分后端","input":"model.onnx 或 model.rknn + 对应输入","output":"真实输出张量（可保存 NPZ）","why":"ONNX Runtime CPU 输出是 PC 参考；RKNNLite 需 ROCK 5B Runtime。比较输出之前先保证两者输入像素含义一致。","code":"python3 examples/lesson_27.py --backend onnx \\\n  --model /path/to/model.onnx --image /path/to/test.jpg \\\n  --width 224 --height 224 --topk 5"},{"api":"probabilities()：区分 logits 与概率","input":"一维输出分数及 --scores 约定","output":"必要时 softmax 后的归一化概率","why":"若输出已经是概率，再进行 softmax 会改变分布；类别索引映射也必须使用对应 labels 文件和正确 offset。","code":"p = np.exp(logits - logits.max())\np = p / p.sum()\n# 只在输出为 logits 时执行 softmax"}],"example":"典型 ImageNet 预处理示例：单个 RGB 红通道值 128，若 x/255 再减均值 0.485、除标准差 0.229，结果约为 0.074；但模型若自带归一化则不要重复。","acceptance":"提供实际单图 Top-5 和标签、图像缩放/归一化选择，并把 PC 与 ROCK 5B 结果标成不同后端，不能拿两个随机输入比差异。"}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
