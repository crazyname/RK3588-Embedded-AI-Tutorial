<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>yolov26模型部署(从0到1版) · 数据集构建与模型训练｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":31,"title":"yolov26模型部署(从0到1版) · 数据集构建与模型训练","intro":"构建安全帽检测数据集并完成训练与指标评估。","goals":["理解图片/视频素材处理与标签标注","正确组织训练/验证集和 YAML 配置","读取训练曲线与模型验证结果"],"core":"本节按“采集素材 → 必要时视频抽帧 → 标注目标框 → 数据集划分 → 配置数据集 → 训练 → 验证”的顺序开展。常见 YOLO 检测标注格式为 `class_id x_center y_center width height`（框坐标通常归一化到 0–1），具体应以使用的训练框架为准。安全帽检测要保持 `helmet` 和 `no_helmet` 的类别映射一致。验证集应尽量独立于训练视频片段，避免近似重复帧导致指标虚高。","steps":["采集并筛选合法可用的图片/视频；从视频按间隔抽帧","使用标注工具绘制目标框、分配类 ID，审阅漏标与重叠框","组织 images/train、images/val、labels/train、labels/val 等目录","按实际文件路径创建 data.yaml，检查类别数量和名称","根据硬件情况设置 epochs、imgsz、batch、workers、device 和 early stopping","运行训练并保存最优权重、训练日志、P/R、mAP 和混淆矩阵","选独立测试图检查误报、漏报和困难样本"],"pitfalls":["训练集与验证集不应包含几乎完全相同的视频相邻帧","小数据集的高准确率不必然代表真实场景泛化能力","修改类别顺序后必须同步修改标注与 YAML"],"checks":["图片与标签能一一匹配且类别索引正确","产出训练权重及可复现的评估指标"],"homework":["对 20 张以上已核对的演示图制作数据质量检查记录"],"code":"# 仅示例，请换成项目实际目录\npath: /path/to/helmet_dataset\ntrain: images/train\nval: images/val\nnames:\n  0: helmet\n  1: no_helmet"}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"数据集质量决定部署上限","explain":"训练集数量大不是唯一因素，更重要的是场景覆盖、标注正确、负样本和异常光照/遮挡/小目标等难例。拍摄同一段视频后连续抽帧，邻近帧高度相似，如果随机分到训练/验证，会产生数据泄漏并夸大效果。应按视频、设备、采集场景等组切分，而不是逐帧随机打散。","takeaway":"保留与训练分布不同的独立测试集，用它衡量真实泛化。"},{"title":"YOLO 检测标签与 data.yaml","explain":"常见 YOLO 检测标注一行包含 class_id x_center y_center width height，四个坐标相对于图像宽高归一化。`data.yaml` 维护 train/val 路径和类别 names。原始坐标换算后必须确保中心点与尺寸落在允许范围内，类别 ID 与 names 顺序一致；空标注、错误类标和漏标都影响训练。","takeaway":"在训练前随机可视化几十张带框样本，检查类别、坐标和边界。"},{"title":"训练指标与实验管理","explain":"训练应保存基础超参数如 epoch、batch、imgsz、seed、数据版本和权重初始化来源。验证主要关注 mAP50-95、每类 precision/recall、混淆样本，以及针对实际应用的小目标和遮挡条件的表现。最佳权重应以验证指标选取，再用独立测试集复评。","takeaway":"将训练日志、曲线、数据划分和 best.pt hash 归档，使下一步模型导出可复现。"}],"lab":[{"title":"创建小型标注集","action":"选定具有许可的目标检测照片，手工标注至少两个类别，建立 images/train/val 与对应 labels 目录。","verify":"类别名与 class id 一致，标注框没有明显偏移。"},{"title":"防泄漏切分","action":"如果数据来自视频，按来源视频或采集日期分组后划分 train、val、test，并检查相邻帧不跨集合。","verify":"能指出每个集合代表的场景，避免重复片段造成虚高分数。"},{"title":"执行小规模训练","action":"根据 Ultralytics 版本使用 `model.train(data=..., epochs=..., imgsz=...)`，保存训练/验证指标与最优权重。","verify":"得到了可追溯的 best.pt、训练配置、失败样例和验证集报告。"}],"diagnosis":[{"symptom":"训练 mAP 很高，部署时常漏检","reason":"验证集与训练集高度相似或部署背景差异大。","check":"做按场景分组的独立测试并检查难例覆盖。"},{"symptom":"检测框显示到奇怪位置","reason":"标注不是归一化 xywh、类别 id 错或图片与标签文件错配。","check":"随机可视化原图标注并检查数值范围与目录结构。"}],"case":{"problem":"你从同一段视频每秒抽 30 帧，随机把 80% 训练、20% 验证，最后 mAP 高达 0.99。能直接宣称工业可用吗？","analysis":"不行。时间相邻的帧内容非常相似，验证结果可能受到数据泄漏影响。应该按视频/摄像头/日期分组切分，并在独立场景验证遮挡、光照和小目标。","evidence":"切分清单、每类样本统计、可视化标注、独立测试集 mAP。"},"snippet":"# data.yaml（路径需与实际数据组织匹配）\npath: ./dataset\ntrain: images/train\nval: images/val\nnames:\n  0: helmet\n  1: person\n# YOLO 标签每行：class x_center y_center width height（归一化）","refs":[["Ultralytics 数据集格式","https://docs.ultralytics.com/datasets/detect/"],["Ultralytics 训练文档","https://docs.ultralytics.com/modes/train/"],["《动手学深度学习》目标检测","https://d2l.com.cn/"]],"walkthrough":{"intro":"第 30 讲专题二以数据质量为主，先检查 YOLO 标注，再考虑真实训练；框合法不等于数据集没有重复图、泄漏或标错类别。","flow":["图片 + labels/*.txt","标注边界检查","data.yaml 切分","实际 YOLO 训练","best.pt + 验证指标"],"steps":[{"api":"YOLO 文本标注：归一化坐标","input":"一行 class x_center y_center width height","output":"中心点与宽高均在 [0,1] 且框在图内","why":"例如 0 0.5 0.5 0.4 0.2 对应 x1=0.3、y1=0.4、x2=0.7、y2=0.6；转换回像素必须乘图片原始宽高。","code":"0 0.5 0.5 0.4 0.2"},{"api":"lesson_31.audit()：先检查而非先训练","input":"--labels 指向真实训练集标签目录","output":"label_files、valid_boxes、errors","why":"脚本检查一行五字段和框是否越界。它不负责识别图片内容，也不能判断标签类别是否被人工标错。","code":"python3 examples/lesson_31.py \\\n  --labels /path/to/dataset/labels/train \\\n  --report build/lesson31/audit.json"},{"api":"YOLO.train：需要 data.yaml 与真实权重","input":"train/val 图片标签对应关系、data.yaml、预训练 .pt","output":"真实训练工件和独立验证集指标","why":"保证 train/val/test 没有近重复泄漏，类别 names 与标注 id 一一对应。高训练 mAP 不能保证 RK3588 模型转换兼容。","code":"python3 examples/lesson_31.py --labels /path/to/labels/train \\\n  --data /path/to/data.yaml --weights /path/to/base.pt \\\n  --epochs 10 --train"}],"example":"示例标签 0 0.5 0.5 0.4 0.2 画在 1000×500 图片上应是 (300,200,700,300)。训练前随机可视化几张标签与原图，确认没有错位。","acceptance":"PC 提交真实标注质量报告和训练权重，记录独立 val/test 指标；未训练时可验收标注检查，但不能勾选训练完成。"}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
