<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>yolov26模型部署(从0到1版) · 数据集构建与模型训练｜RK3588 HTML 教学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":31,"title":"yolov26模型部署(从0到1版) · 数据集构建与模型训练","intro":"构建安全帽检测数据集并完成训练与指标评估。","goals":["理解图片/视频素材处理与标签标注","正确组织训练/验证集和 YAML 配置","读取训练曲线与模型验证结果"],"core":"本节按“采集素材 → 必要时视频抽帧 → 标注目标框 → 数据集划分 → 配置数据集 → 训练 → 验证”的顺序开展。常见 YOLO 检测标注格式为 `class_id x_center y_center width height`（框坐标通常归一化到 0–1），具体应以使用的训练框架为准。安全帽检测要保持 `helmet` 和 `no_helmet` 的类别映射一致。验证集应尽量独立于训练视频片段，避免近似重复帧导致指标虚高。","steps":["采集并筛选合法可用的图片/视频；从视频按间隔抽帧","使用标注工具绘制目标框、分配类 ID，审阅漏标与重叠框","组织 images/train、images/val、labels/train、labels/val 等目录","按实际文件路径创建 data.yaml，检查类别数量和名称","根据硬件情况设置 epochs、imgsz、batch、workers、device 和 early stopping","运行训练并保存最优权重、训练日志、P/R、mAP 和混淆矩阵","选独立测试图检查误报、漏报和困难样本"],"checks":["图片与标签能一一匹配且类别索引正确","产出训练权重及可复现的评估指标"],"pitfalls":["训练集与验证集不应包含几乎完全相同的视频相邻帧","小数据集的高准确率不必然代表真实场景泛化能力","修改类别顺序后必须同步修改标注与 YAML"],"homework":["对 20 张以上已核对的演示图制作数据质量检查记录"],"code":"# 仅示例，请换成项目实际目录\npath: /path/to/helmet_dataset\ntrain: images/train\nval: images/val\nnames:\n  0: helmet\n  1: no_helmet"}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
