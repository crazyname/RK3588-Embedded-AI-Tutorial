<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备端npu环境搭建与npu驱动更新｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":6,"title":"设备端npu环境搭建与npu驱动更新","intro":"核对 RK3588 开发板固件与 NPU 运行时。","goals":["辨认 NPU 驱动和 librknnrt 用户态运行时","掌握更新前备份、验证和回退原则","检查驱动加载与运行时日志"],"core":"模型推理依赖 RKNPU 内核驱动、用户态运行时及匹配的 `.rknn` 模型。更换驱动通常涉及板卡厂商的 BSP、设备树、内核或完整镜像，不应直接使用其他型号开发板的固件。课程演示了版本检查、系统编译与运行库更新；具体步骤强烈依赖板卡厂商系统。","steps":["记录开发板型号、固件、内核版本、驱动版本","备份原镜像、模型和用户数据并确认可刷机回退","查阅厂商 BSP/固件说明，核对新驱动与运行时的兼容性","按厂商说明更新后重启并查看 dmesg/版本节点","用已知正确的 demo 验证 NPU 推理"],"pitfalls":["更新驱动有造成系统无法启动的风险；务必先做好恢复方案","debugfs 驱动版本路径随 BSP 不同","编译系统前要避免 Conda 环境变量污染工具链"],"checks":["记录版本链：Toolkit → RKNN 模型 → runtime → driver","能说明固件回滚流程"],"homework":["整理一份板端环境验收与回退清单"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"区分硬件驱动与运行时库","explain":"RK3588 上的 RKNN 应用需要板级 BSP/内核中的 NPU 驱动，以及可在 ARM64 上调用的 `librknnrt.so` 用户态运行库。驱动版本可以通过内核日志或板商文档核对，运行时版本可从官方工具接口、动态库版本或示例日志获取。两者与模型生成器构成兼容链；随意替换单个 `.so` 不一定正确。","takeaway":"故障排查至少记录固件、Kernel、驱动、Runtime、Toolkit2 五个信息。"},{"title":"固件升级有恢复风险","explain":"NPU 驱动常随内核/BSP 更新，不应把某篇教程的驱动二进制复制到另一块板。刷错分区、dtb 或镜像可能导致系统无法启动。升级前确认板卡确切型号、eMMC/SD 启动方式、厂商镜像及 Maskrom/恢复通道，并备份重要数据。","takeaway":"先有完整恢复步骤，再执行任何会改写引导区或内核的操作。"},{"title":"动态链接和架构","explain":"应用程序在启动时需找到合适架构的动态库；即便库文件存在，路径错误或 ELF 架构不符也可能导致加载失败。`file`、`ldd` 或 `readelf` 有助于定位：开发主机 x86_64 库无法直接作为目标板 aarch64 运行库。","takeaway":"明确“找不到库”“库架构错误”“运行时加载模型报错”是三类问题。"}],"lab":[{"title":"读取系统信息","action":"在板端收集 `uname -a`、`uname -m` 与系统镜像版本，保存 `dmesg` 中与 NPU 相关的记录。","verify":"能够说明当前设备加载了什么内核，以及日志有没有驱动错误。"},{"title":"核对运行库","action":"用 `file` 或 `readelf -h` 查看实际路径下的 `librknnrt.so`，检查其 ELF 架构及应用依赖。","verify":"二进制架构与板端匹配，加载时可找到所需共享库。"},{"title":"规划安全升级","action":"根据厂商 BSP 说明写出镜像来源、校验、备份、烧录与回退流程；没有设备恢复方案时停止于文档演练。","verify":"教师或本人能够明确指出失败后如何恢复系统。"}],"diagnosis":[{"symptom":"error while loading shared libraries","reason":"动态链接器未找到所需 `.so` 或依赖。","check":"先看 `ldd` 和实际库路径，避免把 x86_64 库复制到 aarch64。"},{"symptom":"驱动/API 版本不兼容","reason":"Toolkit2 生成模型与运行时或内核组合不符合支持条件。","check":"保存错误码和相关 SDK 版本，优先按板厂兼容矩阵评估升级。"}],"case":{"problem":"有人建议把互联网下载的 NPU ko 直接 insmod 到你不知道 BSP 版本的开发板。应该做吗？","analysis":"不应该。内核模块依赖内核版本、符号和具体板级配置，即便加载成功也可能导致系统不稳定。应先检查厂商固件与匹配的驱动源码/镜像，并准备恢复路径。","evidence":"板卡型号、uname -a、厂商 BSP 页面、驱动日志与备份计划。"},"snippet":"uname -a\nuname -m\ndmesg | grep -Ei 'rknpu|npu' | tail -n 30\n# 只读检查；不要随意刷写未知固件。","refs":[["RKNPU2 运行接口与目标设备说明","https://github.com/rockchip-linux/rknpu2"],["新版 RKNN SDK 文档","https://github.com/airockchip/rknn-toolkit2/tree/master/doc"],["《深入理解计算机系统》链接与加载章节","https://www.pearson.com/en-us/subject-catalog/p/computer-systems-a-programmers-perspective/P200000003479"]],"walkthrough":{"intro":"第 06 讲只读检查板端 NPU 节点、内核、RKNN Runtime 架构及驱动信息。驱动更新属于有风险的 BSP 工作，本课程 P0 不要求盲目刷固件。","flow":["ROCK 5B 镜像/内核","/dev/*rknpu*","匹配 ARM64 librknnrt.so","Lite2/C API","实际 NPU 推理"],"steps":[{"api":"lesson_06.py：检查可见设备与 Runtime","input":"目标 Linux 系统；可选 --runtime 指定真实共享库","output":"kernel、machine、device_nodes、Runtime 路径与 ELF 文件描述","why":"不能把 x86_64 host librknnrt.so 当成 ARM64 target library。节点未显示时也可能是命名或权限差异，应结合设备树和 BSP 文档。","code":"python3 examples/lesson_06.py --runtime /actual/arm64/librknnrt.so --output build/lesson06/npu.json"},{"api":"区分用户态 Runtime 与内核驱动","input":"librknnrt.so 版本、/dev 节点、内核和 NPU 驱动","output":"硬件/驱动/运行库三个层面的记录","why":"仅能 import rknnlite 或找到动态库，不代表该 Runtime 能与当前 kernel/BSP 驱动正常协作。使用实际模型完成一次初始化和 inference 才能闭环。","code":"uname -a\nls -l /dev/*rknpu* 2>/dev/null || true\nfile /actual/arm64/librknnrt.so"},{"api":"系统升级必须有板商版本与恢复路线","input":"板卡实际 BSP/镜像、可用 SDK release 与供电/恢复准备","output":"兼容性核对后的变更计划（不是自动升级）","why":"不要为了跑教程直接替换 .ko、dtb 或频率配置。出现初始化错误，先比对驱动/API/模型 release，能读取版本不等于驱动应当更新。","code":"python3 boards/radxa-rock5b/tools/board_probe.py --output build/lesson06/board_probe.json"}],"example":"同一板卡若 kernel/BSP 与用户态 librknnrt.so 来自不兼容发行版，load_rknn 或 init_runtime 可能失败；先检查版本匹配，不修改驱动来“碰运气”。","acceptance":"在实际设备保存只读版本信息与真实可见节点；若无实体板卡，只能完成查询逻辑学习，不能勾选 NPU 环境验收。"},"guidance":{"phases":[{"title":"确认准备条件与输入协议","action":"先确认执行位置是 ROCK 5B 还是 PC；若提供 runtime，必须是当前系统上真实存在的共享库路径。","command":"","observe":"首个关键步骤处理 目标 Linux 系统；可选 --runtime 指定真实共享库，输出应为 kernel、machine、device_nodes、Runtime 路径与 ELF 文件描述。","diagnose":"`--runtime` 文件不存在时先核对板商 SDK 安装路径；无节点时检查 BSP 和权限，不执行未知刷机命令。","teach":"先检查前置条件，不能凭假设跳过环境核对。"},{"title":"教师演示最小可运行命令","action":"从仓库根目录运行。/path/to 路径和外部 SDK 必须是真实文件及兼容环境。","command":"python3 examples/lesson_06.py --output build/lesson06/npu.json","observe":"在真实 Linux 机器上输出 kernel、machine、可见 NPU 节点；没有 --runtime 则 runtime 字段为空。","diagnose":"`--runtime` 文件不存在时先核对板商 SDK 安装路径；无节点时检查 BSP 和权限，不执行未知刷机命令。","teach":"逐项说明参数、输出文件位置和软件层次。"},{"title":"学生解释结果并独立验收","action":"本章优先完成只读审计，必要的升级动作属于另一个受控实验。真实验收至少包含镜像/内核、驱动与运行库版本及一张真实模型推理的返回码和输出。","command":"python3 -c \"import json; d=json.load(open('build/lesson06/npu.json')); print(d['machine'],d['device_nodes'])\"","observe":"假设板上 `uname -m=aarch64`、共享库 ELF 为 x86-64，即可在初始化前认定架构不符；若 ELF 正确但 NPU 节点缺失，应进一步查设备树与 BSP 日志，而不是把一份不明 `.ko` 直接复制到 `/lib/modules`。驱动升级前保留可启动介质、系统镜像与恢复方案。","diagnose":"在实际设备保存只读版本信息与真实可见节点；若无实体板卡，只能完成查询逻辑学习，不能勾选 NPU 环境验收。","teach":"结合实际输出解释因果，记录未通过项；PC 数据不能冒充 ROCK 5B 实测。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
