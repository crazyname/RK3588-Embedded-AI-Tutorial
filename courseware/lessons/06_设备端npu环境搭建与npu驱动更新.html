<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备端npu环境搭建与npu驱动更新｜RK3588 HTML 教学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":6,"title":"设备端npu环境搭建与npu驱动更新","intro":"核对 RK3588 开发板固件与 NPU 运行时。","goals":["辨认 NPU 驱动和 librknnrt 用户态运行时","掌握更新前备份、验证和回退原则","检查驱动加载与运行时日志"],"core":"模型推理依赖 RKNPU 内核驱动、用户态运行时及匹配的 `.rknn` 模型。更换驱动通常涉及板卡厂商的 BSP、设备树、内核或完整镜像，不应直接使用其他型号开发板的固件。课程演示了版本检查、系统编译与运行库更新；具体步骤强烈依赖板卡厂商系统。","steps":["记录开发板型号、固件、内核版本、驱动版本","备份原镜像、模型和用户数据并确认可刷机回退","查阅厂商 BSP/固件说明，核对新驱动与运行时的兼容性","按厂商说明更新后重启并查看 dmesg/版本节点","用已知正确的 demo 验证 NPU 推理"],"checks":["记录版本链：Toolkit → RKNN 模型 → runtime → driver","能说明固件回滚流程"],"pitfalls":["更新驱动有造成系统无法启动的风险；务必先做好恢复方案","debugfs 驱动版本路径随 BSP 不同","编译系统前要避免 Conda 环境变量污染工具链"],"homework":["整理一份板端环境验收与回退清单"],"code":""}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
