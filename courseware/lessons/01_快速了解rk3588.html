<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快速了解rk3588｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":1,"title":"快速了解rk3588","intro":"从 SoC 架构理解每个处理单元的职责。","goals":["认识 CPU 大小核、NPU、GPU、ISP 与 RGA","区分理论参数与实际业务性能","学会查阅芯片/板卡资料"],"core":"RK3588 采用 4 个 Cortex-A76 与 4 个 Cortex-A55 CPU 核，集成 NPU、GPU、RGA、ISP、多媒体编解码以及丰富的高速接口。RK3588 NPU 常见标称算力为 6 TOPS（INT8 理论峰值），实际模型 FPS 还取决于算子、数据预处理、内存带宽、频率和温度。RGA 常承担图像缩放和格式转换，NPU 负责受支持的神经网络推理，CPU 负责调度及其他逻辑。","steps":["在产品规格书中识别 CPU、NPU、GPU、RGA、ISP","对照自己的开发板，列出实际具备的摄像头、显示和网络接口","绘制摄像头采集 → 预处理 → NPU 推理 → 后处理 → 显示的数据通路"],"pitfalls":["理论 TOPS 不是可直接承诺的 FPS","芯片规格、板卡原理图、固件支持范围要分别检查"],"checks":["能说明为何有 NPU 不代表整个程序都在 NPU 运行","能区分芯片支持接口和具体开发板已引出的接口"],"homework":["制作 RK3588 计算单元及其典型任务对应表"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"认识 SoC 的计算分工","explain":"RK3588 是集成多种功能的 SoC：CPU 执行 Linux、应用逻辑、控制与部分前后处理；GPU 面向图形与通用并行负载；NPU 专注受支持神经网络算子的高吞吐执行。RGA、视频编解码和 ISP 可能承担图像相关工作，能否使用需核对板卡接口和 BSP。一个项目的快慢不能仅看 NPU。","takeaway":"首先找出任务路径中‘谁执行、数据在哪、是否发生复制’，再讨论加速。"},{"title":"6 TOPS 的含义","explain":"TOPS 是理论每秒运算次数指标，常按 INT8、特定计数口径与理想条件宣传。它不表示任意网络都达到同样利用率，更不是视频帧率。计算数据搬运、算子支持、内存带宽和 CPU 后处理都可能成为瓶颈；NPU 多核也不能保证任何模型线性加速。","takeaway":"正确报告应同时说明模型、输入 shape、dtype、核数、运行条件与实测 FPS。"},{"title":"RK3588 与 RK3588S","explain":"具体板卡的接口数量、摄像头接入、显示输出、内存容量、散热和电源实现取决于 SoC 型号与板级设计。即便两块板使用相同芯片，不同的内核、固件和运行库也可能影响驱动行为。不要仅凭网上某一张芯片图推断自己的板卡外设。","takeaway":"把 SoC 数据手册、板级原理图与实际系统输出分开记录。"}],"lab":[{"title":"确认内核与架构","action":"在开发板 Linux 终端运行 uname -a、uname -m、cat /etc/os-release，记录操作系统与 CPU 架构。","verify":"输出中应能看到具体架构和系统信息；ARM64 常见标识是 aarch64。"},{"title":"观察硬件资源","action":"结合板商说明和 dmesg 消息确认摄像头、显示和 NPU 相关驱动；不对未知 sysfs 节点执行写入。","verify":"记录存在的设备节点、驱动信息及与说明书不一致的部分。"},{"title":"绘制业务分工","action":"将摄像头检测划分为采集、图像 resize/letterbox、推理、解码、NMS、绘制和编码，判断各阶段可能运行在哪个单元。","verify":"能够解释为什么提升 NPU 算力不会消除所有瓶颈。"}],"diagnosis":[{"symptom":"看到 6 TOPS 就认为一定超过 200 FPS","reason":"混淆理论运算吞吐与端到端任务帧率。","check":"用目标模型的实际运行耗时，加上采集和后处理耗时做预算。"},{"symptom":"同型号芯片板卡外设不同","reason":"误把 SoC 规格当成板级实际布线与设备树配置。","check":"比较板卡型号、原理图、BSP、设备树和系统识别结果。"}],"case":{"problem":"一套检测系统 NPU 推理只需 8ms，但实际只有 25FPS。应该再换一个更快的 NPU 吗？","analysis":"先用分段计时测出采集、图像转换、推理、NMS、绘制与显示。例如处理总成本可能达 40ms；单纯把 8ms 压缩为 4ms，整体改善仍有限。这是端到端优化而非单点‘TOPS 军备竞赛’。","evidence":"分段耗时表与总体 FPS，需要保持相同分辨率和输入源。"},"snippet":"uname -m\nuname -a\ncat /etc/os-release\n# 查看信息后再结合板卡原理图辨认外设。","refs":[["RK3588 NPU 工具链与平台说明","https://github.com/airockchip/rknn-toolkit2"],["RKNN Model Zoo 性能表","https://github.com/airockchip/rknn_model_zoo"],["《深入理解计算机系统》出版信息","https://www.pearson.com/en-us/subject-catalog/p/computer-systems-a-programmers-perspective/P200000003479"]]}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
