<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快速了解rk3588｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":1,"title":"快速了解rk3588","intro":"从 SoC 架构理解每个处理单元的职责。","goals":["认识 CPU 大小核、NPU、GPU、ISP 与 RGA","区分理论参数与实际业务性能","学会查阅芯片/板卡资料"],"core":"RK3588 采用 4 个 Cortex-A76 与 4 个 Cortex-A55 CPU 核，集成 NPU、GPU、RGA、ISP、多媒体编解码以及丰富的高速接口。RK3588 NPU 常见标称算力为 6 TOPS（INT8 理论峰值），实际模型 FPS 还取决于算子、数据预处理、内存带宽、频率和温度。RGA 常承担图像缩放和格式转换，NPU 负责受支持的神经网络推理，CPU 负责调度及其他逻辑。","steps":["在产品规格书中识别 CPU、NPU、GPU、RGA、ISP","对照自己的开发板，列出实际具备的摄像头、显示和网络接口","绘制摄像头采集 → 预处理 → NPU 推理 → 后处理 → 显示的数据通路"],"pitfalls":["理论 TOPS 不是可直接承诺的 FPS","芯片规格、板卡原理图、固件支持范围要分别检查"],"checks":["能说明为何有 NPU 不代表整个程序都在 NPU 运行","能区分芯片支持接口和具体开发板已引出的接口"],"homework":["制作 RK3588 计算单元及其典型任务对应表"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"认识 SoC 的计算分工","explain":"RK3588 是集成多种功能的 SoC：CPU 执行 Linux、应用逻辑、控制与部分前后处理；GPU 面向图形与通用并行负载；NPU 专注受支持神经网络算子的高吞吐执行。RGA、视频编解码和 ISP 可能承担图像相关工作，能否使用需核对板卡接口和 BSP。一个项目的快慢不能仅看 NPU。","takeaway":"首先找出任务路径中‘谁执行、数据在哪、是否发生复制’，再讨论加速。"},{"title":"6 TOPS 的含义","explain":"TOPS 是理论每秒运算次数指标，常按 INT8、特定计数口径与理想条件宣传。它不表示任意网络都达到同样利用率，更不是视频帧率。计算数据搬运、算子支持、内存带宽和 CPU 后处理都可能成为瓶颈；NPU 多核也不能保证任何模型线性加速。","takeaway":"正确报告应同时说明模型、输入 shape、dtype、核数、运行条件与实测 FPS。"},{"title":"RK3588 与 RK3588S","explain":"具体板卡的接口数量、摄像头接入、显示输出、内存容量、散热和电源实现取决于 SoC 型号与板级设计。即便两块板使用相同芯片，不同的内核、固件和运行库也可能影响驱动行为。不要仅凭网上某一张芯片图推断自己的板卡外设。","takeaway":"把 SoC 数据手册、板级原理图与实际系统输出分开记录。"}],"lab":[{"title":"确认内核与架构","action":"在开发板 Linux 终端运行 uname -a、uname -m、cat /etc/os-release，记录操作系统与 CPU 架构。","verify":"输出中应能看到具体架构和系统信息；ARM64 常见标识是 aarch64。"},{"title":"观察硬件资源","action":"结合板商说明和 dmesg 消息确认摄像头、显示和 NPU 相关驱动；不对未知 sysfs 节点执行写入。","verify":"记录存在的设备节点、驱动信息及与说明书不一致的部分。"},{"title":"绘制业务分工","action":"将摄像头检测划分为采集、图像 resize/letterbox、推理、解码、NMS、绘制和编码，判断各阶段可能运行在哪个单元。","verify":"能够解释为什么提升 NPU 算力不会消除所有瓶颈。"}],"diagnosis":[{"symptom":"看到 6 TOPS 就认为一定超过 200 FPS","reason":"混淆理论运算吞吐与端到端任务帧率。","check":"用目标模型的实际运行耗时，加上采集和后处理耗时做预算。"},{"symptom":"同型号芯片板卡外设不同","reason":"误把 SoC 规格当成板级实际布线与设备树配置。","check":"比较板卡型号、原理图、BSP、设备树和系统识别结果。"}],"case":{"problem":"一套检测系统 NPU 推理只需 8ms，但实际只有 25FPS。应该再换一个更快的 NPU 吗？","analysis":"先用分段计时测出采集、图像转换、推理、NMS、绘制与显示。例如处理总成本可能达 40ms；单纯把 8ms 压缩为 4ms，整体改善仍有限。这是端到端优化而非单点‘TOPS 军备竞赛’。","evidence":"分段耗时表与总体 FPS，需要保持相同分辨率和输入源。"},"snippet":"uname -m\nuname -a\ncat /etc/os-release\n# 查看信息后再结合板卡原理图辨认外设。","refs":[["RK3588 NPU 工具链与平台说明","https://github.com/airockchip/rknn-toolkit2"],["RKNN Model Zoo 性能表","https://github.com/airockchip/rknn_model_zoo"],["《深入理解计算机系统》出版信息","https://www.pearson.com/en-us/subject-catalog/p/computer-systems-a-programmers-perspective/P200000003479"]],"walkthrough":{"intro":"第 01 讲把 CPU、GPU、NPU、内存与板级系统的关系落到 Linux 可观察信息上。lesson_01.py 是只读板级信息检查，而不是通过 CPU 型号字符串推断 NPU 存在。","flow":["Linux 内核","/proc/device-tree/model","/proc/cpuinfo","/proc/meminfo","board.json"],"steps":[{"api":"设备树：确认实际板卡","input":"/proc/device-tree/model 与 compatible","output":"实际设备树型号字符串，可能为空","why":"Linux PC 通常没有 RK3588 设备树节点；读取不到不等于芯片损坏。ROCK 5B 应同时记录发行版、BSP、内核与芯片版本。","code":"python3 examples/lesson_01.py --output build/lesson01/board.json"},{"api":"区分 CPU 核数、DDR 与 NPU","input":"os.cpu_count()、/proc/meminfo 与 device-tree","output":"CPU 可见线程数和主机内存摘要","why":"CPU 核心数是操作系统可见的逻辑核数，不能用于推出 NPU TOPS。系统 RAM 也不等于全部可用于加载模型的连续可分配内存。","code":"python3 -c \"import os,platform; print('cores',os.cpu_count(),'arch',platform.machine())\""},{"api":"建立硬件软件分层图","input":"芯片型号、驱动与 RKNN SDK 的对应信息","output":"芯片/NPU 驱动/Runtime/应用层的依赖顺序","why":"NPU 算力是芯片硬件规格，设备驱动和 Runtime 是软件依赖。加载失败不能直接说明 NPU 不存在，需要确认板卡和运行时版本。","code":"python3 boards/radxa-rock5b/tools/board_probe.py --help"}],"example":"PC 上的 device_tree_model=null 是可预期现象；同一脚本在 ROCK 5B 实机运行后，才可将实际设备树型号用作硬件验收证据。","acceptance":"提交主机或板端只读 JSON，画出 CPU/DDR/NPU/Runtime 的关系，明确每个字段能证明什么、不能证明什么。"},"guidance":{"phases":[{"title":"说清输入与运行环境","action":"在准备验证的 Linux 系统上执行；记录是否为 PC 还是目标开发板。","command":"","observe":"课前核查：本讲的输入对象是 /proc/device-tree/model 与 compatible；输出应是 实际设备树型号字符串，可能为空。","diagnose":"没有 `/proc/device-tree/model` 时先检查是否在真实开发板或虚拟机，不推断驱动已经损坏。","teach":"先让学习者区分准备条件与可观察结果。"},{"title":"现场执行本讲最小实验","action":"在仓库根目录执行下面的命令；需要模型、图片或 SDK 的路径必须换成实际文件。","command":"python3 examples/lesson_01.py --output build/lesson01/board.json","observe":"打印 kernel、machine、device_tree_model、meminfo；在 PC 上设备树字段为空是可能的。","diagnose":"没有 `/proc/device-tree/model` 时先检查是否在真实开发板或虚拟机，不推断驱动已经损坏。","teach":"逐项解释参数来源、输出路径及与上一环节的依赖。"},{"title":"用输出验证技术结论","action":"初次核查遵循先只读识别、再版本兼容、最后真实模型推理的顺序。不要因为 NPU 设备节点不可见就立即刷机，也不要把 CPU 核数或标称 TOPS 换算为实际 FPS。","command":"python3 -c \"import json; x=json.load(open('build/lesson01/board.json')); print(x['machine'],x['device_tree_model'])\"","observe":"查看 `/proc/device-tree/model` 能确认当前 Linux 设备树所宣称的板型，却不能单凭它证明 NPU 已被正确驱动；`/proc/meminfo` 是系统内存信息，不是 NPU 单独显存。对于 ROCK 5B 16GB，还需记录 PCB revision、SD/eMMC 镜像版本及内核。 本实验的结论仍以实际输出为准。","diagnose":"提交主机或板端只读 JSON，画出 CPU/DDR/NPU/Runtime 的关系，明确每个字段能证明什么、不能证明什么。","teach":"要求学习者解释观察结果的边界，不拿纯主机实验冒充板端 NPU 实测。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
