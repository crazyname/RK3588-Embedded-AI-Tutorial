<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动态shape输入｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":21,"title":"动态shape输入","intro":"在受支持的输入尺寸集合中切换 RKNN 模型形状。","goals":["理解固定形状和动态形状的差别","完成可用 shape 的配置与验证","了解灵活性、内存和性能的权衡"],"core":"动态 shape 可减少为每个分辨率分别维护模型的需求，但 RKNN 工具链通常要求在转换时声明特定形状集合或支持范围，不代表可以使用任意宽高。课程对比了配置中声明的 shape 和未声明 shape 的实际报错，强调运行前应做输入校验。","steps":["核对源 ONNX 模型是否允许预期的形状变化","依据 SDK 对 RKNN 设置支持的输入形状列表","导出并检查 RKNN 模型的动态 shape 信息","逐一测试已声明形状并核对输出","输入未声明形状验证拒绝逻辑，并记录报错"],"pitfalls":["ONNX 动态维度不保证 RKNN 可处理任意分辨率","不同 shape 会影响 tensor 大小和吞吐"],"checks":["能列出所有实际允许的形状","业务程序能在推理前处理不支持的尺寸"],"homework":["设计固定 320、512、640 尺寸候选的动态输入选择逻辑，实际可用性需由 SDK 验证"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"静态尺寸与受限动态尺寸","explain":"动态 shape 意味着某些 tensor 维度可以变化，但在 RKNN 部署中是否支持、能变化到哪些规格、如何构建与选择，均依赖 SDK release、具体模型和目标 SoC。‘动态’不等于任意宽高无限制输入。很多硬件编译器会要求指定候选 shape 集合或对算子施加约束。","takeaway":"先看模型输入的实际支持集合，再调用运行接口。"},{"title":"布局和内存预算随 shape 改变","explain":"尺寸从 320×320 变为 640×640 时，空间像素数量扩大 4 倍，但总性能、内存和 NPU 时延不必然严格乘 4，因为算子结构、缓冲规划及融合也影响开销。不同分辨率可能改变目标检测的精度、感受野和后处理规模。","takeaway":"每个候选 shape 单独测准确率、输入 buffer 大小和延迟。"},{"title":"导出、转换、运行三阶段一致性","explain":"训练框架导出 ONNX 时若设置 dynamic，需确保下游算子、ONNX 图和 RKNN 转换器都能接受。最终以 RKNN 编译后的输入属性和实际运行接口为准，不能只根据 ONNX 符号维度判断板端支持。","takeaway":"使用明确的候选尺寸验证形状切换及输入/输出 buffer 生命周期。"}],"lab":[{"title":"读取 ONNX 形状","action":"使用 Netron/ONNX Python 打印 input 的 batch、高、宽，看是否是符号维度或固定整数。","verify":"能区分动态 ONNX 约束与 RKNN 的支持条件。"},{"title":"计划两个 shape","action":"针对同一模型设计 320 和 640 两套输入变换，计算输入 uint8 bytes 的变化。","verify":"宽高翻倍时原始同通道图像元素数增加四倍。"},{"title":"按官方指南验证","action":"若 SDK 当前支持动态 shape，使用其指定方式构建并分别运行每个支持规格。","verify":"记录每种 shape 的预处理、耗时、输出属性和正确性。"}],"diagnosis":[{"symptom":"shape 不在支持集合","reason":"编译时未声明或目标 SDK 未支持此形状。","check":"查询导出的 RKNN 属性与构建日志。"},{"symptom":"切换高分辨率后 OOM","reason":"中间激活 tensor 和 buffer 需求增加。","check":"测目标 shape 的 VmHWM 和 SDK 内存指标。"}],"case":{"problem":"你导出 dynamic=True 的 ONNX 后，RKNN 模型仍只接受 640×640。是 ONNX 无效吗？","analysis":"未必。ONNX 允许符号维度并不保证目标硬件编译器支持所有形状。需要按 SDK 的动态形状流程声明允许的规格，或者将源模型分别导出为固定尺寸构建。","evidence":"ONNX 输入维度、RKNN build 参数、实际报错以及成功的候选 shape。"},"snippet":"import numpy as np\nfor h,w in ((320,320),(640,640)):\n    x = np.zeros((1,h,w,3),dtype=np.uint8)\n    print(x.shape,x.nbytes)\n# 此处仅解释内存占用，不代表模型已支持动态 shape。","refs":[["ONNX Shape Inference","https://github.com/onnx/onnx/blob/main/docs/ShapeInference.md"],["RKNN-Toolkit2 文档","https://github.com/airockchip/rknn-toolkit2/tree/master/doc"]]}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
