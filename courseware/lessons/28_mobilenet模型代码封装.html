<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mobilenet模型代码封装｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":28,"title":"mobilenet模型代码封装","intro":"重构单文件 Demo，提高工程可维护性。","goals":["合理分离主程序、模型封装、预处理和后处理","定义稳定的推理接口和数据所有权","统一日志、错误处理与资源释放"],"core":"前一讲中的单文件分类 Demo 适合演示，但工程扩大后易出现模块耦合、重复逻辑、排查困难。将模型生命周期封装在对象/模块中，图像处理及业务后处理独立封装，主程序只承担参数读取和业务流程控制，可提升复用与调试效率。","steps":["划分当前代码中的模型初始化、图片读取、归一化、推理、分类输出与资源释放","定义推理类或 C 模块的接口，明确参数、返回值与所有权","将图像处理、模型推理、结果解码拆入独立文件","统一 CMakeLists、头文件目录、库依赖与资源目录","增加错误信息、输入输出属性、每阶段耗时日志","与原版相同图片对比分类结果，并在失败路径检查资源释放"],"pitfalls":["避免把指向临时 buffer 的裸指针在模块间长期保存","C++ 可以通过 RAII 帮助管理 RKNN 句柄和内存"],"checks":["主程序不直接混杂大量 RKNN 底层调用","重构前后的业务结果一致"],"homework":["设计一个同时适配多个分类模型的抽象推理接口"],"code":"project/\n├── CMakeLists.txt\n├── include/\n│   └── classifier.hpp\n├── src/\n│   ├── classifier.cpp\n│   ├── image_preprocess.cpp\n│   └── main.cpp\n├── models/\n└── test_images/"}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"把演示代码分成职责清晰的模块","explain":"分类应用至少有模型管理、输入预处理、推理执行、输出后处理、资源文件与日志六类职责。不要把 RKNN 初始化、图片读取、分类结果格式化都挤进 `main`；这样每次更换模型都容易误改接口。推荐将‘模型输入协议’和‘类别映射’封装为可验证的数据结构。","takeaway":"模块输入输出、错误返回和资源所有权都必须在接口文档中声明。"},{"title":"生命周期与 C++ RAII","explain":"用构造函数获取、析构函数释放资源可以减少 C API 在异常路径中的泄漏风险；同时需要考虑初始化失败的对象状态和禁止错误拷贝持有 RKNN context 的类。线程之间共享模型上下文是否安全，应以 SDK 文档为准，不能未经验证假设。","takeaway":"模型对象应提供明确 init/infer/reset 语义，并保证重复销毁安全。"},{"title":"分层测试和版本回归","explain":"预处理单测可检查像素、resize 后 shape；后处理单测可用固定 scores 校验 top-k；真实推理集成测试用保存的样例图和 label 输出。升级 SDK、换量化模型或变更图像库后，先运行单元测试，再上板测试与压力测试。","takeaway":"能够不用启动 NPU 就验证大部分业务逻辑，缩小真实硬件调试范围。"}],"lab":[{"title":"设计 C++ 接口","action":"画类图：ImagePreprocessor、RknnClassifier、TopKPostprocessor，定义参数、返回值和资源归属。","verify":"接口中模型路径、tensor 属性和标签表不使用隐式全局变量。"},{"title":"测试纯后处理","action":"为固定 scores 数组实现 top-k，并验证相同得分、越界索引及标签表长度异常。","verify":"处理结果与手工计算一致，错误输入会返回可解释状态。"},{"title":"回归前处理","action":"用统一图片测试 Python 与 C++ 的 resize、颜色顺序和归一化结果，比较数值差异。","verify":"包含容许的数值公差与实际差异记录。"}],"diagnosis":[{"symptom":"出现双重释放或崩溃","reason":"资源所有者不明确、包含上下文的对象被错误复制。","check":"检查构造/析构路径，必要时禁止 copy 并明确 move 语义。"},{"symptom":"更新预处理后分类结果变化","reason":"库版本、插值方式或通道布局被悄然改动。","check":"保存输入 tensor 的回归测试和比较阈值。"}],"case":{"problem":"封装类在函数返回后崩溃，原因是两个对象持有同一个 rknn_context 并在析构中销毁。应如何设计？","analysis":"让上下文拥有单一所有权，禁止复制或正确实现移动语义；封装初始化失败状态与显式释放。在需要多实例时，为每个实例清楚指定 SDK 允许的上下文创建/线程调用方式。","evidence":"简化类接口、复制/移动测试和资源释放日志。"},"snippet":"// C++ 资源所有权示意（非完整 SDK 工程）\nclass Classifier {\npublic:\n  Classifier(const Classifier&) = delete;\n  Classifier& operator=(const Classifier&) = delete;\n  ~Classifier() { /* 仅在有效时 rknn_destroy(ctx_) */ }\nprivate:\n  // rknn_context ctx_{};  // 引入 rknn_api.h 后启用\n};","refs":[["Model Zoo C++ 分类范例","https://github.com/airockchip/rknn_model_zoo"],["RKNPU2 API","https://github.com/rockchip-linux/rknpu2"],["C++ Core Guidelines","https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines"]],"walkthrough":{"intro":"把图片预处理、SDK 推理和分类 Top-K 后处理分开，形成可用于替换模型的最小代码结构，而不额外创造复杂框架。","flow":["图片与模型协议","ImagePreprocess","InferenceBackend","TopKPostprocess","类别与分数"],"steps":[{"api":"预处理模块：纯函数、可单独核对","input":"图片、RGB/BGR、224×224、layout 和 dtype","output":"正确 dtype/shape 的 ndarray","why":"改变模型时集中修改预处理，不应让 RKNN SDK 层猜图像颜色。","code":"tensor = preprocess(image, width=224, height=224)\nassert tensor.shape == (224, 224, 3)"},{"api":"推理模块：只负责 SDK 与模型生命周期","input":"预处理张量与有效 RKNN 模型","output":"分类输出张量","why":"只负责初始化和调用 Runtime，不应读取标签文件或执行 NMS。","code":"scores = backend.infer(tensor)\n# SDK 层只返回模型输出数组"},{"api":"后处理模块：只负责排序及映射","input":"scores 与对应模型标签","output":"Top-5 的 id/score/label","why":"先按分数排序，再按对应的标签索引映射；不要把未归一化 logits 直接叫概率。","code":"indices = np.argsort(scores.reshape(-1))[::-1][:5]\nlabels_top5 = [labels[int(i)] for i in indices]"}],"example":"检查职责边界：preprocess 不 import rknnlite、backend 不负责读取摄像头、top-k 不管理 rknn_context。只追求清晰可学，不要求插件式复杂架构。","acceptance":"复用同一模型/图片，在 Python 和 C++ 里输出一致的输入 shape、类别排序和关键结果；板端仍须实测。"},"guidance":{"phases":[{"title":"准备模型、输入与真实 SDK","action":"在动手封装前写出 preprocess→infer→topk 的数据类型和返回值，准备真实模型与图片。","command":"","observe":"关键输入为 图片、RGB/BGR、224×224、layout 和 dtype；该步骤应产生 正确 dtype/shape 的 ndarray。","diagnose":"类别输出不合理时分别比较前处理张量与 Top-K 排序；不要把标签或图片读取逻辑放进 SDK 接口。","teach":"先当场展示模型/输入文件与张量契约，确定 PC 和板端边界。"},{"title":"执行课内核心示范","action":"在正确运行环境中执行命令并保存实际输出；需要 SDK/模型/图片时使用真实路径。","command":"python3 examples/lesson_28.py --onnx /path/to/model.onnx --images /path/to/test.jpg --topk 5 --output build/lesson28/results.json","observe":"使用真实 ONNX 分类模型和图片运行，输出 Top-K JSON 和输入协议说明，不需要 ROCK 5B。","diagnose":"类别输出不合理时分别比较前处理张量与 Top-K 排序；不要把标签或图片读取逻辑放进 SDK 接口。","teach":"对照返回码、输入 shape、Top-K 或检测框解释运行日志。"},{"title":"对照结果并判定验收","action":"接口只保留必要的三种数据契约：图片到 Tensor、Tensor 到 outputs、outputs 到语义结果。并非所有课程示例都实现同一个框架；第 28 讲的 ONNX 封装与第 25 讲 C++ SDK 分类属于可对照的不同层级。","command":"python3 -c \"import json;j=json.load(open('build/lesson28/results.json'));print(type(j).__name__)\"","observe":"模型要求 `(224,224,3)` uint8，若某次重构让预处理返回 `(1,3,224,224)` float32，SDK 类仍能创建对象却无法按旧协议运行。分别测试处理后的 shape/dtype 与 Top-K 函数，再联调真实 Runtime，比把全部处理塞到一段 main() 更便于发现错误。","diagnose":"复用同一模型/图片，在 Python 和 C++ 里输出一致的输入 shape、类别排序和关键结果；板端仍须实测。","teach":"要求学生说明输入与输出为什么有意义，不用 CI mock 代替设备实测。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
