<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自动生成部署C代码｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":23,"title":"自动生成部署C代码","intro":"利用工具链自动生成 C 推理代码骨架。","goals":["认识自动生成代码 API 的定位","分清 SDK 模板和模型专用后处理","将生成代码编译为可维护的板端程序"],"core":"部分 SDK 版本支持自动生成基础 C 部署代码，用于快速对接推理 API。课程指出生成的代码不一定包含分类 top-k、检测 NMS、标签显示等完整业务逻辑，因此只能当作起点；真正上线还需要错误处理、资源释放、预处理/后处理和性能测试。","steps":["核对 SDK 版本是否具有代码生成功能","对已有验证模型生成示例代码目录","阅读模型初始化、输入设置、推理、结果输出和释放调用","补充模型专用的图像处理、分类/检测后处理","构建后部署到 RK3588，与 Python 版本输出比对"],"pitfalls":["生成代码未必适合直接用于生产","自动生成的分类结果解析可能不包含 top-k 或标签表"],"checks":["能够列出自动生成部分与需要自行开发部分","遇到加载失败或推理失败能正确回收资源"],"homework":["审查生成代码并列出至少 5 个可维护性改进点"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"生成代码只是起点","explain":"RKNN 的部署代码生成能力或官方模板可以缩短模型加载、输入输出属性查询、运行循环和资源释放等样板代码的开发时间，但并不知道所有业务数据的含义。图像格式、类别表、NMS、坐标映射、错误恢复和日志仍需按当前模型与应用场景自行实现。","takeaway":"编译通过不代表应用功能完成；要进行从图片到业务输出的完整验收。"},{"title":"阅读生成工程的结构","explain":"一个可维护项目通常分为主程序、模型上下文、预处理、执行器、后处理、工具函数和 CMake 工程。阅读时先找 `rknn_init` 和 `rknn_destroy` 的配对、输入 tensor 属性和错误返回，再追踪检测结果如何映射到图像坐标。","takeaway":"明确函数负责的资源和数据所有权，杜绝失败路径遗漏释放。"},{"title":"验证生成代码与具体 SDK","explain":"生成器接口、输出目录和工程结构与 SDK release 有关，应参考当前版本说明。平台 CMake 交叉编译时，头文件、动态库和目标工具链必须都属于正确的目标架构。生成代码需要实际板端功能测试和异常输入测试。","takeaway":"为工程准备良好的错误码和日志，并保存二进制架构检查输出。"}],"lab":[{"title":"认识模板入口","action":"在官方 Model Zoo 或 Toolkit2 的对应版本中查找 C/C++ demo 与代码生成说明。","verify":"记录原始仓库 commit、目标平台和导出文件列表。"},{"title":"画调用关系","action":"从 main 到初始化、query、输入、推理、取输出、后处理和销毁绘制调用图。","verify":"每处 `alloc/init/get` 有可追踪的 release/destroy。"},{"title":"做异常场景表","action":"列出模型文件不存在、错误 tensor shape、内存申请失败及 SDK 返回失败时的处理逻辑。","verify":"每种情况可以安全退出，不留下悬挂资源。"}],"diagnosis":[{"symptom":"生成项目编译成功运行失败","reason":"模型与 runtime 不兼容、缺少动态库或输入属性错误。","check":"用 file/ldd/查询 tensor 属性逐步定位。"},{"symptom":"检测框缺失","reason":"模板未实现当前检测头的解码、NMS 和坐标映射。","check":"核对模型输出语义与官方示例后处理路径。"}],"case":{"problem":"代码生成器输出的 demo 能初始化 RKNN，但图片始终没有检测框。是否生成器有 bug？","analysis":"不一定。生成器可能只提供通用 API 骨架而没有适配模型专有的后处理。必须检查输出 tensor 的 layout、类别数、坐标编码和 NMS。","evidence":"输入输出属性、业务后处理实现、样例图片与 expected outputs。"},"snippet":"// 通用生命周期伪代码，不是可以直接编译的完整程序\ninit_model(); query_tensors();\npreprocess_image(); set_inputs(); run_inference();\nget_outputs(); decode_and_nms(); release_outputs();\ndestroy_model();\n// 所有步骤检查返回码，失败路径也执行释放。","refs":[["RKNPU2 SDK 示例","https://github.com/rockchip-linux/rknpu2"],["官方 Model Zoo C++ 工程","https://github.com/airockchip/rknn_model_zoo"]]}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
