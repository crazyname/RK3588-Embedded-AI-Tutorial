<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deepseek · Qwen大模型部署｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":34,"title":"Deepseek · Qwen大模型部署","intro":"认识 RKLLM 工具链并在 RK3588 上推理语言模型。","goals":["了解 RKLLM 与 RKNN 图像模型工具链的区别","理解量化、内存和上下文长度对部署的影响","完成一组可复现的板端文本生成测试"],"core":"大语言模型在 Rockchip 平台可使用 RKLLM 相关工具链：获取被当前工具支持的原始权重，按 SDK 说明转换与量化为目标格式，再由板端运行时加载模型进行文本生成。这里的文件格式、运行时与图像分类/检测所用 RKNN API 不是一回事。选型应核对所需内存、KV cache、上下文长度、模型许可、实际 tokens/s 和首 token 延迟。","steps":["确认 RK3588 的内存容量、板端运行时与驱动","从官方支持矩阵选择可在目标硬件上运行的 Qwen/DeepSeek 具体版本","获取有合法使用许可的模型权重并记录来源与版本","按对应 RKLLM SDK 文档执行转换与量化","部署模型和配套运行时，检查内存、加载时间及运行日志","执行中文问答、连续对话和常识问题，记录首 token 延迟与 tokens/s","对比不同量化参数和上下文窗口对性能的影响"],"pitfalls":["不是所有 Qwen/DeepSeek 规模和版本都支持 RK3588","上下文增长会增加 KV cache 占用并影响推理效率","生成看似流畅不等于回答事实正确"],"checks":["板端可以完成至少一轮文本生成","能够报告模型完整名称、量化类型和运行时版本"],"homework":["制作一份边缘端大模型选型表：内存、模型大小、量化方案、速度"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"大模型与卷积模型的工具链不同","explain":"RK3588 上的语言模型推理通常走 RKLLM-Toolkit（主机模型转换与量化）与 RKLLM Runtime（板端 C/C++）链路，而不是直接将任意大语言模型塞进 RKNN-Toolkit2 的 CNN 推理 API。官方 RKLLM 仓库提供支持平台与模型家族清单；具体模型、上下文长度、量化策略与 API 参数都要与当前版本核对。","takeaway":"先区分 RKNN（一般视觉网络）与 RKLLM（大语言模型）工具链。"},{"title":"量化权重和 KV cache 的内存预算","explain":"粗略估算：参数量 P、每参数 b 位时，仅权重理论储存约 P×b/8 字节，但实际模型还包含量化 scale/metadata、激活、运行时工作区和 KV cache。上下文长度越长，KV cache 对内存与速度的影响通常越明显。比如 1.5B 参数的 4-bit 权重理论下界约 0.75GB，并非真实总占用，更不保证该量化格式由 SDK 支持。","takeaway":"选模型先算权重下界、可用 RAM 和上下文预算，再查 RKLLM 支持矩阵。"},{"title":"生成性能与安全性评估","explain":"语言模型常用首 token 延迟 TTFT、decode tokens/s、峰值内存和上下文长度评价体验。模型能打印文本不表示理解正确：需要固定提示词测试中文、事实性、指令遵从，记录随机性参数、空响应和幻觉。边缘设备还要处理热降频、长上下文 OOM 和中断释放。","takeaway":"测试报告包括模型来源、量化配置、TTFT、tokens/s、RAM、温度与固定提示词输出。"}],"lab":[{"title":"选一个受支持的小模型","action":"读取 RKLLM 官方 README 的当前支持模型列表，根据开发板 RAM 选择一个入门规模的 Qwen 或 DeepSeek-R1-Distill 类模型。","verify":"模型家族、精确模型版本和 SDK 支持条件记录齐全。"},{"title":"完成内存预算","action":"按参数和位宽计算权重理论下界，再为 KV cache、运行时与系统服务留出预算；记录实际可用内存。","verify":"说明为何模型文件大小小于实际运行需求。"},{"title":"运行并评价输出","action":"依照匹配 release 的官方 quick start 在可用设备部署，准备十条固定中文提示词，记录 TTFT/tokens/s 与峰值 RAM。","verify":"输出包含提示词、响应、随机性设置与失败/超时日志。"}],"diagnosis":[{"symptom":"模型加载时内存不足","reason":"权重和 KV cache/工作区总需求超过可用内存。","check":"降低模型规模或上下文要求，记录真实占用而非只看文件大小。"},{"symptom":"生成极慢或随时间下降","reason":"KV cache、热节流、量化支持或 CPU/NPU 调度存在瓶颈。","check":"采集首 token、稳态 tokens/s、温度与并发情况。"}],"case":{"problem":"某用户看到 4-bit 7B 权重理论只需约 3.5GB，于是断言 4GB RK3588 一定能运行。这个结论哪里有问题？","analysis":"3.5GB 只是权重理论下界，不含运行时工作区、scale、KV cache 和操作系统；设备可用 RAM 通常还小于总 RAM。还须确认 SDK 是否支持该模型、量化格式和上下文配置。","evidence":"模型参数数、实际量化产物大小、可用 RAM、上下文长度及运行日志。"},"snippet":"params=1_500_000_000\nbits=4\nweight_gb=params*bits/8/1e9\nprint(f'1.5B 参数 4-bit 权重理论下界约 {weight_gb:.2f} GB')\n# 实际还需要量化元数据、KV cache、运行工作区和操作系统内存。","refs":[["官方 RKLLM 工具链与支持模型","https://github.com/airockchip/rknn-llm"],["《动手学深度学习》Transformer","https://d2l.com.cn/"],["《Deep Learning》理论基础","https://www.deeplearningbook.org/"]],"walkthrough":{"intro":"第 32 讲使用 RKLLM Runtime 的 C API 而非 CNN 的 RKNN API。重点是模型内存预算、C++ 回调数据、结束状态和文本分片不能当作 token 数。","flow":["合法兼容 .rkllm","rkllm_init","输入提示词","rkllm_run","RUN_NORMAL 文字回调","RUN_FINISH / destroy"],"steps":[{"api":"rkllm_createDefaultParam 与 rkllm_init","input":"转换后的 .rkllm、上下文长度、max_new_tokens","output":"有效 LLMHandle 和已初始化模型","why":"参数及模型必须与 ARM64 runtime 版本匹配；大小和 KV cache 在运行时均消耗内存。参数初始化成功不表示已生成任何文本。","code":"RKLLMParam p = rkllm_createDefaultParam();\np.model_path = model_path.c_str();\np.max_new_tokens = 128;\nrkllm_init(&handle, &p, &callback);"},{"api":"rkllm_run 与回调状态","input":"RKLLMInput(PROMPT) 与同步推理参数","output":"RUN_NORMAL 文本分片、RUN_FINISH 结束或 RUN_ERROR","why":"RUN_NORMAL 返回的是字符串片段，不一定恰好一个 token；必须等到 RKLLM_RUN_FINISH 并检查 run 返回码，才算生成流程完整。","code":"int callback(RKLLMResult* r, void* ctx, LLMCallState state) {\n  if (state == RKLLM_RUN_NORMAL && r && r->text) std::cout << r->text;\n  if (state == RKLLM_RUN_FINISH) { /* mark finished */ }\n  return 0;\n}"},{"api":"performance report：不要用文本块数冒充 TPS","input":"第一次文本回调墙钟时延与可选 SDK perf 字段","output":"first_text_chunk_ms、sdk_generate_tokens / sdk_tokens_per_sec（如有）","why":"若 SDK 不提供真实 generate_tokens 和 generate_time_ms，正确输出 null。TTFT 可能不等于首次文本回调；总墙钟时间包括不同阶段，需标清口径。","code":"// 仅当 SDK 有效提供两个数据才计算：\n// tokens_per_second = generate_tokens * 1000 / generate_time_ms"}],"example":"只算权重理论下限：1.5B 参数、4-bit ≈ 1.5×10^9×4/8 = 0.75GB（十进制）；真实内存还包括量化元数据、KV cache、工作区和操作系统，不能只按此数选板卡。","acceptance":"在真实 ROCK 5B 记录模型/runtime 版本、提示词、完成回调与生成文本；没有板端日志只能验收 Fake SDK 下的调用流程，不可宣称大模型实测部署成功。"},"guidance":{"phases":[{"title":"先校对模型和真实输入","action":"在真实 ROCK 5B 上准备匹配的 .rkllm、Runtime 及 C++/官方演示程序，并确认可用内存和供电散热。","command":"","observe":"关键输入为 转换后的 .rkllm、上下文长度、max_new_tokens；正确输出应为 有效 LLMHandle 和已初始化模型。","diagnose":"加载失败核对模型格式与 Runtime 兼容；回调没有结束标记要检查运行返回码和错误状态，不统计虚构 token 数。","teach":"展示实际模型来源、类别/输出头形状及主机与板端角色。"},{"title":"教师演示一条可运行路径","action":"在正确的 PC 或 ROCK 5B 环境执行；路径占位符须替换为已取得的真实资源。","command":"python3 examples/lesson_34.py --program /path/to/rkllm_demo --model /path/to/model.rkllm --prompt '请用一句话介绍RK3588' --output build/lesson34/rkllm_run.json","observe":"真实运行所指定的外部 RKLLM 可执行程序，保存返回码及 stdout/stderr；原生 C++ 示例需另按 RKLLM 工程手册构建。","diagnose":"加载失败核对模型格式与 Runtime 兼容；回调没有结束标记要检查运行返回码和错误状态，不统计虚构 token 数。","teach":"结合当前 SDK 对参数逐一解释，检查结果是否可复现。"},{"title":"学生验收：解释结果与技术边界","action":"先核对 SoC、BSP、RKLLM Toolkit/Runtime 版本与模型格式，再用短 prompt 建立真实流式输出记录；区分外部 Demo 启动器 `lesson_34.py` 和原生 C++ RKLLM 回调程序。保存生成文本、完成状态、耗时和硬件内存，而非展示假语言模型分数。","command":"python3 -c \"import json;j=json.load(open('build/lesson34/rkllm_run.json'));print(sorted(j.keys()))\"","observe":"理论权重下限：1.5B 参数×4bit/8≈0.75GB（十进制），但运行时还需量化元数据、KV cache、暂存激活与 OS 内存。单靠 `.rkllm` 文件大小不能推算设备峰值内存。生成速度只有当 SDK 返回真实 tokens 与生成时长时才能计算，首次文本块墙钟耗时不自动等于严格的 TTFT。","diagnose":"在真实 ROCK 5B 记录模型/runtime 版本、提示词、完成回调与生成文本；没有板端日志只能验收 Fake SDK 下的调用流程，不可宣称大模型实测部署成功。","teach":"问学生为何 PC 成功、转换成功和 NPU 推理成功是不同层次的证据。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
