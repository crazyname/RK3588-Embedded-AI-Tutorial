<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deepseek · Qwen大模型部署｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":34,"title":"Deepseek · Qwen大模型部署","intro":"认识 RKLLM 工具链并在 RK3588 上推理语言模型。","goals":["了解 RKLLM 与 RKNN 图像模型工具链的区别","理解量化、内存和上下文长度对部署的影响","完成一组可复现的板端文本生成测试"],"core":"大语言模型在 Rockchip 平台可使用 RKLLM 相关工具链：获取被当前工具支持的原始权重，按 SDK 说明转换与量化为目标格式，再由板端运行时加载模型进行文本生成。这里的文件格式、运行时与图像分类/检测所用 RKNN API 不是一回事。选型应核对所需内存、KV cache、上下文长度、模型许可、实际 tokens/s 和首 token 延迟。","steps":["确认 RK3588 的内存容量、板端运行时与驱动","从官方支持矩阵选择可在目标硬件上运行的 Qwen/DeepSeek 具体版本","获取有合法使用许可的模型权重并记录来源与版本","按对应 RKLLM SDK 文档执行转换与量化","部署模型和配套运行时，检查内存、加载时间及运行日志","执行中文问答、连续对话和常识问题，记录首 token 延迟与 tokens/s","对比不同量化参数和上下文窗口对性能的影响"],"pitfalls":["不是所有 Qwen/DeepSeek 规模和版本都支持 RK3588","上下文增长会增加 KV cache 占用并影响推理效率","生成看似流畅不等于回答事实正确"],"checks":["板端可以完成至少一轮文本生成","能够报告模型完整名称、量化类型和运行时版本"],"homework":["制作一份边缘端大模型选型表：内存、模型大小、量化方案、速度"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"大模型与卷积模型的工具链不同","explain":"RK3588 上的语言模型推理通常走 RKLLM-Toolkit（主机模型转换与量化）与 RKLLM Runtime（板端 C/C++）链路，而不是直接将任意大语言模型塞进 RKNN-Toolkit2 的 CNN 推理 API。官方 RKLLM 仓库提供支持平台与模型家族清单；具体模型、上下文长度、量化策略与 API 参数都要与当前版本核对。","takeaway":"先区分 RKNN（一般视觉网络）与 RKLLM（大语言模型）工具链。"},{"title":"量化权重和 KV cache 的内存预算","explain":"粗略估算：参数量 P、每参数 b 位时，仅权重理论储存约 P×b/8 字节，但实际模型还包含量化 scale/metadata、激活、运行时工作区和 KV cache。上下文长度越长，KV cache 对内存与速度的影响通常越明显。比如 1.5B 参数的 4-bit 权重理论下界约 0.75GB，并非真实总占用，更不保证该量化格式由 SDK 支持。","takeaway":"选模型先算权重下界、可用 RAM 和上下文预算，再查 RKLLM 支持矩阵。"},{"title":"生成性能与安全性评估","explain":"语言模型常用首 token 延迟 TTFT、decode tokens/s、峰值内存和上下文长度评价体验。模型能打印文本不表示理解正确：需要固定提示词测试中文、事实性、指令遵从，记录随机性参数、空响应和幻觉。边缘设备还要处理热降频、长上下文 OOM 和中断释放。","takeaway":"测试报告包括模型来源、量化配置、TTFT、tokens/s、RAM、温度与固定提示词输出。"}],"lab":[{"title":"选一个受支持的小模型","action":"读取 RKLLM 官方 README 的当前支持模型列表，根据开发板 RAM 选择一个入门规模的 Qwen 或 DeepSeek-R1-Distill 类模型。","verify":"模型家族、精确模型版本和 SDK 支持条件记录齐全。"},{"title":"完成内存预算","action":"按参数和位宽计算权重理论下界，再为 KV cache、运行时与系统服务留出预算；记录实际可用内存。","verify":"说明为何模型文件大小小于实际运行需求。"},{"title":"运行并评价输出","action":"依照匹配 release 的官方 quick start 在可用设备部署，准备十条固定中文提示词，记录 TTFT/tokens/s 与峰值 RAM。","verify":"输出包含提示词、响应、随机性设置与失败/超时日志。"}],"diagnosis":[{"symptom":"模型加载时内存不足","reason":"权重和 KV cache/工作区总需求超过可用内存。","check":"降低模型规模或上下文要求，记录真实占用而非只看文件大小。"},{"symptom":"生成极慢或随时间下降","reason":"KV cache、热节流、量化支持或 CPU/NPU 调度存在瓶颈。","check":"采集首 token、稳态 tokens/s、温度与并发情况。"}],"case":{"problem":"某用户看到 4-bit 7B 权重理论只需约 3.5GB，于是断言 4GB RK3588 一定能运行。这个结论哪里有问题？","analysis":"3.5GB 只是权重理论下界，不含运行时工作区、scale、KV cache 和操作系统；设备可用 RAM 通常还小于总 RAM。还须确认 SDK 是否支持该模型、量化格式和上下文配置。","evidence":"模型参数数、实际量化产物大小、可用 RAM、上下文长度及运行日志。"},"snippet":"params=1_500_000_000\nbits=4\nweight_gb=params*bits/8/1e9\nprint(f'1.5B 参数 4-bit 权重理论下界约 {weight_gb:.2f} GB')\n# 实际还需要量化元数据、KV cache、运行工作区和操作系统内存。","refs":[["官方 RKLLM 工具链与支持模型","https://github.com/airockchip/rknn-llm"],["《动手学深度学习》Transformer","https://d2l.com.cn/"],["《Deep Learning》理论基础","https://www.deeplearningbook.org/"]]}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
