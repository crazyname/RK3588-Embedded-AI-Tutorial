<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RKNPU2—通用C API｜RK3588 HTML 教学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":25,"title":"RKNPU2—通用C API","intro":"掌握板端 C/C++ 通用推理 API 的完整生命周期。","goals":["了解 `rknn_init`、`rknn_query`、`rknn_run` 等接口","理解输入输出张量与资源所有权","完成 RK3588 上的 CMake/交叉编译/推理"],"core":"C API 的关键路径是初始化上下文 `rknn_init` → 查询输入输出属性 `rknn_query` → 设置输入 `rknn_inputs_set` → 执行 `rknn_run` → 取结果 `rknn_outputs_get` → 释放输出 `rknn_outputs_release` → 销毁上下文 `rknn_destroy`。具体还包括读取模型、预处理、结果解码以及每一步的错误码检查。","steps":["获取 RK3588 适配的头文件、librknnrt 和官方示例","初始化模型上下文并获取输入输出形状、dtype、format、量化参数","将图像转换为模型要求的输入张量并设置通用 I/O","运行推理、读取输出、完成 top-k 或检测解码","释放输出 buffer、上下文和临时图像缓存","在开发机交叉编译或直接在开发板编译，核对运行时链接"],"checks":["程序输出正确的模型输入输出属性","任何失败分支都能正确释放资源"],"pitfalls":["模型输入设置要与真实数据的 dtype、layout 一致","在交叉编译环境中注意 aarch64 和 x86_64 库的区别","通用 API 可能存在额外的数据拷贝与布局转换"],"homework":["设计一份带错误处理与资源释放的 C API 调用顺序图"],"code":"rknn_init\n  ↓\nrknn_query（查询输入输出属性）\n  ↓\nrknn_inputs_set（设置输入）\n  ↓\nrknn_run（执行推理）\n  ↓\nrknn_outputs_get → 后处理 → rknn_outputs_release\n  ↓\nrknn_destroy（销毁上下文）"}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
