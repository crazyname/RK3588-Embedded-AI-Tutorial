<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型性能评估｜RK3588 自学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":15,"title":"模型性能评估","intro":"建立可复现的 NPU 与端到端性能基线。","goals":["区分模型推理耗时、整体帧率与吞吐","理解性能评估接口和逐层调试信息","设计公平的性能实验"],"core":"RKNN 工具链提供推理性能评估接口，详细逐层统计可能需要在初始化运行时时开启性能调试配置。业务端到端耗时还包含图像采集、Resize、颜色转换、内存搬运、后处理和显示。实验应记录板卡、驱动、运行库、量化模式、频率、温度、输入分辨率与预热次数，避免从单次测量得出结论。","steps":["冻结模型、测试图片、线程数与运行参数","进行必要预热，连续测量多轮推理","分别记录 NPU 运行时间和应用端到端时间","如需定位瓶颈，再启用按层性能分析","计算平均延迟、p95 延迟、吞吐与长时间稳定 FPS"],"pitfalls":["开启 profiler 可能影响实际运行耗时","强制定频时应同步记录温度与供电条件","预处理与显示时间不可被误算为纯 NPU 时间"],"checks":["能给出测试条件完整的性能结果","能解释为何只报告理论峰值 TOPS 不充分"],"homework":["生成一张包含平均延迟、p95、FPS、温度的 benchmark 表"],"code":""}</script><script type="application/json" id="lesson-depth">{"concepts":[{"title":"区分核心推理与端到端时间","explain":"一次业务请求不仅包含 `rknn_run`，还包含输入读取、预处理、数据拷贝、后处理、显示与排队。串行链路里总延迟近似为各阶段之和，而流水线处理帧率还受最慢阶段限制。报告时必须说明时间边界、图像尺寸、模型版本、NPU 核数和量化类型。","takeaway":"只能在完整流水线相同的条件下比较 FPS；单独 NPU 速度不等于实际视频 FPS。"},{"title":"采用可靠统计方法","explain":"首次执行可能初始化内部缓存，正式测试应先 warm-up，然后记录几十次以上的执行时延。中位数 p50 反映常态，p95 刻画慢请求。关注长期温度与功耗造成的降频，避免只摘最优一次数字。","takeaway":"写明重复次数、采样期、温度和计时起止点。"},{"title":"单变量性能优化","explain":"测得哪个阶段占用最大时间，才有资格决定优化方向。如果 decode/resize 过慢，升级 NPU 核数可能无用；如果 CPU NMS 过慢，应先看候选框数量和数据结构。每项优化后重新对比精度与延迟。","takeaway":"优化报告必须同时列出基线、修改项、耗时、任务级精度和验证条件。"}],"lab":[{"title":"阶段计时","action":"把输入、预处理、推理、后处理四阶段加上 monotonic 时间戳，计算各段耗时占比。","verify":"各段总和可以解释整体延迟。"},{"title":"统计 p50/p95","action":"固定同一输入，多次测试并排序时延，报告中位数与尾延迟。","verify":"附带样本数、warm-up 次数和温度。"},{"title":"写比较报告","action":"选择优化前后两种条件，除了目标变量外维持输入、设备和代码一致。","verify":"结果包含 FPS、NPU 时延、端到端 p95 和精度。"}],"diagnosis":[{"symptom":"NPU 很快但总 FPS 很低","reason":"摄像头帧率、CPU 后处理或输入输出复制是系统瓶颈。","check":"测各阶段耗时与队列长度。"},{"symptom":"测试跑久后变慢","reason":"频率温度管理或资源泄漏。","check":"记录温度和 RSS、重复执行数据。"}],"case":{"problem":"NPU 平均只用 5ms，但应用只能处理 20FPS，应该先换模型吗？","analysis":"不应直接换模型。先拆成采集、预处理、NPU、后处理和显示，分析最慢阶段并记录是否存在队列。假如 CPU 后处理需 25ms，那么只提升 NPU 很可能无法显著改善总帧率。","evidence":"分段时延、端到端 FPS 和相同输入下的多次实验。"},"snippet":"import statistics\nms = [10.8, 11.2, 11.0, 10.9, 14.7, 11.1]\nms.sort()\nprint('p50=', statistics.median(ms))\nprint('approx_p95=', ms[int(.95*(len(ms)-1))])","refs":[["RKNN 官方性能评估","https://github.com/airockchip/rknn-toolkit2/tree/master/doc"],["RKNN Model Zoo 基准","https://github.com/airockchip/rknn_model_zoo"]],"walkthrough":{"intro":"第 15 讲的 lesson_15.py 通过重复启动外部真实程序计算墙钟 p50/p95，重点是说清统计范围和样本数，不能将全进程运行时间误当作 NPU kernel 时延。","flow":["真实外部命令","预热若干次","重复执行与计时","CSV wall_ms","p50/p95"],"steps":[{"api":"subprocess.run 测的是进程级墙钟时间","input":"可执行文件、命令行参数与真实模型","output":"每次启动、加载、执行及退出的总毫秒","why":"这种测量适合外部程序整体耗时，不隔离 RKNN 模型执行；与 SDK 内部的推理时间不是同一指标。","code":"start = time.perf_counter()\nsubprocess.run(cmd, check=True)\nwall_ms = (time.perf_counter() - start) * 1000"},{"api":"预热和重复采样","input":"--warmup 3、--runs 30","output":"30 个测量点及其 CSV","why":"预热次数不计入统计样本；每次测量固定同一图片和模型，不可同时改变 NPU 核数和摄像头输入。","code":"python3 examples/lesson_15.py --warmup 3 --runs 30 -- \\\n  /path/to/actual_demo /path/to/model.rknn /path/to/test.jpg"},{"api":"p50/p95 要与测量口径一起报告","input":"排序后的 N 个 wall_ms","output":"中位数和最近秩法 p95","why":"样本少时 p95 波动很大；采样间隔、温度、电源和 CPU/NPU 频率都可能影响结果。","code":"ordered = sorted(samples_ms)\np95 = ordered[math.ceil(0.95 * len(ordered)) - 1]"}],"example":"四个样本 10、12、14、20ms 按最近秩法 p95=20ms；这个例子只是统计计算，不是 RK3588 实测时延。","acceptance":"结果注明设备、模型、输入、warmup、runs 以及“外部进程总墙钟”口径；没有设备不能宣称测到 NPU FPS。"},"guidance":{"phases":[{"title":"先把输入、模型与运行环境对齐","action":"先选固定模型、图片、可执行文件及测量对象，明确 30 次 wall-ms 是否包含进程启动。","command":"","observe":"输入契约为 可执行文件、命令行参数与真实模型；此步目标输出 每次启动、加载、执行及退出的总毫秒。","diagnose":"程序实际返回错误时先看 stderr，不过滤失败耗时后继续声称基准有效；误差很大先检查频率和热状态。","teach":"把输入格式和主机/开发板角色写在黑板上。"},{"title":"运行可复现的最小代码","action":"在仓库根目录执行示范命令，先替换真实文件占位路径。","command":"python3 examples/lesson_15.py --warmup 3 --runs 30 -- /path/to/actual_demo /path/to/model.rknn /path/to/test.jpg","observe":"真实外部程序每次启动，写入 build/lesson15/latency.csv，打印 runs、p50、p95、mean；失败返回非零。","diagnose":"程序实际返回错误时先看 stderr，不过滤失败耗时后继续声称基准有效；误差很大先检查频率和热状态。","teach":"展示终端真实输出，对照字段解释代码数据流。"},{"title":"核对数值与验收边界","action":"对同一真实命令预热后采 30 次以上，报告 p50/p95/平均值、模型、温度和测量边界。若目标是 NPU core time，改用 SDK profiler/应用内分段打点；不要拿进程级 wall_ms 冒充纯 NPU FPS。","command":"python3 -c \"import csv; a=list(csv.DictReader(open('build/lesson15/latency.csv'))); print(len(a),a[0] if a else None)\"","observe":"假设串行采集+预处理共 10ms、NPU 5ms、后处理 5ms，总时延为 20ms，理论串行上限约 50FPS；将 NPU 缩到 2.5ms 后，总时延 17.5ms，最多约 57FPS。4 个样本 [10,12,14,20]ms 的最近秩 p95=20ms，不能只报最小 10ms。","diagnose":"结果注明设备、模型、输入、warmup、runs 以及“外部进程总墙钟”口径；没有设备不能宣称测到 NPU FPS。","teach":"要求解释结果能证明什么、尚不能证明什么。"}]}}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
