<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型性能评估｜RK3588 HTML 教学课件</title><link rel="stylesheet" href="../assets/style.css"></head><body><div id="app"></div><script type="application/json" id="lesson-data">{"id":15,"title":"模型性能评估","intro":"建立可复现的 NPU 与端到端性能基线。","goals":["区分模型推理耗时、整体帧率与吞吐","理解性能评估接口和逐层调试信息","设计公平的性能实验"],"core":"RKNN 工具链提供推理性能评估接口，详细逐层统计可能需要在初始化运行时时开启性能调试配置。业务端到端耗时还包含图像采集、Resize、颜色转换、内存搬运、后处理和显示。实验应记录板卡、驱动、运行库、量化模式、频率、温度、输入分辨率与预热次数，避免从单次测量得出结论。","steps":["冻结模型、测试图片、线程数与运行参数","进行必要预热，连续测量多轮推理","分别记录 NPU 运行时间和应用端到端时间","如需定位瓶颈，再启用按层性能分析","计算平均延迟、p95 延迟、吞吐与长时间稳定 FPS"],"checks":["能给出测试条件完整的性能结果","能解释为何只报告理论峰值 TOPS 不充分"],"pitfalls":["开启 profiler 可能影响实际运行耗时","强制定频时应同步记录温度与供电条件","预处理与显示时间不可被误算为纯 NPU 时间"],"homework":["生成一张包含平均延迟、p95、FPS、温度的 benchmark 表"],"code":""}</script><script src="../assets/catalog.js"></script><script src="../assets/extras.js"></script><script src="../assets/player.js"></script></body></html>
