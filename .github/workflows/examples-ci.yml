name: Validate runnable lesson code
on:
  push:
    paths:
      - "examples/**"
      - ".github/workflows/examples-ci.yml"
  workflow_dispatch:
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m compileall -q examples
      - name: Unit tests
        run: python -m unittest discover -s examples/tests -v
      - name: Smoke all 35 scripts
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory() as d:
              p=pathlib.Path(d)
              (p/"sample.onnx").write_bytes(b"test bytes only")
              (p/"sample.txt").write_text("sample")
              for i in range(35):
                  cmd=[sys.executable,f"examples/lesson_{i:02d}.py"]
                  if i==9:cmd+=["--input",str(p/"sample.onnx")]
                  elif i in (11,18):cmd+=["--input",str(p/"sample.txt")]
                  elif i==12:cmd+=["--help"]
                  result=subprocess.run(cmd,capture_output=True,text=True,check=True)
                  if i!=12:assert '"status": "ok"' in result.stdout,(i,result.stdout)
              print("35 entrypoints passed")
          PY
      - name: Check hardware script argument parsers
        run: |
          python examples/hardware/convert_onnx.py --help
          python examples/hardware/onnx_reference.py --help
          python examples/hardware/lite_infer.py --help
          python examples/hardware/export_yolo_onnx.py --help
