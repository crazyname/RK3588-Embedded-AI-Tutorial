name: Validate runnable lesson code
on:
  push:
    paths:
      - "examples/**"
      - "boards/**"
      - "tools/**"
      - "models/**"
      - "requirements/**"
      - "SETUP.md"
      - "README.md"
      - "courseware/**"
      - "docs/**"
      - ".github/workflows/examples-ci.yml"
  workflow_dispatch:
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: |
          python -m compileall -q examples
          python -m compileall -q boards/radxa-rock5b
      - name: Install dependencies for a REAL ONNX inference test
        run: python -m pip install --quiet numpy onnx onnxruntime pillow opencv-python-headless
      - name: Check course links and setup utilities
        run: |
          python tools/validate_repo.py
          python tools/bootstrap_host.py --group core
          python tools/verify_assets.py --list
          python -m unittest discover -s tools/tests -v
      - name: Verify all 35 long-scroll HTML lessons and JavaScript syntax
        run: |
          python tools/validate_html_lessons.py
          node --check courseware/assets/player.js
          node --check courseware/assets/catalog.js
          node --check courseware/assets/extras.js
      - name: Compile RKLLM native C++ using official header and test callback flow
        run: |
          mkdir -p build/rkllm-fake
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/airockchip/rknn-llm/main/rkllm-runtime/Linux/librkllm_api/include/rkllm.h -o build/rkllm-fake/rkllm.h
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only -Ibuild/rkllm-fake examples/hardware/rkllm/rkllm_stream.cpp
          g++ -std=c++17 -Wall -Wextra -Werror -Ibuild/rkllm-fake examples/hardware/rkllm/rkllm_stream.cpp examples/hardware/rkllm/tests/mock_rkllm_runtime.cpp -o build/rkllm-fake/rkllm_stream_mock
          python -m unittest discover -s examples/hardware/rkllm/tests -p 'test_*.py' -v
      - name: Cross-check C++ YOLOv8 detections against Python with REAL FP32 tensor files
        run: |
          mkdir -p build/yolov8-cpp
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            examples/hardware/yolov8_postprocess.cpp \
            examples/hardware/yolov8_decode_files.cpp \
            -o build/yolov8-cpp/yolov8_decode_files
          RK_YOLO_CPP_DECODER=build/yolov8-cpp/yolov8_decode_files \
            python -m unittest discover -s examples/hardware/tests -p 'test_yolov8_cpp_parity.py' -v
      - name: Unit tests
        run: python -m unittest discover -s examples/tests -v
      - name: Enforce all 35 dedicated sources and runbooks
        run: python examples/audit_course.py --strict
      - name: Smoke 35 course CLI interfaces
        run: |
          python - <<'PY'
          import subprocess, sys
          for n in range(35):
              result=subprocess.run(
                  [sys.executable, f"examples/lesson_{n:02d}.py", "--help"],
                  capture_output=True, text=True, check=True, timeout=20)
              assert "usage:" in result.stdout.lower(), (n, result.stdout, result.stderr)
          print("35 CLI interfaces checked; functional behavior is tested separately.")
          PY
      - name: Ensure all lessons are substantive programs with practical MD
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          for i in range(35):
              src=Path(f"examples/lesson_{i:02d}.py")
              body=src.read_text(encoding="utf8")
              assert len(body.splitlines()) >= 20, i
              assert "from labs import main" not in body, i
              note=Path("examples/LESSON_27.md" if i==27 else f"examples/notes/lesson_{i:02d}.md")
              assert note.is_file() and len(note.read_text(encoding="utf8")) > 200, i
              out=subprocess.run([sys.executable,str(src),"--help"],check=True,capture_output=True,text=True)
              assert "usage:" in out.stdout.lower(), i
          print("35 real CLI programs + 35 nonduplicative practical guides verified")
          PY
      - name: Check RKNPU2 C++ source against official RK3588 SDK header
        run: |
          mkdir -p build/sdk-headers
          curl --fail --location --retry 3 --silent --show-error             https://raw.githubusercontent.com/rockchip-linux/rknpu2/master/runtime/RK3588/Linux/librknn_api/include/rknn_api.h             -o build/sdk-headers/rknn_api.h
          g++ -std=c++17 -fsyntax-only -Ibuild/sdk-headers examples/hardware/rknn_classify.cpp
          g++ -std=c++17 -fsyntax-only -Ibuild/sdk-headers examples/hardware/rknn_zero_copy.cpp
          g++ -std=c++17 -fsyntax-only -Ibuild/sdk-headers examples/hardware/rknn_compare_input_io.cpp
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only -Ibuild/sdk-headers examples/hardware/rknn_yolov8_raw.cpp
      - name: Test actual YOLOv8 C API main against explicit MOCK RKNN runtime
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Ibuild/sdk-headers \
            examples/hardware/rknn_yolov8_raw.cpp \
            examples/hardware/yolov8_postprocess.cpp \
            examples/hardware/tests/mock_rknn_yolov8.cpp \
            -o build/yolov8-cpp/rknn_yolov8_mock
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          folder=Path('build/yolov8-cpp');folder.mkdir(parents=True,exist_ok=True)
          (folder/'ONLY_A_MOCK.rknn').write_bytes(b'FAKE RKNPU2 MODEL ONLY')
          (folder/'black.rgb').write_bytes(bytes(640*640*3))
          cmd=[str(folder/'rknn_yolov8_mock'),str(folder/'ONLY_A_MOCK.rknn'),str(folder/'black.rgb'),'640','480','.25','2']
          run=subprocess.run(cmd,text=True,capture_output=True,check=True,timeout=60)
          obj=json.loads(run.stdout)
          assert obj['backend']=='rknpu2-c-api' and obj['runs']==2,obj
          assert len(obj['detections'])==1,obj
          assert obj['detections'][0]['class_id']==2,obj
          assert abs(obj['detections'][0]['score']-.93)<1e-5,obj
          assert all(abs(x-y)<1e-3 for x,y in zip(obj['detections'][0]['xyxy'],[316,236,332,252])),obj
          (folder/'bad.rgb').write_bytes(b'short')
          bad=subprocess.run(cmd[:2]+[str(folder/'bad.rgb'),'640','480'],capture_output=True,text=True)
          assert bad.returncode!=0 and '640x640x3' in bad.stderr,bad.stderr
          print('RKNPU2 C++ API control flow passed with MOCK runtime, NOT real NPU')
          PY
      - name: Execute real C++ comparison control flow with EXPLICIT MOCK SDK
        run: |
          g++ -std=c++17 -Ibuild/sdk-headers examples/hardware/rknn_compare_input_io.cpp examples/hardware/tests/mock_rknn_api.cpp -o build/test_compare_input_io
          python - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('build/sdk-test')
          root.mkdir(parents=True,exist_ok=True)
          (root/'fake-model.rknn').write_bytes(b'FAKE MODEL ONLY FOR CI MOCK')
          (root/'rgb.raw').write_bytes(bytes(range(48)))
          command=['build/test_compare_input_io',str(root/'fake-model.rknn'),str(root/'rgb.raw'),'4','1']
          result=subprocess.run(command,text=True,capture_output=True,check=True)
          assert 'allclose_atol_0.01_rtol_0.01=true' in result.stdout,result.stdout
          assert 'input staging memcpy' not in result.stdout or 'CPU memcpy' in result.stdout
          assert 'standard calls mean_ms=' in result.stdout and 'bound_input calls mean_ms=' in result.stdout
          (root/'wrong.raw').write_bytes(bytes(range(10)))
          bad=subprocess.run(command[:2]+[str(root/'wrong.raw'),'1','0'],text=True,capture_output=True)
          assert bad.returncode!=0,bad.stdout
          print('C++ control flow verified using mock SDK, NOT a real NPU run')
          PY
      - name: Syntax-check RGA preprocessing against official librga headers
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/airockchip/librga.git build/librga
          git -C build/librga sparse-checkout set include
          g++ -std=c++17 -fsyntax-only -Ibuild/librga/include examples/hardware/rga_letterbox_rgb888.cpp

      - name: Check hardware script argument parsers
        run: |
          python examples/hardware/convert_onnx.py --help
          python examples/hardware/onnx_reference.py --help
          python examples/hardware/lite_infer.py --help
          python examples/hardware/export_yolo_onnx.py --help
          python examples/hardware/prepare_image.py --help
          python examples/hardware/compare_outputs.py --help
          python examples/hardware/create_tiny_onnx.py --help

      - name: Generate and execute actual tiny ONNX CNN
        run: |
          mkdir -p build/test-onnx
          python examples/hardware/create_tiny_onnx.py --onnx build/test-onnx/tiny.onnx --input-npy build/test-onnx/input.npy --input-raw build/test-onnx/input.raw
          python examples/hardware/onnx_reference.py --onnx build/test-onnx/tiny.onnx --input-npy build/test-onnx/input.npy --output build/test-onnx/out.npz
          python examples/hardware/compare_outputs.py --reference build/test-onnx/out.npz --candidate build/test-onnx/out.npz
          python - <<'PY'
          import numpy as np
          y=np.load("build/test-onnx/out.npz")["output_0"]
          assert y.shape == (1,2), y.shape
          assert np.allclose(y, [[0.5,0.25]], atol=1e-6), y
          print("Real ONNX Runtime output matches expected math:",y)
          PY


      - name: Verify real model-file encryption roundtrip
        run: |
          python -m pip install --quiet cryptography
          mkdir -p build/lesson18
          python examples/lesson_18.py generate-key --key-file build/lesson18/test.key
          python examples/lesson_18.py encrypt             --input build/test-onnx/tiny.onnx             --output build/lesson18/model.enc             --key-file build/lesson18/test.key
          python examples/lesson_18.py decrypt             --input build/lesson18/model.enc             --output build/lesson18/model.dec.onnx             --key-file build/lesson18/test.key
          cmp build/test-onnx/tiny.onnx build/lesson18/model.dec.onnx

      - name: Execute Lesson 27 with a real ONNX model and test image
        run: |
          python - <<'PY'
          from PIL import Image
          import pathlib
          directory = pathlib.Path("build/test-onnx")
          Image.new("RGB", (4,4), (128,64,0)).save(directory/"test.png")
          (directory/"labels.txt").write_text("red\n\green\n".replace("\\green","green"), encoding="utf8")
          PY
          python examples/lesson_27.py \
            --backend onnx --model build/test-onnx/tiny.onnx \
            --image build/test-onnx/test.png \
            --labels build/test-onnx/labels.txt \
            --width 4 --height 4 --normalize none \
            --topk 2 --warmup 1 --runs 2 \
            --output-json build/test-onnx/lesson27.json \
            --output-npz build/test-onnx/lesson27.npz
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("build/test-onnx/lesson27.json").read_text())
          assert report["backend"]=="onnx"
          assert report["topk"][0]["class_id"]==0
          assert report["topk"][0]["label"]=="red"
          assert report["topk"][0]["score"] > report["topk"][1]["score"]
          print("Lesson27 real ONNX inference passed.")
          PY

      - name: Execute independent software labs against real files
        run: |
          mkdir -p build/smoke/labels
          printf '0 0.5 0.5 0.4 0.2\n' > build/smoke/labels/sample.txt
          python examples/lesson_00.py --output build/smoke/env.json
          python examples/lesson_01.py --output build/smoke/board.json
          python examples/lesson_02.py --height 48 --width 48
          python examples/lesson_03.py --dot build/smoke/deploy.dot
          python examples/lesson_05.py --output build/smoke/python.json
          python examples/lesson_06.py --output build/smoke/npu.json
          python examples/lesson_07.py --samples 2 --interval 0 --output build/smoke/freq.csv
          python examples/lesson_10.py --image build/test-onnx/test.png --width 4 --height 4
          python examples/lesson_12.py --onnx build/test-onnx/tiny.onnx
          python examples/lesson_14.py --float build/test-onnx/out.npz --quantized build/test-onnx/out.npz
          python examples/lesson_16.py --pid 1 --samples 1 --interval 0
          python examples/lesson_17.py --output build/smoke/pruned.npz
          python examples/lesson_19.py --images build/test-onnx/test.png build/test-onnx/test.png --batch 2 --width 4 --height 4
          python examples/lesson_22.py --onnx build/test-onnx/tiny.onnx --output build/smoke/optimized.onnx --input-npy build/test-onnx/input.npy
          python examples/lesson_23.py --onnx build/test-onnx/tiny.onnx --compile
          python examples/lesson_28.py --onnx build/test-onnx/tiny.onnx --images build/test-onnx/test.png --labels build/test-onnx/labels.txt --width 4 --height 4
          python examples/lesson_31.py --labels build/smoke/labels

      - name: Validate ROCK 5B reference tools with mocks and real numpy preprocessing
        run: |
          python -m unittest discover -s boards/radxa-rock5b/tests -v
          python boards/radxa-rock5b/tools/board_probe.py --output build/test-onnx/rock5b-probe.json
          python boards/radxa-rock5b/tools/usb_camera_check.py --help
          python boards/radxa-rock5b/tools/run_official_yolov8.py --help
          python boards/radxa-rock5b/apps/mobilenet_image_lite.py --help
          python boards/radxa-rock5b/apps/camera_mobilenet_lite.py --help
          python boards/radxa-rock5b/apps/camera_yolov8_lite.py --help
          python boards/radxa-rock5b/tools/validate_camera_report.py --help
