name: Validate runnable lesson code
on:
  push:
    paths:
      - "examples/**"
      - "boards/**"
      - ".github/workflows/examples-ci.yml"
  workflow_dispatch:
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: |
          python -m compileall -q examples
          python -m compileall -q boards/radxa-rock5b
      - name: Install dependencies for a REAL ONNX inference test
        run: python -m pip install --quiet numpy onnx onnxruntime pillow
      - name: Unit tests
        run: python -m unittest discover -s examples/tests -v
      - name: Audit current lesson structure
        run: python examples/audit_course.py
      - name: Smoke 35 course CLI interfaces
        run: |
          python - <<'PY'
          import subprocess, sys
          for n in range(35):
              result=subprocess.run(
                  [sys.executable, f"examples/lesson_{n:02d}.py", "--help"],
                  capture_output=True, text=True, check=True, timeout=20)
              assert "usage:" in result.stdout.lower(), (n, result.stdout, result.stderr)
          print("35 CLI interfaces checked; functional behavior is tested separately.")
          PY
      - name: Check hardware script argument parsers
        run: |
          python examples/hardware/convert_onnx.py --help
          python examples/hardware/onnx_reference.py --help
          python examples/hardware/lite_infer.py --help
          python examples/hardware/export_yolo_onnx.py --help
          python examples/hardware/prepare_image.py --help
          python examples/hardware/compare_outputs.py --help
          python examples/hardware/create_tiny_onnx.py --help

      - name: Generate and execute actual tiny ONNX CNN
        run: |
          mkdir -p build/test-onnx
          python examples/hardware/create_tiny_onnx.py --onnx build/test-onnx/tiny.onnx --input-npy build/test-onnx/input.npy --input-raw build/test-onnx/input.raw
          python examples/hardware/onnx_reference.py --onnx build/test-onnx/tiny.onnx --input-npy build/test-onnx/input.npy --output build/test-onnx/out.npz
          python examples/hardware/compare_outputs.py --reference build/test-onnx/out.npz --candidate build/test-onnx/out.npz
          python - <<'PY'
          import numpy as np
          y=np.load("build/test-onnx/out.npz")["output_0"]
          assert y.shape == (1,2), y.shape
          assert np.allclose(y, [[0.5,0.25]], atol=1e-6), y
          print("Real ONNX Runtime output matches expected math:",y)
          PY


      - name: Execute Lesson 27 with a real ONNX model and test image
        run: |
          python - <<'PY'
          from PIL import Image
          import pathlib
          directory = pathlib.Path("build/test-onnx")
          Image.new("RGB", (4,4), (128,64,0)).save(directory/"test.png")
          (directory/"labels.txt").write_text("red\n\green\n".replace("\\green","green"), encoding="utf8")
          PY
          python examples/lesson_27.py \
            --backend onnx --model build/test-onnx/tiny.onnx \
            --image build/test-onnx/test.png \
            --labels build/test-onnx/labels.txt \
            --width 4 --height 4 --normalize none \
            --topk 2 --warmup 1 --runs 2 \
            --output-json build/test-onnx/lesson27.json \
            --output-npz build/test-onnx/lesson27.npz
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("build/test-onnx/lesson27.json").read_text())
          assert report["backend"]=="onnx"
          assert report["topk"][0]["class_id"]==0
          assert report["topk"][0]["label"]=="red"
          assert report["topk"][0]["score"] > report["topk"][1]["score"]
          print("Lesson27 real ONNX inference passed.")
          PY

      - name: Validate ROCK 5B reference tools with mocks and real numpy preprocessing
        run: |
          python -m unittest discover -s boards/radxa-rock5b/tests -v
          python boards/radxa-rock5b/tools/board_probe.py --output build/test-onnx/rock5b-probe.json
          python boards/radxa-rock5b/tools/usb_camera_check.py --help
          python boards/radxa-rock5b/tools/run_official_yolov8.py --help
          python boards/radxa-rock5b/apps/mobilenet_image_lite.py --help
